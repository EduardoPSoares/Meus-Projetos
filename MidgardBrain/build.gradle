plugins {
    id 'java'
    id 'eclipse'
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.0.1"
    id "com.gradleup.shadow" version "8.3.0"
}

group = 'me.ray'
version = '1.0.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:3.3.0-SNAPSHOT"
    compileOnly "net.luckperms:api:5.4"
    annotationProcessor "com.velocitypowered:velocity-api:3.3.0-SNAPSHOT"
    
    implementation "com.mysql:mysql-connector-j:8.2.0"
    implementation "com.zaxxer:HikariCP:5.1.0"
    implementation "org.xerial:sqlite-jdbc:3.45.1.0"
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.build.dependsOn tasks.shadowJar

shadowJar {
    archiveFileName = "MidgardBrain.jar"
    
    // Reloca as dependências para evitar conflitos com outros plugins
    relocate 'com.zaxxer.hikari', 'me.ray.midgardDiscord.libs.hikari'
    relocate 'com.mysql', 'me.ray.midgardDiscord.libs.mysql'
    relocate 'org.sqlite', 'me.ray.midgardDiscord.libs.sqlite'
}

task copyToPlugins(type: Copy) {
    from shadowJar
    // into file("C:/Users/ray/Desktop/servidor/velocity/plugins")
    into layout.buildDirectory.dir("libs")
}

