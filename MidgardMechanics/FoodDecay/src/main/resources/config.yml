# ── Receitas de Caldeirão ───────────────────────────────────
# Clique direito em caldeirão com água + comida para criar ensopados.
cauldron-recipes:
  enabled: true
  max-ingredients: 3
  # Material resultante do ensopado
  result-material: RABBIT_STEW
  # Nome do resultado
  result-name: "&6Ensopado Artesanal"
  # Lore do resultado
  result-lore:
    - "&7Cozido com {count} ingredientes"

# ── Receita de Vinagre ──────────────────────────────────────
# Receita shapeless para criar vinagre (usado na conservação).
vinegar:
  enabled: true
  # Material do resultado
  result-material: HONEY_BOTTLE
  result-name: "&eVinagre"
  result-lore:
    - "&7Usado para conservar alimentos"
  # Ingredientes (lista de materials)
  ingredients:
    - GLASS_BOTTLE
    - SUGAR

# ── GUI Interativo ─────────────────────────────────────────
# Sistema de menus visuais para interação com o plugin.
gui:
  enabled: true
  # Shift + clique direito com comida na mão abre a inspeção GUI
  inspect-on-shift-click: true
  # Títulos das GUIs
  titles:
    inspection: "&f🔍 Inspecao de Alimento"
    nutrition: "&6&l🍎 Nutricao"
    cookbook: "&8&lLivro de Receitas"
    multiblock-inspection: "&f⚒ {machine}"
    admin: "&8⚙ Admin - FoodDecay"

# ── Mensagens ───────────────────────────────────────────────
# Mensagens são configuradas em messages.yml

# ── Model Stages (Estágios Visuais) ─────────────────────────
# Define CustomModelData para cada estágio de apodrecimento e congelamento.
# Cada lista tem N valores — o progresso é dividido igualmente.
# Com 4 valores: estágio 0 = 0-24%, 1 = 25-49%, 2 = 50-74%, 3 = 75-100%.
# Use 0 para manter o modelo original nesse estágio.
# Freeze: o level é normalizado pelo efeito máximo de gelo (6 blocos = 100%).
# Prioridade: spoiled (receita) > freeze > decay.
model-stages:
  # Exemplo — descomente e configure com seus CustomModelData:
  # COOKED_BEEF:
  #   decay: [0, 100102, 100103, 100104]
  #   freeze: [0, 100106, 100107, 100108]
  # BREAD:
  #   decay: [0, 200102, 200103, 200104]
  #   freeze: [0, 200106, 200107, 200108]

# ── Tempos de Expiração ─────────────────────────────────────
# Tempo base em minutos na temperatura normal.
# -1 = nunca expira
# Comidas não listadas usam 'default-expiration-minutes' se track-all-food: true
expiration-minutes:
  # Carnes cozidas
  COOKED_BEEF: 90
  COOKED_PORKCHOP: 90
  COOKED_CHICKEN: 60
  COOKED_MUTTON: 80
  COOKED_COD: 45
  COOKED_SALMON: 45
  COOKED_RABBIT: 70

  # Assados e pães
  BREAD: 120
  BAKED_POTATO: 90
  COOKIE: 180
  PUMPKIN_PIE: 150
  CAKE: 60

  # Carnes cruas
  BEEF: 30
  PORKCHOP: 30
  CHICKEN: 20
  MUTTON: 30
  COD: 20
  SALMON: 20
  RABBIT: 25

  # Frutas e vegetais
  APPLE: 240
  MELON_SLICE: 120
  SWEET_BERRIES: 100
  CARROT: 180
  POTATO: 180
  BEETROOT: 150

  # Sopas e ensopados
  MUSHROOM_STEW: 40
  RABBIT_STEW: 40
  BEETROOT_SOUP: 40
  SUSPICIOUS_STEW: 30

  # Nunca expiram
  ROTTEN_FLESH: -1
  SPIDER_EYE: -1
  GOLDEN_APPLE: -1
  ENCHANTED_GOLDEN_APPLE: -1
  GOLDEN_CARROT: -1

  # Outros
  DRIED_KELP: 360
