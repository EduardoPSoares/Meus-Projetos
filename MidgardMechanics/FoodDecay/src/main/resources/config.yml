# ── Decay por Peso ──────────────────────────────────────────
# Quando ativo, stacks de comida perdem itens conforme decaem.
# loss-interval: a cada X% de decay, perde 1 item (0.25 = a cada 25%)
decay-by-weight:
  enabled: false
  loss-interval: 0.25

# ── Sistema de Nutrição ─────────────────────────────────────
# 5 grupos alimentares (Grãos, Frutas, Vegetais, Proteína, Laticínios).
# Comer variado aumenta vida máxima. Nutrição decai com o tempo.
nutrition:
  enabled: true
  # Teto de ganho para uma refeicao forte.
  # Alimentos leves sobem menos e itens em porcoes dividem esse valor.
  gain-per-food: 20.0
  decay-per-minute: 0.5
  # Bônus de vida padrão por grupo ativo (se não configurar bonuses por grupo)
  health-bonus-per-group: 2.0
  reset-on-death: true
  # Nível mínimo de nutrição para ativar bônus do grupo (0-100)
  activation-threshold: 25.0
  # Grupos alimentares configuráveis
  # Cada grupo pode ter bônus individuais:
  #   health-bonus: vida extra quando grupo está ativo
  #   effects: lista de efeitos de poção "TIPO:nível:duração_ticks"
  #   mmocore-stats: mapa de stats MMOCore stat -> valor
    # Bonus extras opcionais por grupo:
    #   activation-threshold: override do threshold global
    #   attributes: bonus flat de atributos vanilla, ex. MAX_HEALTH, ATTACK_DAMAGE
    #   mmocore-stats: stats de MMOCore/MythicLib aplicados enquanto o grupo estiver ativo
    groups:
    GRAIN:
      display-name: "Grãos"
      color: "&e"
      icon: WHEAT
        health-bonus: 2.0
        # activation-threshold: 30.0
        effects:
          - "SATURATION:0:100"
        # attributes:
        #   MAX_HEALTH: 2.0
        # mmocore-stats:
        #   MAX_MANA: 25.0
        foods:
        - BREAD
        - COOKIE
        - CAKE
        - PUMPKIN_PIE
        - BAKED_POTATO
    FRUIT:
      display-name: "Frutas"
      color: "&a"
      icon: APPLE
      health-bonus: 1.0
      effects:
        - "SPEED:0:200"
      foods:
        - APPLE
        - MELON_SLICE
        - SWEET_BERRIES
        - GLOW_BERRIES
        - CHORUS_FRUIT
    VEGETABLE:
      display-name: "Vegetais"
      color: "&2"
      icon: CARROT
      health-bonus: 2.0
      effects:
        - "REGENERATION:0:100"
      foods:
        - CARROT
        - POTATO
        - BEETROOT
        - DRIED_KELP
        - GOLDEN_CARROT
    PROTEIN:
      display-name: "Proteína"
      color: "&c"
      icon: COOKED_BEEF
      health-bonus: 3.0
      effects:
        - "DAMAGE_RESISTANCE:0:200"
      foods:
        - COOKED_BEEF
        - COOKED_PORKCHOP
        - COOKED_CHICKEN
        - COOKED_MUTTON
        - COOKED_COD
        - COOKED_SALMON
        - COOKED_RABBIT
        - BEEF
        - PORKCHOP
        - CHICKEN
        - MUTTON
        - COD
        - SALMON
        - RABBIT
    DAIRY:
      display-name: "Laticínios"
      color: "&f"
      icon: MILK_BUCKET
      health-bonus: 2.0
      effects:
        - "ABSORPTION:0:200"
      foods:
        - MUSHROOM_STEW
        - RABBIT_STEW
        - BEETROOT_SOUP
        - SUSPICIOUS_STEW
        - MILK_BUCKET

# ── Receitas ────────────────────────────────────────────────
recipes:
  vinegar:
    enabled: true

# ── Sistema de Qualidade ────────────────────────────────────
# Thresholds e labels para qualidade de processamento multibloco.
quality:
  # Tier 1 (Bom) — bonus mínimo necessário
  tier1-threshold: 5.0
  tier1-prefix: "&a✔ Bom "
  tier1-lore: "&a✔ Boa Qualidade"
  # Tier 2 (Excelente) — bonus mínimo necessário
  tier2-threshold: 20.0
  tier2-prefix: "&6⭐ Excelente "
  tier2-lore: "&e⭐ Qualidade Excelente"
  # Tier 0 (Comum) — abaixo de tier1
  tier0-prefix: "&7Comum "
  tier0-lore: "&7Qualidade Comum"

# ── Estruturas Multibloco ───────────────────────────────────
# Sistema de construções TFC-style para preservação de comida.
# O jogador constrói a estrutura no mundo e usa clique direito
# no bloco âncora com comida para processar.
# Use /fd blueprint <tipo> para ver o holograma da estrutura.
#
# Receitas são configuradas em recipes.yml
multiblock:
  enabled: true
  # Raio em blocos para notificar jogadores quando uma maquina termina
  notification-radius: 32
  # Minutos apos conclusao para o alimento estragar na maquina (0 = desativado)
  abandonment-minutes: 30
  # Timeout de sessão de construção em minutos (0 = sem timeout)
  session-timeout-minutes: 10
  # Raio em blocos para bonus de proximidade (0 = desativado)
  proximity-radius: 8
  # Bonus de qualidade por tick (1 tick = 1 segundo) quando jogador esta proximo
  proximity-bonus-per-tick: 0.3
  # Penalidade de qualidade por evento QTE perdido
  qte-miss-penalty: 5.0
  # ── Sistema de QTE (Eventos Interativos) ──────────────────
  # Eventos opcionais que dão bônus de qualidade.
  # Perder um evento NÃO causa penalidade — apenas perde o bônus.
  qte:
    # Intervalo mínimo entre eventos (segundos). 180 = a cada 3 minutos.
    interval-seconds: 180
    # Tempo que o jogador tem para resolver o evento (segundos). 120 = 2 minutos.
    duration-seconds: 120
    # Chance (0.0 a 1.0) de um evento aparecer quando o intervalo é atingido.
    chance: 0.5
    # Máximo de eventos por ciclo de processamento.
    max-per-cycle: 3
    # Bônus de qualidade ganho por evento resolvido.
    bonus-per-event: 10.0
  # ── Multi-Slot (itens simultâneos por máquina) ────────────
  # Permite colocar múltiplos itens na mesma máquina baseado no nível MMOCore.
  multi-slot:
    # Slots base para todos os jogadores (sem MMOCore ou sem nível suficiente).
    base-slots: 1
    # Profissão MMOCore usada para desbloquear mais slots.
    profession: "cooking"
    # Tiers de slots desbloqueados por nível da profissão.
    tiers:
      tier1:
        level: 5
        slots: 2
      tier2:
        level: 15
        slots: 3
      tier3:
        level: 30
        slots: 4

  # Tiers de complexidade das máquinas (nível MMOCore da profissão acima).
  # Tier 1 = estrutura básica (todos), Tier 2 = intermediária, Tier 3 = avançada.
  machine-tiers:
    tier2-level: 10
    tier3-level: 25

  structures:
    secador:
      enabled: true
      processing-minutes: 30
      display-name: "Secador"
      description:
        - "&7Dois postes de cerca e três"
        - "&7lajes de madeira no topo."
        - ""
        - "&fBlocos:"
