# ============================================================
#  FoodDecay v5.0.0 — Sistema Multibloco TFC
#  Configuração completa do módulo de deterioração de comidas
# ============================================================

# ── Configurações Gerais ────────────────────────────────────
# Tempo padrão de expiração (minutos) para comidas sem config específica
default-expiration-minutes: 60

# Intervalo do task de verificação de decay (em ticks, 20 ticks = 1s)
decay-check-interval-ticks: 1200

# Mostrar timer de validade na lore dos itens
show-lore-timer: true

# Limiar de aviso (0.25 = avisa quando restar 25% do tempo)
warning-threshold: 0.25

# Rastrear toda comida (true = comidas sem config usam o default)
track-all-food: true

# ── Cores ───────────────────────────────────────────────────
colors:
  fresh: "&a"
  warning: "&e"
  expired: "&c"

# ── Formato da Lore ─────────────────────────────────────────
# Placeholders: {color}, {status}
lore:
  format: "{color}⏳ &7Tempo: {color}{status}"
  expired-status: "EXPIRADO"
  trait-format: "  {lore_line}"

# ── Formato de Tempo ────────────────────────────────────────
# Placeholders: {d}, {h}, {m}, {s}
time-format:
  days: "{d}d {h}h"
  hours: "{h}h {m}m"
  minutes: "{m}m {s}s"
  seconds: "{s}s"
  expired: "Expirado"

# ── Comportamento ───────────────────────────────────────────
# Ativar/desativar cada gatilho de stamp e bloqueio
behavior:
  block-expired-consume: true
  stamp-on-pickup: true
  stamp-on-craft: true
  stamp-on-furnace: true
  stamp-on-inventory-click: true
  stamp-on-inventory-open: true
  stamp-on-join: true
  # Marca comida quando ela surge no chão (drops, spawns naturais)
  stamp-on-item-spawn: true

# ── Sistema de Temperatura ──────────────────────────────────
# Multiplica velocidade de decay baseado na temperatura ambiente.
# Requer RealisticSeasons ou usa temperatura de bioma como fallback.
temperature:
  enabled: true
  zones:
    freezing:
      max-temp: 0
      multiplier: 0.1
    cold:
      max-temp: 10
      multiplier: 0.5
    cool:
      max-temp: 20
      multiplier: 0.75
    normal:
      max-temp: 30
      multiplier: 1.0
    warm:
      max-temp: 40
      multiplier: 1.5
    hot:
      max-temp: 999
      multiplier: 2.0

# ── Sistema de Profundidade (Y-Level) ──────────────────────
# Modifica a temperatura baseado na profundidade/Y-level do jogador.
# Quanto mais fundo, mais frio — caves funcionam como refrigeração natural.
# O offset é somado à temperatura ambiente antes de calcular o multiplicador.
# Ex: temperatura 25°C + offset -25 = 0°C efetivo (zona gelada = 0.1x decay)
depth-temperature:
  enabled: true
  zones:
    deep-underground:
      max-y: 0
      temperature-offset: -25
    underground:
      max-y: 30
      temperature-offset: -15
    cave:
      max-y: 50
      temperature-offset: -8
    surface:
      max-y: 256
      temperature-offset: 0

# ── Sistema de Estações ─────────────────────────────────────
# Multiplica velocidade de decay baseado na estação (RealisticSeasons).
season:
  enabled: true
  multipliers:
    SPRING: 1.0
    SUMMER: 1.3
    FALL: 0.9
    WINTER: 0.6

# ── Traços de Conservação ───────────────────────────────────
# Cada traço reduz a velocidade de decay pelo multiplicador.
# ingredient: material necessário na offhand (NONE = automático)
# max-per-item: máximo de traços que uma comida pode ter
traits:
  enabled: true
  auto-smoke-from-smoker: true
  max-per-item: 3

  SALTED:
    multiplier: 0.5
    ingredient: "SUGAR"
    display-name: "&e⬡ Salgado"
    lore: "&7Conservado com sal marinho"

  SMOKED:
    multiplier: 0.4
    ingredient: "NONE"
    display-name: "&6⬡ Defumado"
    lore: "&7Curado lentamente em fumeiro"

  DRIED:
    multiplier: 0.3
    ingredient: "STRING"
    display-name: "&c⬡ Desidratado"
    lore: "&7Seco ao ar e ao sol"

  PICKLED:
    multiplier: 0.35
    ingredient: "GLASS_BOTTLE"
    display-name: "&2⬡ Em Conserva"
    lore: "&7Preservado em vinagre artesanal"

  BRINED:
    multiplier: 0.45
    ingredient: "WATER_BUCKET"
    display-name: "&b⬡ Em Salmoura"
    lore: "&7Mergulhado em água salgada"

  PRESERVED:
    multiplier: 0.25
    ingredient: "HONEYCOMB"
    display-name: "&d⬡ Selado"
    lore: "&7Selado com cera de abelha"

# ── Modificadores de Container ──────────────────────────────
# Multiplica velocidade de decay quando comida está dentro de containers.
# Valores < 1.0 = decai mais devagar
containers:
  enabled: true
  multipliers:
    BARREL: 0.7
    CHEST: 0.9
    TRAPPED_CHEST: 0.9
    SHULKER_BOX: 0.5
    SMOKER: 0.6

# ── Conservação por Gelo ────────────────────────────────────
# Quando um baú/barril tem blocos de gelo adjacentes (ao redor),
# a comida dentro conserva melhor — como um refrigerador primitivo.
# O efeito escala: 1 bloco de gelo = efeito parcial, 6 blocos = efeito máximo.
# multiplier: multiplicador de decay quando todos os 6 lados têm gelo (0.3 = -70%).
ice-conservation:
  enabled: true
  multiplier: 0.3
  # Tempo em minutos para a comida congelar completamente ao lado do gelo.
  # A conservação aumenta gradualmente até atingir o multiplicador máximo.
  freezing-duration: 5
  # Tempo em minutos para o efeito de refrigeração desaparecer após retirar do gelo.
  # Simula o "descongelamento" — a comida vai perdendo a conservação gradualmente.
  warming-duration: 10
  # Quais blocos contam como "gelo" para refrigeração
  ice-blocks:
    - ICE
    - PACKED_ICE
    - BLUE_ICE
    - SNOW_BLOCK

# ── Fumaça Ambiente Contínua ───────────────────────────────
# Quando ativo, máquinas com fogo (Defumeiro, Tina de Conserva) emitem
# colunas de fumaça altas visíveis à distância enquanto processam.
# Estilo TFC — fornalhas e defumeiros geram fumaça imponente.
ambient-smoke:
  enabled: true
  # Intervalo em ticks entre emissões (1 = todo tick, 3 = a cada 3 ticks)
  interval-ticks: 3
  # Quantidade de partículas de signal smoke por emissão
  particle-count: 2
  # Altura base da coluna de fumaça (blocos acima da máquina)
  height: 6.0

# ── Compostagem ─────────────────────────────────────────────
# Comida estragada pode ser colocada em composters para virar adubo.
# Clique direito na composteira com comida estragada para preencher.
# Quando cheia, clique direito para coletar o resultado.
composting:
  enabled: true
  # Permitir comida parcialmente estragada (não só totalmente)
  allow-partial-decay: false
  # Se partial-decay ativo, frescor máximo para aceitar (0.0-1.0, 0.5 = 50% estragada)
  partial-decay-threshold: 0.5
  # Material do resultado
  result-material: BONE_MEAL
  # Quantidade do resultado
  result-amount: 1

# ── Porções de Comida ───────────────────────────────────────
# Estilo TFC: comidas têm múltiplas porções.
# Cada mordida consome 1 porção ao invés de remover o item inteiro.
# Apenas quando todas as porções são consumidas o item desaparece.
portions:
  enabled: true
  # Porções padrão para comidas não listadas
  default-portions: 4
  # Porções por tipo de comida (sobrescreve o padrão)
  per-food:
    COOKED_BEEF: 4
    COOKED_PORKCHOP: 4
    COOKED_CHICKEN: 3
    COOKED_MUTTON: 3
    COOKED_COD: 2
    COOKED_SALMON: 2
    COOKED_RABBIT: 2
    BREAD: 3
    BAKED_POTATO: 2
    COOKIE: 1
    CAKE: 6
    PUMPKIN_PIE: 3
    APPLE: 2
    MELON_SLICE: 1
    GOLDEN_APPLE: 2
    GOLDEN_CARROT: 2
    CARROT: 1
    POTATO: 1
    BEETROOT: 1

# ── Cooking com Temperatura (TFC-style) ────────────────────
# Sistema de cozinhar comida em fogueiras. Clique direito em uma
# fogueira/soul campfire com comida crua para começar a cozinhar.
# Se deixar cozinhando demais, queima (vira carvão).
cooking:
  enabled: false
  # Tempo padrão de cozimento em minutos (se não especificado por receita)
  default-cook-minutes: 3
  # Overcooking: comida queima se ficar na fogueira depois de pronta
  burn-enabled: true
  burn-after-minutes: 5
  # Multiplicadores de calor por tipo de fogueira
  heat-multipliers:
    campfire: 1.0
    soul-campfire: 1.5
  # Receitas: material_cru -> resultado cozido + tempo em minutos
  recipes:
    BEEF:
      result: COOKED_BEEF
      minutes: 4
    PORKCHOP:
      result: COOKED_PORKCHOP
      minutes: 4
    CHICKEN:
      result: COOKED_CHICKEN
      minutes: 3
    MUTTON:
      result: COOKED_MUTTON
      minutes: 4
    COD:
      result: COOKED_COD
      minutes: 2
    SALMON:
      result: COOKED_SALMON
      minutes: 2
    RABBIT:
      result: COOKED_RABBIT
      minutes: 3
    POTATO:
      result: BAKED_POTATO
      minutes: 2
    KELP:
      result: DRIED_KELP
      minutes: 1

# ── Containers de Líquido (mB) ──────────────────────────────
# Sistema TFC-style de líquidos em millibuckets.
# Itens-container armazenam líquidos (água, leite, vinagre, etc.).
# Clique direito em fonte de água/caldeirão para encher.
# Shift+clique direito para despejar.
liquid-containers:
  enabled: true
  # mB despejados por interação (shift+clique direito no ar)
  pour-amount-mb: 250
  # mB por nível de caldeirão (3 níveis = ~1000 mB = 1 balde)
  mb-per-cauldron-level: 333
  # Capacidade máxima em mB por tipo de item
  containers:
    BOWL: 500
    BUCKET: 1000
    GLASS_BOTTLE: 250
    FLOWER_POT: 750
  # Tipos de líquido com nome e cor para exibição
  liquid-types:
    WATER:
      name: "&bÁgua"
      color: "&b"
    MILK:
      name: "&fLeite"
      color: "&f"
    VINEGAR:
      name: "&eVinagre"
      color: "&e"
    HONEY:
      name: "&6Mel"
      color: "&6"
    BROTH:
      name: "&dCaldo"
      color: "&d"
    OIL:
      name: "&aÓleo"
      color: "&a"

# ── Fermentação ─────────────────────────────────────────────
# Sistema TFC-style de fermentação de bebidas.
# Clique direito em um BARREL com um container de líquido para iniciar.
# Após o tempo, o líquido se transforma em uma bebida com efeitos.
fermentation:
  enabled: true
  recipes:
    cerveja:
      input-liquid: WATER
      required-mb: 250
      time-minutes: 30
      result-material: POTION
      display-name: "&6🍺 Cerveja Artesanal"
      effects:
        - type: strength
          duration: 1200
          amplifier: 0
        - type: nausea
          duration: 200
          amplifier: 0
    vinho:
      input-liquid: WATER
      required-mb: 500
      time-minutes: 45
      result-material: POTION
      display-name: "&5🍷 Vinho Tinto"
      effects:
        - type: regeneration
          duration: 600
          amplifier: 1
        - type: nausea
          duration: 400
          amplifier: 0
    hidromel:
      input-liquid: HONEY
      required-mb: 250
      time-minutes: 40
      result-material: HONEY_BOTTLE
      display-name: "&e🍯 Hidromel"
      effects:
        - type: absorption
          duration: 1800
          amplifier: 1
        - type: luck
          duration: 1200
          amplifier: 0
    vinagre-fermentado:
      input-liquid: VINEGAR
      required-mb: 250
      time-minutes: 20
      result-material: POTION
      display-name: "&a🧪 Vinagre Fermentado"
      effects:
        - type: speed
          duration: 900
          amplifier: 0

# ── Peso e Tamanho (TFC) ────────────────────────────────────
# Cada comida tem peso (kg) e categoria de tamanho.
# Peso limita stacks (pesados = menos por stack).
# Tamanho restringe containers (ex: shulker box não aceita HUGE).
# max-kg-per-stack: total de kg permitido por stack (1.8144kg = 64 itens de 0.02835kg)
