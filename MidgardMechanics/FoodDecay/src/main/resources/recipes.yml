# ============================================================
#  FoodDecay — Receitas Multibloco
#  Receitas configuráveis para cada estrutura de processamento
# ============================================================
#
# Formato de receita:
#   input:
#     material: COOKED_BEEF          # Material vanilla
#     # OU para MMOItems:
#     # mmoitems: "CONSUMABLE:carne_bovina"
#     custom-model-data: 0           # 0 = qualquer model data (opcional)
#   output:
#     material: COOKED_BEEF          # Material do resultado
#     # OU para MMOItems:
#     # mmoitems: "CONSUMABLE:carne_seca"
#     name: "&6Carne Seca"           # Nome customizado (opcional)
#     lore:                           # Lore customizada (opcional)
#       - "&7Carne desidratada ao sol"
#     custom-model-data: 10001       # Model customizado (opcional)
#   spoiled:                          # Configuração quando expira (opcional)
#     custom-model-data: 10002       # Model quando estragado
#     name: "&cCarne Seca Estragada" # Nome quando estragado
#   time-minutes: 30                 # Tempo de processamento
#   trait: DRIED                     # Trait de conservação (opcional)
#   requires-trait: SALTED           # Requer trait prévio (opcional)
#   requires-recipe: carne-salgada   # Requer receita prévia descoberta (opcional)
#   extra-inputs:                    # Ingredientes extras consumidos do inventário (opcional)
#     - material: BREAD
#       amount: 1
#     - material: COOKED_BEEF
#       amount: 1
#   nutrition-groups:                # Override manual dos grupos nutricionais (opcional)
#     - GRAIN
#     - PROTEIN

secador:
  carne-seca:
    input:
      material: COOKED_BEEF
    output:
      material: COOKED_BEEF
      name: "&6Carne Seca"
      lore:
        - "&7Carne desidratada ao sol"
        - "&7Conservação natural"
      custom-model-data: 0
    spoiled:
      custom-model-data: 0
      name: "&cCarne Seca Estragada"
    time-minutes: 30
    trait: DRIED
  frango-seco:
    input:
      material: COOKED_CHICKEN
    output:
      material: COOKED_CHICKEN
      name: "&6Frango Desidratado"
      lore:
        - "&7Frango seco ao sol"
      custom-model-data: 0
    time-minutes: 25
    trait: DRIED
  peixe-seco:
    input:
      material: COOKED_COD
    output:
      material: COOKED_COD
      name: "&6Bacalhau Seco"
      lore:
        - "&7Peixe desidratado"
      custom-model-data: 0
    time-minutes: 20
    trait: DRIED

defumeiro:
  carne-defumada:
