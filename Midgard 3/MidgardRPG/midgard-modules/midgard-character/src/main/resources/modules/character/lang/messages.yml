  viewing_other: "<gray>ᴠɪsᴜᴀʟɪzᴀɴᴅᴏ ᴘᴇʀꜰɪʟ ᴅᴇ <yellow>%player%</yellow>...</gray>"
  
  # Carregamento
  loading: "<gray>ᴄᴀʀʀᴇɢᴀɴᴅᴏ ᴅᴀᴅᴏs ᴅᴏ ᴘᴇʀsᴏɴᴀɢᴇᴍ...</gray>"
  loaded: "<green>✔</green> <gray>ᴅᴀᴅᴏs ᴄᴀʀʀᴇɢᴀᴅᴏs.</gray>"
  
  # Salvamento
  saving: "<gray>sᴀʟᴠᴀɴᴅᴏ ᴅᴀᴅᴏs ᴅᴏ ᴘᴇʀsᴏɴᴀɢᴇᴍ...</gray>"
  saved: "<green>✔</green> <gray>ᴅᴀᴅᴏs sᴀʟᴠᴏs ᴄᴏᴍ sᴜᴄᴇssᴏ.</gray>"
  save_failed: "<red>✖</red> <gray>ᴇʀʀᴏ ᴀᴏ sᴀʟᴠᴀʀ ᴅᴀᴅᴏs. ᴛᴇɴᴛᴇ ɴᴏᴠᴀᴍᴇɴᴛᴇ.</gray>"
  
  # Criação
  creating: "<gray>ᴄʀɪᴀɴᴅᴏ ɴᴏᴠᴏ ᴘᴇʀꜰɪʟ...</gray>"
  created: "<green>✔</green> <gray>ᴘᴇʀꜰɪʟ ᴄʀɪᴀᴅᴏ ᴄᴏᴍ sᴜᴄᴇssᴏ.</gray>"
  
  # Reset
  resetting: "<yellow>⚠</yellow> <gray>ʀᴇɪɴɪᴄɪᴀɴᴅᴏ ᴘᴇʀꜰɪʟ...</gray>"
  reset: "<green>✔</green> <gray>ᴘᴇʀꜰɪʟ ʀᴇɪɴɪᴄɪᴀᴅᴏ.</gray>"

