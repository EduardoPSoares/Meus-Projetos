    invalid_range: "<red>✖</red> <gray>ᴀ ᴠᴇʟᴏᴄɪᴅᴀᴅᴇ ᴅᴇᴠᴇ sᴇʀ ᴇɴᴛʀᴇ <white>0</white> <gray>ᴇ <white>10</white><gray>.</gray>"
    fly_set: "<green>✔</green> <gray>ᴠᴇʟᴏᴄɪᴅᴀᴅᴇ ᴅᴇ ᴠᴏᴏ: <gold>%speed%</gold><gray>.</gray>"
    walk_set: "<green>✔</green> <gray>ᴠᴇʟᴏᴄɪᴅᴀᴅᴇ ᴅᴇ ᴄᴀᴍɪɴʜᴀᴅᴀ: <gold>%speed%</gold><gray>.</gray>"
  
