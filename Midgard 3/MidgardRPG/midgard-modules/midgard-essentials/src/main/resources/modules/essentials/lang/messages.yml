  set_first: "<green>✔</green> <gray>ᴘʀɪᴍᴇɪʀᴀ ʜᴏᴍᴇ ᴅᴇꜰɪɴɪᴅᴀ. ᴜsᴇ <gray>/rpg home</gray><gray>.</gray>"
