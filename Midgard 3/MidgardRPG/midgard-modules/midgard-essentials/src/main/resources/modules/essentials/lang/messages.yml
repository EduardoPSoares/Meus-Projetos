# ============================================
# MIDGARD ESSENTIALS MODULE - MESSAGES
# Formato: Small Caps Unicode para estilo visual
# ============================================

# ============================================
# PREFIX E BRANDING
# ============================================
prefix: ""

# ============================================
# SISTEMA DE BACK
# ============================================
back:
  success: "<green>✔</green> <gray>ᴠᴏʟᴛᴀɴᴅᴏ ᴘᴀʀᴀ ᴏ ʟᴏᴄᴀʟ ᴀɴᴛᴇʀɪᴏʀ.</gray>"
  teleporting: "<aqua>ℹ</aqua> <gray>ᴛᴇʟᴇᴘᴏʀᴛᴀɴᴅᴏ ᴘᴀʀᴀ ᴏ ʟᴏᴄᴀʟ ᴀɴᴛᴇʀɪᴏʀ...</gray>"
  no_location: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴛᴇᴍ ɴᴇɴʜᴜᴍ ʟᴏᴄᴀʟ ᴘᴀʀᴀ ᴠᴏʟᴛᴀʀ.</gray>"
  unsafe_location: "<red>✖</red> <gray>ᴏ ʟᴏᴄᴀʟ ᴀɴᴛᴇʀɪᴏʀ ɴᴀᴏ ᴇ sᴇɢᴜʀᴏ ᴘᴀʀᴀ ʀᴇᴛᴏʀɴᴏ.</gray>"

# ============================================
# SISTEMA DE VANISH
# ============================================
vanish:
  enabled: "<green>✔</green> <gray>ᴠᴏᴄᴇ ᴇɴᴛʀᴏᴜ ɴᴏ ᴍᴏᴅᴏ ɪɴᴠɪsɪᴠᴇʟ.</gray>"
  disabled: "<yellow>⚠</yellow> <gray>ᴠᴏᴄᴇ sᴀɪᴜ ᴅᴏ ᴍᴏᴅᴏ ɪɴᴠɪsɪᴠᴇʟ.</gray>"
  enabled_other: "<green>✔</green> <aqua>%player%</aqua> <gray>ᴇɴᴛʀᴏᴜ ɴᴏ ᴍᴏᴅᴏ ɪɴᴠɪsɪᴠᴇʟ.</gray>"
  disabled_other: "<yellow>⚠</yellow> <aqua>%player%</aqua> <gray>sᴀɪᴜ ᴅᴏ ᴍᴏᴅᴏ ɪɴᴠɪsɪᴠᴇʟ.</gray>"
  no_attack: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴘᴏᴅᴇ ᴀᴛᴀᴄᴀʀ ᴇɴԡᴜᴀɴᴛᴏ ᴇsᴛɪᴠᴇʀ ɪɴᴠɪsɪᴠᴇʟ.</gray>"
  silent_chest: "<aqua>ℹ</aqua> <gray>ᴀʙʀɪɴᴅᴏ ʙᴀᴜ sɪʟᴇɴᴄɪᴏsᴀᴍᴇɴᴛᴇ...</gray>"
  silent_view_title: "Silent View"

# ============================================
# SISTEMA DE INVSEE
# ============================================
invsee:
  usage: "<yellow>⚠</yellow> <gray>ᴜsᴏ: <gray>/rpg admin invsee <ᴊᴏɢᴀᴅᴏʀ></gray>"
  opening: "<aqua>ℹ</aqua> <gray>ᴀʙʀɪɴᴅᴏ ɪɴᴠᴇɴᴛᴀʀɪᴏ ᴅᴇ <aqua>%player%</aqua><gray>.</gray>"
  viewing: "<aqua>ℹ</aqua> <gray>ᴠɪsᴜᴀʟɪzᴀɴᴅᴏ ɪɴᴠᴇɴᴛᴀʀɪᴏ ᴅᴇ <aqua>%player%</aqua><gray>.</gray>"
  cannot_view_target: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴘᴏᴅᴇ ᴠᴇʀ ᴏ ɪɴᴠᴇɴᴛᴀʀɪᴏ ᴅᴇsᴛᴇ ᴊᴏɢᴀᴅᴏʀ.</gray>"
  gui:
    title: "<white>ɪɴᴠᴇɴᴛᴀʀɪᴏ ᴅᴇ <aqua>%player%</aqua></white>"
    empty_helmet: "<red>sᴇᴍ ᴄᴀᴘᴀᴄᴇᴛᴇ</red>"
    empty_chestplate: "<red>sᴇᴍ ᴘᴇɪᴛᴏʀᴀʟ</red>"
    empty_leggings: "<red>sᴇᴍ ᴄᴀʟᴄᴀ</red>"
    empty_boots: "<red>sᴇᴍ ʙᴏᴛᴀs</red>"
    empty_offhand: "<red>sᴇᴍ ᴏꜰꜰʜᴀɴᴅ</red>"
    info_name: "<yellow>ɪɴꜰᴏʀᴍᴀᴄᴏᴇs</yellow>"
    info_health: "<gray>❤ ᴠɪᴅᴀ: <red>%current%</red><gray>/</gray><red>%max%</red>"
    info_food: "<gray>ꜰᴏᴍᴇ: <gold>%food%</gold>"
    info_xp: "<gray>xᴘ: <green>%xp%</green>"
    readonly: "<red>ᴍᴏᴅᴏ sᴏᴍᴇɴᴛᴇ ʟᴇɪᴛᴜʀᴀ</red>"

# ============================================
# SISTEMA DE TELEPORTE
# ============================================
teleport:
  success: "<green>✔</green> <gray>ᴛᴇʟᴇᴘᴏʀᴛᴀᴅᴏ ᴘᴀʀᴀ <aqua>%target%</aqua><gray>.</gray>"
  success_coords: "<green>✔</green> <gray>ᴛᴇʟᴇᴘᴏʀᴛᴀᴅᴏ ᴘᴀʀᴀ <gold>x:%x% ʏ:%y% z:%z%</gold><gray>.</gray>"
  warmup: "<yellow>⚠</yellow> <gray>ᴛᴇʟᴇᴘᴏʀᴛᴀɴᴅᴏ ᴇᴍ <gold>%time%s</gold><gray>...</gray>"
  warmup_cancelled: "<red>✖</red> <gray>ᴛᴇʟᴇᴘᴏʀᴛᴇ ᴄᴀɴᴄᴇʟᴀᴅᴏ. ᴠᴏᴄᴇ sᴇ ᴍᴏᴠᴇᴜ.</gray>"
  cooldown: "<yellow>⚠</yellow> <gray>ᴀɢᴜᴀʀᴅᴇ <gold>%time%s</gold> <gray>ᴘᴀʀᴀ ᴛᴇʟᴇᴘᴏʀᴛᴀʀ ɴᴏᴠᴀᴍᴇɴᴛᴇ.</gray>"

# ============================================
# TPA (TELEPORT REQUEST)
# ============================================
tpa:
  already_sent: "<red>✖</red> <gray>ᴠᴏᴄᴇ ᴊᴀ ᴇɴᴠɪᴏᴜ ᴜᴍᴀ sᴏʟɪᴄɪᴛᴀᴄᴀᴏ ᴘᴀʀᴀ ᴇsᴛᴇ ᴊᴏɢᴀᴅᴏʀ.</gray>"
  expired: "<yellow>⚠</yellow> <gray>sᴜᴀ sᴏʟɪᴄɪᴛᴀᴄᴀᴏ ᴅᴇ ᴛᴇʟᴇᴘᴏʀᴛᴇ ᴇxᴘɪʀᴏᴜ.</gray>"
  sent: "<green>✔</green> <gray>sᴏʟɪᴄɪᴛᴀᴄᴀᴏ ᴇɴᴠɪᴀᴅᴀ ᴘᴀʀᴀ <aqua>%player%</aqua><gray>.</gray>"
  received: "<aqua>%player%</aqua> <gray>ᴅᴇsᴇᴊᴀ sᴇ ᴛᴇʟᴇᴘᴏʀᴛᴀʀ ᴀᴛᴇ ᴠᴏᴄᴇ.</gray>\n<dark_gray><i>ᴜsᴇ <green>/rpg tpaccept</green> ᴏᴜ <red>/rpg tpdeny</red> ᴘᴀʀᴀ ʀᴇsᴘᴏɴᴅᴇʀ.</i></dark_gray>"
  no_request: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴛᴇᴍ sᴏʟɪᴄɪᴛᴀᴄᴏᴇs ᴘᴇɴᴅᴇɴᴛᴇs.</gray>"
  teleporting: "<aqua>ℹ</aqua> <gray>sᴏʟɪᴄɪᴛᴀᴄᴀᴏ ᴀᴄᴇɪᴛᴀ. ᴛᴇʟᴇᴘᴏʀᴛᴀɴᴅᴏ...</gray>"
  accepted: "<green>✔</green> <gray>ᴠᴏᴄᴇ ᴀᴄᴇɪᴛᴏᴜ ᴀ sᴏʟɪᴄɪᴛᴀᴄᴀᴏ ᴅᴇ <aqua>%player%</aqua><gray>.</gray>"
  denied: "<red>✖</red> <gray>sᴏʟɪᴄɪᴛᴀᴄᴀᴏ ʀᴇᴄᴜsᴀᴅᴀ.</gray>"
  sender_offline: "<red>✖</red> <gray>ᴏ ᴊᴏɢᴀᴅᴏʀ ɴᴀᴏ ᴇsᴛᴀ ᴍᴀɪs ᴏɴʟɪɴᴇ.</gray>"
  self: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴘᴏᴅᴇ ᴇɴᴠɪᴀʀ sᴏʟɪᴄɪᴛᴀᴄᴀᴏ ᴘᴀʀᴀ sɪ ᴍᴇsᴍᴏ.</gray>"
  unsafe_location_target: "<red>✖</red> <gray>ʟᴏᴄᴀʟ ɪɴsᴇɢᴜʀᴏ ᴘᴀʀᴀ ᴛᴇʟᴇᴘᴏʀᴛᴇ. ᴘᴇᴅɪᴅᴏ ᴄᴀɴᴄᴇʟᴀᴅᴏ.</gray>"
  unsafe_location_sender: "<red>✖</red> <gray>ᴏ ᴛᴇʟᴇᴘᴏʀᴛᴇ ꜰᴏɪ ᴄᴀɴᴄᴇʟᴀᴅᴏ ᴘᴏʀǫᴜᴇ ᴏ ᴅᴇsᴛɪɴᴏ ɴᴀᴏ ᴇ sᴇɢᴜʀᴏ.</gray>"

