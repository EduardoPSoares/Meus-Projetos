  set: "<green>✔</green> <gray>sᴘᴀᴡɴ ᴅᴇꜰɪɴɪᴅᴏ ᴄᴏᴍ sᴜᴄᴇssᴏ.</gray>"
  not_set: "<red>✖</red> <gray>sᴘᴀᴡɴ ɴᴀᴏ ᴅᴇꜰɪɴɪᴅᴏ.</gray>"
