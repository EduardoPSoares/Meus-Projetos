    console_must_specify_player: "<red>✖</red> <gray>ᴏ ᴄᴏɴsᴏʟᴇ ᴅᴇᴠᴇ ᴇsᴘᴇᴄɪꜰɪᴄᴀʀ ᴜᴍ ᴊᴏɢᴀᴅᴏʀ.</gray>"
  
  speed:
