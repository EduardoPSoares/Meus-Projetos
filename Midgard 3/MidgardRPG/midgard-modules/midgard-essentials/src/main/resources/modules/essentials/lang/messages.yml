  teleport: "<aqua>ℹ</aqua> <gray>ᴛᴇʟᴇᴘᴏʀᴛᴀᴅᴏ ᴘᴀʀᴀ <gold>%home%</gold><gray>.</gray>"
  deleted: "<yellow>⚠</yellow> <gray>ʜᴏᴍᴇ <gold>%home%</gold> <gray>ʀᴇᴍᴏᴠɪᴅᴀ.</gray>"
