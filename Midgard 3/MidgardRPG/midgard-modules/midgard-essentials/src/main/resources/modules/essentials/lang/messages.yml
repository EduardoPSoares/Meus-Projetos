  heal_other: "<green>✔</green> <gray>ᴠᴏᴄᴇ ᴄᴜʀᴏᴜ <aqua>%player%</aqua><gray>.</gray>"
  healed_by: "<green>✔</green> <gray>ᴠᴏᴄᴇ ꜰᴏɪ ᴄᴜʀᴀᴅᴏ ᴘᴏʀ <aqua>%player%</aqua><gray>.</gray>"
  gamemode_changed: "<green>✔</green> <gray>ᴍᴏᴅᴏ ᴅᴇ ᴊᴏɢᴏ ᴀʟᴛᴇʀᴀᴅᴏ ᴘᴀʀᴀ <gold>%gamemode%</gold><gray>.</gray>"
  gamemode_changed_other: "<green>✔</green> <gray>ᴍᴏᴅᴏ ᴅᴇ <aqua>%player%</aqua> <gray>ᴀʟᴛᴇʀᴀᴅᴏ ᴘᴀʀᴀ <gold>%gamemode%</gold><gray>.</gray>"
  feed: "<green>✔</green> <gray>sᴜᴀ ꜰᴏᴍᴇ ꜰᴏɪ sᴀᴄɪᴀᴅᴀ.</gray>"
  feed_other: "<green>✔</green> <gray>ᴠᴏᴄᴇ ᴀʟɪᴍᴇɴᴛᴏᴜ <aqua>%player%</aqua><gray>.</gray>"
  fed_by: "<green>✔</green> <gray>ᴠᴏᴄᴇ ꜰᴏɪ ᴀʟɪᴍᴇɴᴛᴀᴅᴏ ᴘᴏʀ <aqua>%player%</aqua><gray>.</gray>"
  fly_enabled: "<green>✔</green> <gray>ᴠᴏᴏ ʜᴀʙɪʟɪᴛᴀᴅᴏ.</gray>"
  fly_disabled: "<yellow>⚠</yellow> <gray>ᴠᴏᴏ ᴅᴇsᴀʙɪʟɪᴛᴀᴅᴏ.</gray>"
  fly_enabled_other: "<green>✔</green> <gray>ᴠᴏᴏ ʜᴀʙɪʟɪᴛᴀᴅᴏ ᴘᴀʀᴀ <aqua>%player%</aqua><gray>.</gray>"
  fly_disabled_other: "<yellow>⚠</yellow> <gray>ᴠᴏᴏ ᴅᴇsᴀʙɪʟɪᴛᴀᴅᴏ ᴘᴀʀᴀ <aqua>%player%</aqua><gray>.</gray>"

