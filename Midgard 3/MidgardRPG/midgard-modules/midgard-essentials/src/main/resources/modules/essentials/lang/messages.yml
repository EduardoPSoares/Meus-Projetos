  teleport: "<aqua>ℹ</aqua> <gray>ᴛᴇʟᴇᴘᴏʀᴛᴀᴅᴏ ᴘᴀʀᴀ <gold>%warp%</gold><gray>.</gray>"
  deleted: "<yellow>⚠</yellow> <gray>ᴡᴀʀᴘ <gold>%warp%</gold> <gray>ʀᴇᴍᴏᴠɪᴅᴀ.</gray>"
  set: "<green>✔</green> <gray>ᴡᴀʀᴘ <gold>%warp%</gold> <gray>ᴅᴇꜰɪɴɪᴅᴀ ᴄᴏᴍ sᴜᴄᴇssᴏ.</gray>"
