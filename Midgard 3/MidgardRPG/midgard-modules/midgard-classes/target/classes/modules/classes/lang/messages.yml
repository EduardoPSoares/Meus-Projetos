# ============================================
# MIDGARD CLASSES MODULE - MESSAGES
# ============================================
# Formato: Small Caps Unicode para estilo visual

# ============================================
# MENSAGENS DE CLASSE
# ============================================
class:
  # Seleção
  selected: "<green>✔</green> <gray>ᴠᴏᴄᴇ ᴇsᴄᴏʟʜᴇᴜ ᴏ ᴄᴀᴍɪɴʜᴏ ᴅᴇ <yellow>%class_name%</yellow><gray>.</gray>"
  changed: "<yellow>⚠</yellow> <gray>ᴄʟᴀssᴇ ᴀʟᴛᴇʀᴀᴅᴀ ᴅᴇ <white>%old_class%</white> <gray>ᴘᴀʀᴀ <yellow>%new_class%</yellow><gray>.</gray>"
  
  # Primeira vez
  welcome: "<gold><bold>✦</bold></gold> <aqua>ʙᴇᴍ-ᴠɪɴᴅᴏ, %class_name%!</aqua>"
  welcome_lore:
    - ""
    - "<gray>ᴠᴏᴄᴇ ᴇsᴄᴏʟʜᴇᴜ ᴏ ᴄᴀᴍɪɴʜᴏ ᴅᴏ <yellow>%class_name%</yellow><gray>.</gray>"
    - "<gray>ᴜsᴇ <white>/class info</white> <gray>ᴘᴀʀᴀ ᴠᴇʀ sᴜᴀs ʜᴀʙɪʟɪᴅᴀᴅᴇs.</gray>"
  
  # Informações
  current: "<gray>ᴄʟᴀssᴇ ᴀᴛᴜᴀʟ: <yellow>%class_name%</yellow> <dark_gray>(ʟᴠ. %level%)</dark_gray>"
  no_class: "<yellow>⚠</yellow> <gray>ᴠᴏᴄᴇ ᴀɪɴᴅᴀ ɴᴀᴏ ᴇsᴄᴏʟʜᴇᴜ ᴜᴍᴀ ᴄʟᴀssᴇ.</gray>"
  no_class_prompt: "<gray>ᴜsᴇ <white>/class select</white> <gray>ᴘᴀʀᴀ ᴇsᴄᴏʟʜᴇʀ sᴜᴀ ᴄʟᴀssᴇ.</gray>"
  
  # Disponibilidade
  available_classes: "<gray>ᴄʟᴀssᴇs ᴅɪsᴘᴏɴɪᴠᴇɪs: <white>%classes%</white>"
  class_locked: "<red>✖</red> <gray>ᴄʟᴀssᴇ ʙʟᴏԡᴜᴇᴀᴅᴀ. ʀᴇԡᴜɪsɪᴛᴏ: <yellow>%requirement%</yellow>"
  class_unlocked: "<green>✔</green> <gray>ᴄʟᴀssᴇ ᴅᴇsʙʟᴏԡᴜᴇᴀᴅᴀ: <yellow>%class_name%</yellow><gray>.</gray>"
  
  gui:
    error_select: "<red>✖</red> <gray>ᴏᴄᴏʀʀᴇᴜ ᴜᴍ ᴇʀʀᴏ ᴀᴏ sᴇʟᴇᴄɪᴏɴᴀʀ ᴀ ᴄʟᴀssᴇ.</gray>"
    error_manager: "<red>✖</red> <gray>ᴇʀʀᴏ ɪɴᴛᴇʀɴᴏ: ɢᴇʀᴇɴᴄɪᴀᴅᴏʀ ᴅᴇ ᴄʟᴀssᴇs ɴᴀᴏ ɪɴɪᴄɪᴀʟɪzᴀᴅᴏ.</gray>"
    error_confirm: "<red>✖</red> <gray>ᴇʀʀᴏ ᴀᴏ ᴄᴏɴꜰɪʀᴍᴀʀ sᴇʟᴇᴄᴀᴏ ᴅᴇ ᴄʟᴀssᴇ.</gray>"
    already_set: "<red>✖</red> <gray>ᴠᴏᴄᴇ ᴊᴀ ᴘᴏssᴜɪ ᴜᴍᴀ ᴄʟᴀssᴇ ᴅᴇꜰɪɴɪᴅᴀ. <dark_gray>(ᴀᴘᴇɴᴀs ᴀᴅᴍɪɴs ᴘᴏᴅᴇᴍ ᴀʟᴛᴇʀᴀʀ)</dark_gray>"

# ============================================
# MENSAGENS DE LEVEL E XP
# ============================================
progression:
  # Level Up
  level_up: "<yellow>★ sᴜʙɪᴜ ᴅᴇ ɴɪᴠᴇʟ ᴅᴀ ᴄʟᴀssᴇ!</yellow> <gray>%class_name% <gray>ᴀᴛɪɴɢɪᴜ ᴏ ɴɪᴠᴇʟ <white>%level%</white><gray>!</gray>"
  combat_level_up: "<yellow>★ sᴜʙɪᴜ ᴅᴇ ɴɪᴠᴇʟ ᴅᴇ ᴄᴏᴍʙᴀᴛᴇ!</yellow> <gray>ɴɪᴠᴇʟ <white>%level%</white><gray>!</gray>"
  level_up_rewards:
    - "<gray>ʀᴇᴄᴏᴍᴘᴇɴsᴀs:</gray>"
    - "<yellow>+%attribute_points%</yellow> <gray>ᴘᴏɴᴛᴏs ᴅᴇ ᴀᴛʀɪʙᴜᴛᴏ</gray>"
    - "<yellow>+%skill_points%</yellow> <gray>ᴘᴏɴᴛᴏs ᴅᴇ ʜᴀʙɪʟɪᴅᴀᴅᴇ</gray>"
  
  # XP
  xp_gained: "<gray>+<yellow>%amount%</yellow> xᴘ <dark_gray>(%source%)</dark_gray>"
  xp_gained_bonus: "<gray>+<yellow>%amount%</yellow> xᴘ <yellow>★</yellow> <gray>ʙᴏɴᴜs: <yellow>+%bonus%%</yellow>"
  xp_info: "<gray>xᴘ: <yellow>%current%</yellow><gray>/</gray><yellow>%required%</yellow> <dark_gray>(%percentage%%)</dark_gray>"
  next_level: "<gray>ᴘʀᴏxɪᴍᴏ ɴɪᴠᴇʟ: <yellow>%xp_needed% xᴘ</yellow>"
  
  # Prestígio
  max_level: "<gold>★</gold> <gray>ɴɪᴠᴇʟ ᴍᴀxɪᴍᴏ ᴀᴛɪɴɢɪᴅᴏ.</gray>"
  prestige_available: "<light_purple>★</light_purple> <gray>ᴘʀᴇsᴛɪɢɪᴏ ᴅɪsᴘᴏɴɪᴠᴇʟ. <gray>ᴜsᴇ <white>/class prestige</white>"
  prestige_success: "<light_purple>★ ᴘʀᴇsᴛɪɢɪᴏ!</light_purple> <yellow>%class_name%</yellow> <gray>ʀᴇɴᴀsᴄᴇᴜ ɴᴏ ᴘʀᴇsᴛɪɢɪᴏ <white>%prestige%</white><gray>!</gray>"

# ============================================
# MENSAGENS DE ATRIBUTOS
# ============================================
attributes:
  # Pontos
  points_received: "<green>✔</green> <gray>ᴠᴏᴄᴇ ʀᴇᴄᴇʙᴇᴜ <yellow>%points%</yellow> <gray>ᴘᴏɴᴛᴏs ᴅᴇ ᴀᴛʀɪʙᴜᴛᴏ.</gray>"
  points_spent: "<green>✔</green> <gray>ᴠᴏᴄᴇ ɢᴀsᴛᴏᴜ <yellow>%points%</yellow> <gray>ᴘᴏɴᴛᴏs.</gray>"
  not_enough_points: "<red>✖</red> <gray>ᴘᴏɴᴛᴏs ɪɴsᴜꜰɪᴄɪᴇɴᴛᴇs. <gray>ᴠᴏᴄᴇ ᴛᴇᴍ <yellow>%available%</yellow><gray>, ᴘʀᴇᴄɪsᴀ ᴅᴇ <yellow>%required%</yellow><gray>.</gray>"
  
  # Reset
  reset_success: "<yellow>⚠</yellow> <gray>ᴘᴏɴᴛᴏs ᴅᴇ ᴀᴛʀɪʙᴜᴛᴏ ʀᴇsᴇᴛᴀᴅᴏs. <gray>ᴠᴏᴄᴇ ʀᴇᴄᴜᴘᴇʀᴏᴜ <white>%points%</white> <gray>ᴘᴏɴᴛᴏs.</gray>"
  reset_cost: "<gray>ᴄᴜsᴛᴏ ᴅᴏ ʀᴇsᴇᴛ: <yellow>%cost%</yellow>"
  reset_confirm: "<red>⚠</red> <gray>ᴅɪɢɪᴛᴇ<white>/class reset confirm</white> <gray>ᴘᴀʀᴀ ᴄᴏɴꜰɪʀᴍᴀʀ.</gray>"
  
  # Limites
  max_reached: "<gold>★</gold> <gray>ᴍᴀxɪᴍᴏ ᴀᴛɪɴɢɪᴅᴏ ᴇᴍ <aqua>%attribute%</aqua><gray>.</gray>"
  min_required: "<red>✖</red> <aqua>%attribute%</aqua> <gray>ʀᴇǫᴜᴇʀ ɴᴏ ᴍɪɴɪᴍᴏ <yellow>%min%</yellow> <gray>ᴘᴏɴᴛᴏs.</gray>"

# ============================================
# MENSAGENS DE HABILIDADES
# ============================================
skills:
  # Desbloqueio
  unlocked: "<green>✔</green> <gray>ʜᴀʙɪʟɪᴅᴀᴅᴇ ᴅᴇsʙʟᴏǫᴜᴇᴀᴅᴀ:<yellow>%skill_name%</yellow><gray>.</gray>"
  upgraded: "<green>✔</green> <gray>ʜᴀʙɪʟɪᴅᴀᴅᴇ ᴍᴇʟʜᴏʀᴀᴅᴀ:<yellow>%skill_name%</yellow> <gray>→<white>ʟᴠ. %level%</white>"
  
  # Uso
  activated: "<gold>★</gold> <yellow>%skill_name%</yellow> <gray>ᴀᴛɪᴠᴀᴅᴏ.</gray>"
  on_cooldown: "<red>✖</red> <yellow>%skill_name%</yellow> <gray>ᴇᴍ ʀᴇᴄᴀʀɢᴀ. <gray>ᴀɢᴜᴀʀᴅᴇ <white>%time%s</white><gray>.</gray>"
  insufficient_mana: "<blue>✖</blue> <gray>ᴍᴀɴᴀ ɪɴsᴜꜰɪᴄɪᴇɴᴛᴇ ᴘᴀʀᴀ <yellow>%skill_name%</yellow><gray>. <gray>ᴄᴜsᴛᴏ: <blue>%required%</blue>"
  
  # Requisitos
  level_required: "<red>✖</red> <yellow>%skill_name%</yellow> <gray>ʀᴇǫᴜᴇʀ ʟᴇᴠᴇʟ <yellow>%level%</yellow><gray>.</gray>"
  skill_required: "<red>✖</red> <yellow>%skill_name%</yellow> <gray>ʀᴇǫᴜᴇʀ: <yellow>%requirement%</yellow>"
  
  # Pontos de habilidade
  skill_points_received: "<green>✔</green> <gray>ᴠᴏᴄᴇ ʀᴇᴄᴇʙᴇᴜ <yellow>%points%</yellow> <gray>ᴘᴏɴᴛᴏs ᴅᴇ ʜᴀʙɪʟɪᴅᴀᴅᴇ.</gray>"
  skill_points_spent: "<green>✔</green> <gray>ᴠᴏᴄᴇ ɢᴀsᴛᴏᴜ <yellow>%points%</yellow> <gray>ᴘᴏɴᴛᴏs ᴅᴇ ʜᴀʙɪʟɪᴅᴀᴅᴇ.</gray>"
  not_enough_skill_points: "<red>✖</red> <gray>ᴘᴏɴᴛᴏs ᴅᴇ ʜᴀʙɪʟɪᴅᴀᴅᴇ ɪɴsᴜꜰɪᴄɪᴇɴᴛᴇs.</gray>"
  points_needed: "<red>✖</red> <gray>ᴠᴏᴄᴇ ᴘʀᴇᴄɪsᴀ ᴅᴇ <yellow>%cost%</yellow> <gray>ᴘᴏɴᴛᴏ(s) ᴅᴇ ʜᴀʙɪʟɪᴅᴀᴅᴇ.</gray>"
  max_level_reached: "<red>✖</red> <gray>ᴇsᴛᴀ ʜᴀʙɪʟɪᴅᴀᴅᴇ ᴊᴀ ᴇsᴛᴀ ɴᴏ ɴɪᴠᴇʟ ᴍᴀxɪᴍᴏ!</gray>"
  data_error: "<red>✖</red> <gray>ᴅᴀᴅᴏs ᴅᴀ ᴄʟᴀssᴇ ɴᴀᴏ ᴇɴᴄᴏɴᴛʀᴀᴅᴏs.</gray>"
  system_error: "<red>✖</red> <gray>sɪsᴛᴇᴍᴀ ᴅᴇ ʜᴀʙɪʟɪᴅᴀᴅᴇs ɪɴᴅɪsᴘᴏɴɪᴠᴇʟ.</gray>"
  tree_max_points: "<red>✖</red> <gray>ᴠᴏᴄᴇ ᴀᴛɪɴɢɪᴜ ᴏ ᴍᴀxɪᴍᴏ ᴅᴇ ᴘᴏɴᴛᴏs ᴅᴇsᴛᴀ ᴀʀᴠᴏʀᴇ.</gray>"
  requirement_format: "%skill% Nível %level%"


