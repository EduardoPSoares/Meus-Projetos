  name: "<gradient:#ffff55:#ffaa00><bold>⟳ ɪᴅ ᴅᴇ ʀᴇᴠɪꜱᴀᴏ</bold></gradient>"
  lore:
    - "<gray>ᴏ ᴀᴛᴜᴀʟɪᴢᴀᴅᴏʀ ᴇꜱᴛᴀ ꜱᴇᴍᴘʀᴇ ᴀᴛɪᴠᴏ. ᴀᴜᴍᴇɴᴛᴀʀ"
    - "<gray>ᴇꜱᴛᴇ ɴᴜᴍᴇʀᴏ ᴀᴛᴜᴀʟɪᴢᴀʀᴀ ᴛᴏᴅᴀꜱ ᴀꜱ ɪɴꜱᴛᴀɴᴄɪᴀꜱ"
    - "<gray>ᴅᴇꜱᴛᴇ ɪᴛᴇᴍ ꜱᴇᴍ ɴᴇɴʜᴜᴍᴀ ᴀᴄᴀᴏ ᴀᴅɪᴄɪᴏɴᴀʟ."
