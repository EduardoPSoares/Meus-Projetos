# ============================================
# FERREIRO - Definição e Recompensas
# ============================================

definition:
  menu-icon: ANVIL
  gradient: "<gradient:#f59e0b:#dc2626>"
  description: "Forje armas, armaduras e ferramentas e refine metais para ganhar XP."
  bonuses:
    - "<green>▸ Qualidade da forja</green>"
    - "<green>▸ Bônus de durabilidade</green>"
    - "<green>▸ Chance de upgrade</green>"
    - "<green>▸ Eficiência com metais</green>"
  xp-source-icon: IRON_INGOT
  extra-button-icon: NETHERITE_UPGRADE_SMITHING_TEMPLATE
  extra-button-name: "<gold>Técnicas de Forja"
  extra-button-lore:
    - "<gray>Visualize suas técnicas de forja"
    - "<gray>e especializações com metais."

rewards:
  1:
    name: "Aprendiz Ferreiro"
    bonuses:
      - "+2% qualidade da forja"
  5:
    bonuses:
      - "+5% qualidade da forja"
      - "+3% bônus de durabilidade"
  10:
    name: "Ferreiro"
    bonuses:
      - "+10% qualidade da forja"
    ability: "Martelada Precisa"
    ability-desc: "Impacto no minigame da forja é mais preciso."
  25:
    name: "Mestre Ferreiro"
    bonuses:
      - "+5% chance de upgrade"
    ability: "Têmpera Reforçada"
    ability-desc: "Armas forjadas ganham +10% durabilidade."
  50:
    name: "Ferreiro Lendário"
    bonuses:
      - "+30% qualidade da forja"
    ability: "Liga Superior"
    ability-desc: "Pode criar ligas especiais na fundição."
  75:
    name: "Grão-Mestre Ferreiro"
    bonuses:
      - "+10% eficiência com metais"
    perks:
      - "Chance de preservar lingote"
  100:
    name: "Lenda da Forja"
    bonuses:
      - "+50% qualidade da forja"
    ability: "Reforja Eficiente"
    ability-desc: "Reforjar itens não consome materiais extras."
    perks:
      - "Título: Lenda da Forja"

