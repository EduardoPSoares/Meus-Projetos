# ============================================
# PENALIDADES PARA NÃO-FERREIROS
# ============================================
# Jogadores sem a profissão de Ferreiro ativa sofrem estas penalidades
# ao craftar armas, armaduras e ferramentas metálicas.
penalties:
  enabled: true
  show-message: true

  # Apenas equipamentos e armas sofrem penalidade (não blocos decorativos)
  affected-materials:
    - IRON_SWORD
    - IRON_AXE
    - IRON_PICKAXE
    - IRON_SHOVEL
    - IRON_HOE
    - IRON_HELMET
    - IRON_CHESTPLATE
    - IRON_LEGGINGS
    - IRON_BOOTS
    - DIAMOND_SWORD
    - DIAMOND_AXE
    - DIAMOND_PICKAXE
    - DIAMOND_SHOVEL
    - DIAMOND_HOE
    - DIAMOND_HELMET
    - DIAMOND_CHESTPLATE
    - DIAMOND_LEGGINGS
    - DIAMOND_BOOTS
    - SHIELD

  # Penalidade ao craftar equipamentos
  craft:
    fail-chance: 0.30          # 30% de chance de falhar o craft
    # fail-result: null        # Sem item de falha — materiais simplesmente perdidos

  # Penalidade ao fundir metais
  smelt:
    fail-chance: 0.20          # 20% de chance de perder o lingote
    fail-result: IRON_NUGGET   # Recebe nugget ao invés de ingot
