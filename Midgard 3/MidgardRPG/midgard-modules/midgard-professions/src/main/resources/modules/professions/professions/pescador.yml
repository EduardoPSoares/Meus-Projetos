# ============================================
# PESCADOR - Definição e Recompensas
# ============================================

definition:
  menu-icon: FISHING_ROD
  gradient: "<gradient:#22d3ee:#0ea5e9>"
  description: "Pesque peixes, tesouros aquáticos e recursos marinhos para ganhar XP."
  bonuses:
    - "<green>▸ Sorte de pesca</green>"
    - "<green>▸ Chance de captura rara</green>"
    - "<green>▸ Velocidade do carretel</green>"
    - "<green>▸ Instinto aquático</green>"
  xp-source-icon: TROPICAL_FISH
  extra-button-icon: HEART_OF_THE_SEA
  extra-button-name: "<aqua>Instinto Marinho"
  extra-button-lore:
    - "<gray>Visualize seus bônus de pesca"
    - "<gray>e afinidade com as águas."

rewards:
  1:
    name: "Aprendiz Pescador"
    bonuses:
      - "+2% sorte de pesca"
  5:
    bonuses:
      - "+5% sorte de pesca"
      - "+3% velocidade do carretel"
  10:
    name: "Pescador"
    bonuses:
      - "+10% sorte de pesca"
    ability: "Treasure Hook"
    ability-desc: "Maior chance de pescar itens raros e tesouros."
  25:
    name: "Pescador Experiente"
    bonuses:
      - "+5% chance de captura rara"
    ability: "Fast Reel"
    ability-desc: "Recolhimento 30% mais rápido."
  50:
    name: "Mestre Pescador"
    bonuses:
      - "+30% sorte de pesca"
    ability: "Deep Water Instinct"
    ability-desc: "Detecta peixes raros na água."
  75:
    name: "Grão-Mestre Pescador"
    bonuses:
      - "+10% chance de captura rara"
    perks:
      - "Instinto aquático avançado"
  100:
    name: "Lenda da Pesca"
    bonuses:
      - "+50% sorte de pesca"
    ability: "Pesca Precisa"
    ability-desc: "Toda pesca garante ao menos item raro."
    perks:
      - "Título: Lenda da Pesca"

# ============================================
# FONTES DE XP
# ============================================
# fish: XP ao pescar (material do item capturado)
xp-config:
  fish:
    COD: 8.0
    SALMON: 8.0
    TROPICAL_FISH: 15.0
    PUFFERFISH: 12.0
    # Tesouros
    BOW: 20.0
    ENCHANTED_BOOK: 25.0
    FISHING_ROD: 15.0
    NAME_TAG: 20.0
    NAUTILUS_SHELL: 30.0
    SADDLE: 20.0
    LILY_PAD: 5.0
    # Lixo
    LEATHER_BOOTS: 3.0
    ROTTEN_FLESH: 2.0
    STICK: 1.0
    STRING: 2.0
    BONE: 2.0
    INK_SAC: 3.0
    TRIPWIRE_HOOK: 2.0

# ============================================
# PENALIDADES PARA NÃO-PESCADORES
# ============================================
# Jogadores sem a profissão de Pescador ativa sofrem estas penalidades ao pescar.
penalties:
  enabled: true
  show-message: true
  affected-materials: []

  # Penalidade de pesca — multiplica chance de lixo
  fish:
    junk-multiplier: 3.0       # 3x mais chance de pescar lixo (66% vira lixo)
