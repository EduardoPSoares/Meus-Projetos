# ============================================
# PENALIDADES PARA NÃO-CARPINTEIROS
# ============================================
# Jogadores sem a profissão de Carpinteiro ativa sofrem estas penalidades
# ao cortar madeira e craftar itens de madeira.
penalties:
  enabled: true
  show-message: true

  # Materiais que sofrem penalidade (troncos para block, itens para craft)
  affected-materials:
    # Troncos (block-break penalty)
    - OAK_LOG
    - SPRUCE_LOG
    - BIRCH_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG
    - CHERRY_LOG
    - CRIMSON_STEM
    - WARPED_STEM
    # Itens de madeira (craft penalty)
    - OAK_PLANKS
    - SPRUCE_PLANKS
    - BIRCH_PLANKS
    - JUNGLE_PLANKS
    - ACACIA_PLANKS
    - DARK_OAK_PLANKS
    - MANGROVE_PLANKS
    - CHERRY_PLANKS
    - BAMBOO_PLANKS
    - CRIMSON_PLANKS
    - WARPED_PLANKS
    - CRAFTING_TABLE
    - CHEST
    - BARREL
    - BOOKSHELF
    - STICK
    - OAK_DOOR
    - OAK_FENCE
    - OAK_STAIRS
    - OAK_SLAB
    - OAK_BOAT

  # Penalidade ao cortar madeira
  block:
    drop-chance: 0.60          # 60% de chance de dropar
    durability-multiplier: 1.5 # Machado gasta 50% mais durabilidade
    effect:
      type: SLOWNESS            # Trabalho pesado
      duration: 40              # 2 segundos
      amplifier: 0              # Nível I

  # Penalidade ao craftar itens de madeira
  craft:
    fail-chance: 0.15          # 15% de chance de falhar
    # fail-result: null        # Sem resultado de falha
