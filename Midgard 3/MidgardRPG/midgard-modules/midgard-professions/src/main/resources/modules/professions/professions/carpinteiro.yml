# ============================================
# CARPINTEIRO - Definição e Recompensas
# ============================================

definition:
  menu-icon: IRON_AXE
  gradient: "<gradient:#d97706:#f59e0b>"
  description: "Corte madeira, processe toras e construa estruturas para ganhar XP."
  bonuses:
    - "<green>▸ Rendimento de madeira</green>"
    - "<green>▸ Velocidade de corte</green>"
    - "<green>▸ Eficiência de crafting</green>"
    - "<green>▸ Preservação de material</green>"
  xp-source-icon: OAK_LOG
  extra-button-icon: CRAFTING_TABLE
  extra-button-name: "<gold>Bancada do Carpinteiro"
  extra-button-lore:
    - "<gray>Acesse seus projetos de construção"
    - "<gray>e especializações em madeira."

rewards:
  1:
    name: "Aprendiz de Carpintaria"
    bonuses:
      - "+2% rendimento de madeira"
  5:
    bonuses:
      - "+5% rendimento de madeira"
      - "+3% velocidade de corte"
  10:
    name: "Carpinteiro"
    bonuses:
      - "+10% rendimento de madeira"
    ability: "Corte Limpo"
    ability-desc: "Chance de derrubar a árvore inteira."
  25:
    name: "Artesão"
    bonuses:
      - "+5% eficiência de crafting"
    ability: "Madeira Reforçada"
    ability-desc: "Estruturas de madeira ganham durabilidade extra."
  50:
    name: "Mestre Artesão"
    bonuses:
      - "+30% rendimento de madeira"
    ability: "Montagem Rápida"
    ability-desc: "Crafting de itens de madeira é 50% mais rápido."
  75:
    name: "Grão-Mestre Artesão"
    bonuses:
      - "+10% preservação de material"
    perks:
      - "Chance de não consumir material"
  100:
    name: "Lenda da Madeira"
    bonuses:
      - "+50% rendimento de madeira"
    ability: "Precisão Artesanal"
    ability-desc: "Crafting nunca falha — qualidade máxima."
    perks:
      - "Título: Lenda da Madeira"

