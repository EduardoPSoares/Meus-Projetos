# ══════════════════════════════════════════════════════════════════
#  MIDGARD GUERREIRO (WARRIOR) SKILLS — MythicMobs Skill Definitions
#  Classe de combate corpo-a-corpo focada em força bruta e resistência.
#  Todas as skills usam variáveis injetadas pelo SpellManager.
#  Variáveis disponíveis:  <skill.var.NOME>
#  Minecraft 1.21.1 / Folia / MythicMobs
# ══════════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────
#  1. FÚRIA GUERREIRA (PASSIVA) — Aura de força aumentada
#     Variables: strength_bonus
#     Milestones: lvl3=fury_aura, lvl5=fury_blaze
# ─────────────────────────────────────────────

FuriaGuerreira:
  Skills:
  - skill{s=FuriaGuerreira_Cast} @self

FuriaGuerreira_Cast:
  Skills:
  - potion{type=STRENGTH;duration=999999;level=<skill.var.strength_bonus>;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#ff0000;color2=#ff6600;amount=15;hS=0.5;vS=0.8;y=0.5;size=1.2;speed=0} @self
  - particles{p=flame;amount=8;hS=0.4;vS=0.6;y=0.5;speed=0.02} @self
  - sound{s=entity.blaze.ambient;v=0.6;p=1.2} @self

# === FÚRIA GUERREIRA MK2 (Milestone lvl 3 — fury_aura) ===
FuriaGuerreiraMk2:
  Skills:
  - skill{s=FuriaGuerreiraMk2_Cast} @self

FuriaGuerreiraMk2_Cast:
  Skills:
  - potion{type=STRENGTH;duration=999999;level=<skill.var.strength_bonus>;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#ff0000;color2=#ffcc00;amount=25;hS=0.6;vS=1.0;y=0.5;size=1.5;speed=0} @self
  - particles{p=flame;amount=15;hS=0.5;vS=0.8;y=0.5;speed=0.03} @self
  - particles{p=enchant;amount=10;hS=0.5;vS=0.8;y=0.5;speed=0.05} @self
  # Fury aura orbital
  - orbital{auraName=fury_aura;bulletType=ITEM;bulletItem=BLAZE_POWDER;radius=1.2;points=3;interval=1;duration=999999;oy=1.0} @self
  - sound{s=entity.blaze.ambient;v=0.8;p=1.0} @self

# === FÚRIA GUERREIRA MK3 (Milestone lvl 5 — fury_blaze) ===
FuriaGuerreiraMk3:
  Skills:
  - skill{s=FuriaGuerreiraMk3_Cast} @self

FuriaGuerreiraMk3_Cast:
  Skills:
  - potion{type=STRENGTH;duration=999999;level=<skill.var.strength_bonus>;hasParticles=false} @self
  - potion{type=FIRE_RESISTANCE;duration=999999;level=0;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#990000;color2=#ffcc00;amount=40;hS=0.8;vS=1.2;y=0.5;size=2.0;speed=0} @self
  - particles{p=flame;amount=25;hS=0.6;vS=1.0;y=0.5;speed=0.05} @self
  - particles{p=soul_fire_flame;amount=12;hS=0.4;vS=0.8;y=0.5;speed=0.03} @self
  - particles{p=lava;amount=6;hS=0.3;vS=0.5;y=0.3;speed=0} @self
  # Blaze fury orbital
  - orbital{auraName=fury_blaze;bulletType=ITEM;bulletItem=FIRE_CHARGE;radius=1.5;points=5;interval=1;duration=999999;oy=1.0} @self
  - sound{s=entity.blaze.shoot;v=1.0;p=0.6} @self
  - sound{s=entity.ender_dragon.growl;v=0.5;p=1.5} @self


# ─────────────────────────────────────────────
#  2. RESISTÊNCIA MARCIAL (PASSIVA) — Aura defensiva de ferro/aço
#     Variables: defense_bonus
#     Milestones: lvl3=iron_skin, lvl5=steel_skin
# ─────────────────────────────────────────────

ResistenciaMarcial:
  Skills:
  - skill{s=ResistenciaMarcial_Cast} @self

ResistenciaMarcial_Cast:
  Skills:
  - potion{type=RESISTANCE;duration=999999;level=<skill.var.defense_bonus>;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#8c8c8c;color2=#c0c0c0;amount=12;hS=0.5;vS=0.8;y=0.5;size=1.0;speed=0} @self
  - particles{p=enchant;amount=8;hS=0.4;vS=0.6;y=0.5;speed=0.1} @self
  - sound{s=item.armor.equip_iron;v=0.6;p=1.2} @self

# === RESISTÊNCIA MARCIAL MK2 (Milestone lvl 3 — iron_skin) ===
ResistenciaMarcialMk2:
  Skills:
  - skill{s=ResistenciaMarcialMk2_Cast} @self

ResistenciaMarcialMk2_Cast:
  Skills:
  - potion{type=RESISTANCE;duration=999999;level=<skill.var.defense_bonus>;hasParticles=false} @self
  - potion{type=FIRE_RESISTANCE;duration=999999;level=0;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#666666;color2=#c0c0c0;amount=20;hS=0.6;vS=1.0;y=0.5;size=1.5;speed=0} @self
  - particles{p=block_crack;m=IRON_BLOCK;amount=10;hS=0.4;vS=0.6;y=0.5;speed=0.05} @self
  - particles{p=enchant;amount=12;hS=0.5;vS=0.8;y=0.5;speed=0.1} @self
  # Iron skin orbital
  - orbital{auraName=iron_skin;bulletType=ITEM;bulletItem=IRON_NUGGET;radius=1.3;points=4;interval=1;duration=999999;oy=1.0} @self
  - sound{s=block.anvil.land;v=0.6;p=1.0} @self

# === RESISTÊNCIA MARCIAL MK3 (Milestone lvl 5 — steel_skin) ===
ResistenciaMarcialMk3:
  Skills:
  - skill{s=ResistenciaMarcialMk3_Cast} @self

ResistenciaMarcialMk3_Cast:
  Skills:
  - potion{type=RESISTANCE;duration=999999;level=<skill.var.defense_bonus>;hasParticles=false} @self
  - potion{type=FIRE_RESISTANCE;duration=999999;level=0;hasParticles=false} @self
  - potion{type=ABSORPTION;duration=999999;level=1;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#4a4a4a;color2=#d4af37;amount=30;hS=0.7;vS=1.2;y=0.5;size=2.0;speed=0} @self
  - particles{p=block_crack;m=NETHERITE_BLOCK;amount=15;hS=0.5;vS=0.8;y=0.5;speed=0.08} @self
  - particles{p=soul_fire_flame;amount=8;hS=0.3;vS=0.6;y=0.5;speed=0.02} @self
  - particles{p=end_rod;amount=6;hS=0.4;vS=0.8;y=0.5;speed=0.03} @self
  # Steel skin orbital
  - orbital{auraName=steel_skin;bulletType=ITEM;bulletItem=NETHERITE_SCRAP;radius=1.5;points=6;interval=1;duration=999999;oy=1.0} @self
  - sound{s=block.anvil.land;v=0.8;p=0.6} @self
  - sound{s=item.armor.equip_netherite;v=0.8;p=1.0} @self


# ─────────────────────────────────────────────
#  3. GOLPE BRUTAL (COMUM) — Golpe devastador frontal em cone
#     Variables: damage
#     Milestones: lvl3=brutal_impact, lvl5=brutal_flame
# ─────────────────────────────────────────────

GolpeBrutal:
  Skills:
  - skill{s=GolpeBrutal_Cast} @self

GolpeBrutal_Cast:
  Skills:
  # Vento antes do golpe
  - sound{s=entity.player.attack.sweep;v=1.2;p=0.7} @self
  - particles{p=sweep_attack;amount=3;hS=0.3;vS=0.1;y=1.0;speed=0} @forward{f=1.5;lockpitch=true}
  - delay 2
  # Impacto
  - skill{s=GolpeBrutal_Impact} @self

GolpeBrutal_Impact:
  Skills:
  - sound{s=entity.player.attack.strong;v=1.5;p=0.6} @self
  - damage{a=<skill.var.damage>;pkb=true;hnp=true;hp=true} @EntitiesInCone{angle=70;range=4;rotation=0;length=4}
  # Partículas de impacto
  - particles{p=sweep_attack;amount=5;hS=0.5;vS=0.2;y=1.0;speed=0} @forward{f=2;lockpitch=true}
  - particles{p=dust_color_transition;color1=#ff0000;color2=#990000;amount=20;hS=1.0;vS=0.3;y=0.5;size=1.5;speed=0} @forward{f=2;lockpitch=true}
  - particles{p=block_crack;m=REDSTONE_BLOCK;amount=15;hS=1.5;vS=0.2;y=0.1;speed=0.1} @forward{f=2;lockpitch=true}
  - particles{p=explosion;amount=2;hS=0.3;vS=0.2;y=0.5;speed=0} @forward{f=2;lockpitch=true}
  # Rachaduras no chão
  - particles{p=block_crack;m=STONE;amount=20;hS=1.5;vS=0.1;y=0.05;speed=0.15} @forward{f=2;lockpitch=true}
  - particles{p=smoke;amount=8;hS=1.0;vS=0.2;y=0.1;speed=0.05} @forward{f=2;lockpitch=true}

# === GOLPE BRUTAL MK2 (Milestone lvl 3 — brutal_impact) ===
GolpeBrutalMk2:
  Skills:
  - skill{s=GolpeBrutalMk2_Cast} @self

GolpeBrutalMk2_Cast:
  Skills:
  - sound{s=entity.player.attack.sweep;v=1.4;p=0.6} @self
  - particles{p=sweep_attack;amount=5;hS=0.4;vS=0.2;y=1.0;speed=0} @forward{f=1.5;lockpitch=true}
  - particles{p=dust_color_transition;color1=#ff6600;color2=#ff0000;amount=12;hS=0.3;vS=0.5;y=1.0;size=1.2;speed=0} @self
  - delay 2
  - skill{s=GolpeBrutalMk2_Impact} @self

GolpeBrutalMk2_Impact:
  Skills:
  - sound{s=entity.player.attack.strong;v=1.8;p=0.5} @self
  - sound{s=entity.generic.explode;v=0.5;p=1.5} @self
  - damage{a=<skill.var.damage>;pkb=true;hnp=true;hp=true} @EntitiesInCone{angle=80;range=4.5;rotation=0;length=4.5}
  - throw{velocity=0.8;velocityY=0.3} @EntitiesInCone{angle=80;range=4.5;rotation=0;length=4.5}
  # Impacto visual aprimorado
  - particles{p=sweep_attack;amount=8;hS=0.8;vS=0.3;y=1.0;speed=0} @forward{f=2.5;lockpitch=true}
  - particles{p=dust_color_transition;color1=#ff0000;color2=#990000;amount=30;hS=1.5;vS=0.4;y=0.5;size=2.0;speed=0} @forward{f=2.5;lockpitch=true}
  - particles{p=block_crack;m=REDSTONE_BLOCK;amount=25;hS=2.0;vS=0.3;y=0.1;speed=0.15} @forward{f=2.5;lockpitch=true}
  - particles{p=explosion;amount=3;hS=0.5;vS=0.3;y=0.5;speed=0} @forward{f=2.5;lockpitch=true}
  # Onda de choque no chão
  - particlering{p=block_crack;m=STONE;radius=2;points=30;amount=3;hS=0.2;vS=0.1;y=0.1;speed=0.1} @forward{f=2;lockpitch=true}
  - particlering{p=dust_color_transition;color1=#990000;color2=#ff0000;radius=3;points=30;amount=2;hS=0.1;vS=0.1;y=0.1;size=1.5;speed=0;delay=1} @forward{f=2;lockpitch=true}
  - particles{p=smoke;amount=15;hS=1.5;vS=0.3;y=0.1;speed=0.08} @forward{f=2.5;lockpitch=true}

# === GOLPE BRUTAL MK3 (Milestone lvl 5 — brutal_flame) ===
GolpeBrutalMk3:
  Skills:
  - skill{s=GolpeBrutalMk3_Cast} @self

GolpeBrutalMk3_Cast:
  Skills:
  - sound{s=entity.player.attack.sweep;v=1.5;p=0.5} @self
  - sound{s=entity.blaze.shoot;v=0.8;p=1.0} @self
  - particles{p=sweep_attack;amount=6;hS=0.5;vS=0.3;y=1.0;speed=0} @forward{f=1.5;lockpitch=true}
  - particles{p=flame;amount=20;hS=0.4;vS=0.6;y=1.0;speed=0.08} @self
  - delay 2
  - skill{s=GolpeBrutalMk3_Impact} @self

GolpeBrutalMk3_Impact:
  Skills:
  - sound{s=entity.player.attack.strong;v=2.0;p=0.4} @self
  - sound{s=entity.generic.explode;v=0.8;p=1.2} @self
  - damage{a=<skill.var.damage>;pkb=true;hnp=true;hp=true} @EntitiesInCone{angle=90;range=5;rotation=0;length=5}
  - ignite{ticks=40} @EntitiesInCone{angle=90;range=5;rotation=0;length=5}
  - throw{velocity=1.2;velocityY=0.5} @EntitiesInCone{angle=90;range=5;rotation=0;length=5}
  # Impacto flamejante
  - particles{p=sweep_attack;amount=10;hS=1.0;vS=0.4;y=1.0;speed=0} @forward{f=3;lockpitch=true}
  - particles{p=flame;amount=50;hS=2.0;vS=0.5;y=0.5;speed=0.2} @forward{f=3;lockpitch=true}
  - particles{p=dust_color_transition;color1=#ff0000;color2=#ffcc00;amount=35;hS=2.0;vS=0.5;y=0.5;size=2.5;speed=0} @forward{f=3;lockpitch=true}
  - particles{p=lava;amount=12;hS=1.5;vS=0.3;y=0.2;speed=0} @forward{f=3;lockpitch=true}
  - particles{p=explosion;amount=4;hS=0.8;vS=0.4;y=0.5;speed=0} @forward{f=3;lockpitch=true}
  # Chão em chamas
  - particlering{p=flame;radius=2;points=25;amount=4;hS=0.2;vS=0.1;y=0.1;speed=0.1} @forward{f=2.5;lockpitch=true}
  - particlering{p=flame;radius=3.5;points=35;amount=3;hS=0.2;vS=0.1;y=0.1;speed=0.08;delay=1} @forward{f=2.5;lockpitch=true}
  - particles{p=soul_fire_flame;amount=15;hS=2.0;vS=0.2;y=0.1;speed=0.05} @forward{f=3;lockpitch=true}
  - particles{p=block_crack;m=MAGMA_BLOCK;amount=20;hS=2.0;vS=0.1;y=0.05;speed=0.15} @forward{f=3;lockpitch=true}


# ─────────────────────────────────────────────
#  4. INVESTIDA (COMUM) — Carga frontal com dano e knockback
#     Variables: damage, distance
#     Milestones: lvl3=charge_trail, lvl5=charge_flame
# ─────────────────────────────────────────────

Investida:
  Skills:
  - skill{s=Investida_Cast} @self

Investida_Cast:
  Skills:
  # Grito de carga
  - sound{s=entity.ravager.roar;v=1.0;p=1.2} @self
  - particles{p=dust_color_transition;color1=#ff6600;color2=#ff0000;amount=15;hS=0.4;vS=0.8;y=0.5;size=1.5;speed=0} @self
  - delay 2
  # Lunge para frente
  - lunge{velocity=2.5;velocityY=0.1} @forward{f=<skill.var.distance>;lockpitch=true}
  # Dano no caminho
  - damage{a=<skill.var.damage>;pkb=true;hnp=true;hp=true} @EntitiesInCone{angle=40;range=<skill.var.distance>;rotation=0;length=<skill.var.distance>}
  - throw{velocity=1.5;velocityY=0.4} @EntitiesInCone{angle=40;range=<skill.var.distance>;rotation=0;length=<skill.var.distance>}
  # Trail de carga
  - particles{p=dust_color_transition;color1=#ff0000;color2=#ff6600;amount=10;hS=0.3;vS=0.2;y=0.3;size=1.2;speed=0;repeat=6;repeati=2} @self
  - particles{p=block_crack;m=STONE;amount=5;hS=0.3;vS=0.1;y=0.05;speed=0.1;repeat=6;repeati=2} @self
  - particles{p=smoke;amount=5;hS=0.3;vS=0.2;y=0.2;speed=0.05;repeat=6;repeati=2} @self
  # Impacto final
  - delay 6
  - sound{s=entity.player.attack.strong;v=1.2;p=0.8} @self
  - particles{p=explosion;amount=2;hS=0.3;vS=0.2;y=0.5;speed=0} @self

# === INVESTIDA MK2 (Milestone lvl 3 — charge_trail) ===
InvestidaMk2:
  Skills:
  - skill{s=InvestidaMk2_Cast} @self

InvestidaMk2_Cast:
  Skills:
  - sound{s=entity.ravager.roar;v=1.2;p=1.0} @self
  - particles{p=dust_color_transition;color1=#ff6600;color2=#ff0000;amount=25;hS=0.5;vS=1.0;y=0.5;size=2.0;speed=0} @self
  - delay 2
  - lunge{velocity=3.0;velocityY=0.1} @forward{f=<skill.var.distance>;lockpitch=true}
  - damage{a=<skill.var.damage>;pkb=true;hnp=true;hp=true} @EntitiesInCone{angle=45;range=<skill.var.distance>;rotation=0;length=<skill.var.distance>}
  - throw{velocity=2.0;velocityY=0.5} @EntitiesInCone{angle=45;range=<skill.var.distance>;rotation=0;length=<skill.var.distance>}
  # Trail aprimorado com fogo
  - particles{p=dust_color_transition;color1=#ff0000;color2=#ffcc00;amount=15;hS=0.4;vS=0.3;y=0.3;size=1.8;speed=0;repeat=8;repeati=2} @self
  - particles{p=flame;amount=8;hS=0.3;vS=0.2;y=0.3;speed=0.05;repeat=8;repeati=2} @self
  - particles{p=block_crack;m=STONE;amount=8;hS=0.4;vS=0.1;y=0.05;speed=0.12;repeat=8;repeati=2} @self
  - particles{p=smoke;amount=8;hS=0.4;vS=0.3;y=0.2;speed=0.08;repeat=8;repeati=2} @self
  # Onda de choque no final
  - delay 8
  - sound{s=entity.player.attack.strong;v=1.5;p=0.7} @self
  - sound{s=entity.generic.explode;v=0.5;p=1.5} @self
  - particlering{p=dust_color_transition;color1=#ff6600;color2=#990000;radius=2;points=25;amount=3;hS=0.1;vS=0.1;y=0.2;size=1.5;speed=0} @self
  - particles{p=explosion;amount=3;hS=0.5;vS=0.3;y=0.5;speed=0} @self

# === INVESTIDA MK3 (Milestone lvl 5 — charge_flame) ===
InvestidaMk3:
  Skills:
  - skill{s=InvestidaMk3_Cast} @self

InvestidaMk3_Cast:
  Skills:
  - sound{s=entity.ravager.roar;v=1.5;p=0.8} @self
  - sound{s=entity.blaze.shoot;v=0.8;p=0.8} @self
  - particles{p=dust_color_transition;color1=#ff0000;color2=#ffcc00;amount=35;hS=0.6;vS=1.2;y=0.5;size=2.5;speed=0} @self
  - particles{p=flame;amount=20;hS=0.5;vS=0.8;y=0.5;speed=0.08} @self
  - delay 2
  - lunge{velocity=3.5;velocityY=0.15} @forward{f=<skill.var.distance>;lockpitch=true}
  - damage{a=<skill.var.damage>;pkb=true;hnp=true;hp=true} @EntitiesInCone{angle=50;range=<skill.var.distance>;rotation=0;length=<skill.var.distance>}
  - ignite{ticks=60} @EntitiesInCone{angle=50;range=<skill.var.distance>;rotation=0;length=<skill.var.distance>}
  - throw{velocity=2.5;velocityY=0.6} @EntitiesInCone{angle=50;range=<skill.var.distance>;rotation=0;length=<skill.var.distance>}
  # Trail flamejante
  - particles{p=flame;amount=20;hS=0.5;vS=0.4;y=0.3;speed=0.1;repeat=10;repeati=2} @self
  - particles{p=dust_color_transition;color1=#ff0000;color2=#ffcc00;amount=18;hS=0.5;vS=0.4;y=0.3;size=2.0;speed=0;repeat=10;repeati=2} @self
  - particles{p=lava;amount=4;hS=0.3;vS=0.2;y=0.2;speed=0;repeat=10;repeati=2} @self
  - particles{p=soul_fire_flame;amount=5;hS=0.3;vS=0.3;y=0.3;speed=0.03;repeat=10;repeati=2} @self
  # Explosão flamejante no final
  - delay 10
  - skill{s=InvestidaMk3_Explosion} @self

InvestidaMk3_Explosion:
  Skills:
  - sound{s=entity.generic.explode;v=1.2;p=0.8} @self
  - damage{a=<skill.var.damage> * 0.5;pkb=true;hnp=true} @EntitiesNearOrigin{r=3}
  - ignite{ticks=40} @EntitiesNearOrigin{r=3}
  - particles{p=flame;amount=60;hS=2.0;vS=1.0;y=0.5;speed=0.2} @self
  - particles{p=dust_color_transition;color1=#ff0000;color2=#ffcc00;amount=30;hS=2.0;vS=1.0;y=0.5;size=2.5;speed=0} @self
  - particles{p=explosion;amount=3;hS=0.5;vS=0.3;y=0.5;speed=0} @self
  - particles{p=lava;amount=15;hS=1.5;vS=0.5;y=0.3;speed=0} @self
  - particlering{p=flame;radius=2;points=25;amount=4;hS=0.2;vS=0.1;y=0.2;speed=0.15} @self
  - particlering{p=flame;radius=3;points=30;amount=3;hS=0.2;vS=0.1;y=0.2;speed=0.1;delay=1} @self


# ─────────────────────────────────────────────
#  5. GRITO DE GUERRA (COMUM) — Buff AoE para aliados
#     Variables: strength_buff, duration
#     Milestones: lvl3=war_shout, lvl5=war_roar
# ─────────────────────────────────────────────

GritoDeGuerra:
  Skills:
  - skill{s=GritoDeGuerra_Cast} @self

GritoDeGuerra_Cast:
  Skills:
  # Grito
  - sound{s=entity.evoker.prepare_attack;v=1.5;p=0.6} @self
  - sound{s=entity.player.attack.strong;v=1.0;p=0.5} @self
  # Buff de força no caster e aliados
  - potion{type=STRENGTH;duration=<skill.var.duration>;level=<skill.var.strength_buff>;hasParticles=true} @self
