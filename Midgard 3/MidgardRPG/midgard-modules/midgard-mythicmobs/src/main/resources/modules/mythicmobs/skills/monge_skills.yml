# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  3. SOCO TROVÃO — Thunder Punch (COMMON)                                  ║
# ║  A devastating electrified punch that sends enemies flying.               ║
# ║  Variables: damage (14.0 base / 3.5 per level)                            ║
