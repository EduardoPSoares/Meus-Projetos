  - midgardDamage{a=<skill.var.damage>;type=LIGHTNING} @EntitiesInCone{angle=50;range=4;rotation=0;length=4}
  - throw{velocity=1.5;velocityY=0.4} @EntitiesInCone{angle=50;range=4;rotation=0;length=4}
  # Electric spark particles
