# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  1. FLUXO INTERIOR — Inner Flow (PASSIVE)                                 ║
# ║  The monk channels chi through their body, enhancing attack speed/damage.  ║
# ║  Variables: damage_bonus (5.0 base / 2.0 per level)                       ║
# ║  Milestones: lvl3=fluxo_interior_chi, lvl5=fluxo_interior_energy          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# --- Base ---
FluxoInterior:
  Skills:
  - skill{s=FluxoInterior_Cast} @self

FluxoInterior_Cast:
  Skills:
  - sound{s=entity.experience_orb.pickup;v=0.5;p=1.8} @self
  - particles{p=end_rod;amount=8;hS=0.4;vS=0.6;y=0.5;speed=0.02} @self
  - particles{p=dust_color_transition;color1=#ffffff;color2=#00ccff;amount=10;hS=0.5;vS=0.5;y=0.5;size=1.0;speed=0} @self
  - particles{p=enchanted_hit;amount=6;hS=0.3;vS=0.4;y=0.8;speed=0.03} @self
  - midgardDamage{type=CHI;bonus=<skill.var.damage_bonus>} @self

# --- Mk2 (Milestone: fluxo_interior_chi) ---
FluxoInteriorMk2:
  Skills:
  - skill{s=FluxoInteriorMk2_Cast} @self

FluxoInteriorMk2_Cast:
  Skills:
  - sound{s=entity.experience_orb.pickup;v=0.6;p=1.6} @self
  - particles{p=end_rod;amount=14;hS=0.5;vS=0.8;y=0.5;speed=0.03} @self
  - particles{p=dust_color_transition;color1=#ffffff;color2=#00ccff;amount=16;hS=0.6;vS=0.6;y=0.5;size=1.3;speed=0} @self
  - particles{p=enchanted_hit;amount=10;hS=0.4;vS=0.5;y=0.8;speed=0.04} @self
  - particles{p=snowflake;amount=4;hS=0.3;vS=0.3;y=0.6;speed=0.01} @self
  # Chi flow orbital
  - orbital{auraName=fluxo_chi;bulletType=ITEM;bulletItem=PRISMARINE_CRYSTALS;radius=1.0;points=3;interval=1;duration=999999;oy=0.8} @self
  - midgardDamage{type=CHI;bonus=<skill.var.damage_bonus>} @self

# --- Mk3 (Milestone: fluxo_interior_energy) ---
FluxoInteriorMk3:
  Skills:
  - skill{s=FluxoInteriorMk3_Cast} @self

FluxoInteriorMk3_Cast:
  Skills:
  - sound{s=entity.experience_orb.pickup;v=0.7;p=1.4} @self
  - sound{s=block.beacon.activate;v=0.3;p=1.8} @self
  - particles{p=end_rod;amount=22;hS=0.6;vS=1.0;y=0.5;speed=0.04} @self
  - particles{p=dust_color_transition;color1=#00ccff;color2=#ffdd44;amount=22;hS=0.7;vS=0.8;y=0.5;size=1.6;speed=0} @self
  - particles{p=enchanted_hit;amount=14;hS=0.5;vS=0.6;y=0.8;speed=0.05} @self
  - particles{p=snowflake;amount=8;hS=0.4;vS=0.5;y=0.6;speed=0.02} @self
  - particles{p=flash;amount=1;hS=0;vS=0;y=1.0;speed=0} @self
  # Inner energy double orbital
  - orbital{auraName=fluxo_energy_inner;bulletType=ITEM;bulletItem=PRISMARINE_CRYSTALS;radius=0.8;points=3;interval=1;duration=999999;oy=0.6} @self
  - orbital{auraName=fluxo_energy_outer;bulletType=ITEM;bulletItem=AMETHYST_SHARD;radius=1.4;points=5;interval=1;duration=999999;oy=1.0} @self
  - midgardDamage{type=CHI;bonus=<skill.var.damage_bonus>} @self


