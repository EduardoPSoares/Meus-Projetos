# ============================================================
# Arqueiro (Archer) Class Skills - MythicMobs Skill Definitions
# Midgard RPG - Minecraft 1.21.1 (Folia)
# ============================================================
# All dynamic values use <skill.var.VARIABLE_NAME> syntax.
# Custom mechanics: midgardDamage, midgardShield
# Color theme: green (#00cc00, #44ff44), gold (#ffcc00),
#              brown (#996633), light blue (#88ccff)
# Particles: end_rod, crit, enchanted_hit, dust_color_transition,
#            flame, snowflake, block_crack
# Sounds: entity.arrow.shoot, entity.arrow.hit_player,
#         entity.generic.explode, item.crossbow.shoot
# ============================================================


# ############################################################
#  1. OLHO DE AGUIA (Eagle Eye) - PASSIVE
#     Passive accuracy and range bonus
#     Variables: precision_bonus (base 3.0 / scale 1.5)
#     Milestones: lvl3=eagle_eye_keen, lvl5=eagle_eye_hawk
#     Effect: Golden eye particles, eagle feather trail
# ############################################################

OlhoDeAguia:
  Skills:
  - skill{s=OlhoDeAguia_Cast} @self

OlhoDeAguia_Cast:
  Skills:
  - effect:particles{p=end_rod;a=3;hs=0.15;vs=0.4;s=0.02} @self
  - effect:particles{p=dust;color=#ffcc00;size=0.6;a=4;hs=0.15;vs=0.35} @self

# --- OlhoDeAguia Mk2: eagle_eye_keen ---

OlhoDeAguiaMk2:
  Skills:
  - skill{s=OlhoDeAguiaMk2_Cast} @self

OlhoDeAguiaMk2_Cast:
  Skills:
  - effect:particles{p=end_rod;a=5;hs=0.2;vs=0.45;s=0.02} @self
  - effect:particles{p=dust;color=#ffcc00;size=0.7;a=6;hs=0.2;vs=0.4} @self
  - effect:particles{p=dust_color_transition;fromColor=#ffcc00;toColor=#44ff44;size=0.5;a=3;hs=0.25;vs=0.5} @self

# --- OlhoDeAguia Mk3: eagle_eye_hawk ---

OlhoDeAguiaMk3:
