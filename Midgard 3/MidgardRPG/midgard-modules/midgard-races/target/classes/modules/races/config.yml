database:
  table-name: "midgard_player_races"

leveling:
  enabled: true
  max-level: 100
  xp-formula: "100 * (level ^ 1.2)"
  base-xp: 100
  multiplier: 1.25

# XP base concedida por ação (0 = desabilitado)
xp-sources:
  combat: 10.0
  mining: 5.0
  woodcutting: 3.0
  harvesting: 4.0
  fishing: 6.0
  building: 1.0
  crafting: 3.0
  exploring: 2.0
  trading: 5.0
