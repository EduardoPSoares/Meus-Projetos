# ═══════════════════════════════════════════════════════════════════
# MIDGARD RACES - MENSAGENS E UI
# Formato: Small Caps Unicode para estilo visual
# ═══════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────
# PLACEHOLDERS
# ─────────────────────────────────────────
placeholder:
  no_race: "<gray>ɴᴇɴʜᴜᴍᴀ</gray>"
  race_name: "<aqua>%race%</aqua>"
  race_level: "<light_purple>%level%</light_purple>"

# ─────────────────────────────────────────
# COMANDOS E SISTEMA
# ─────────────────────────────────────────
command:
  only_players: "<red>✖</red> <gray>ᴀᴘᴇɴᴀs ᴊᴏɢᴀᴅᴏʀᴇs ᴘᴏᴅᴇᴍ ᴜsᴀʀ ᴇsᴛᴇ ᴄᴏᴍᴀɴᴅᴏ.</gray>"
  no_permission: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴛᴇᴍ ᴘᴇʀᴍɪssᴀᴏ ᴘᴀʀᴀ ɪssᴏ.</gray>"
  cant_change_command: "<red>✖</red> <gray>ᴀ ᴛʀᴏᴄᴀ ᴅᴇ ʟɪɴʜᴀɢᴇᴍ ᴇsᴛᴀ ᴅᴇsᴀᴛɪᴠᴀᴅᴀ.</gray>"
  player_not_found: "<red>✖</red> <gray>ᴊᴏɢᴀᴅᴏʀ ɴᴀᴏ ᴇɴᴄᴏɴᴛʀᴀᴅᴏ: <white>%player%</white>"
  profile_error: "<red>✖</red> <gray>ꜰᴀʟʜᴀ ᴀᴏ ᴄᴀʀʀᴇɢᴀʀ ᴅᴀᴅᴏs ᴅᴏ ᴘᴇʀsᴏɴᴀɢᴇᴍ.</gray>"
  cooldown_active: "<red>⏱</red> <gray>ᴀɢᴜᴀʀᴅᴇ <white>%time%</white> <gray>ᴘᴀʀᴀ ᴛʀᴏᴄᴀʀ ᴅᴇ ʟɪɴʜᴀɢᴇᴍ.</gray>"
  race_info: "<green>✔</green> <gray>ʟɪɴʜᴀɢᴇᴍ: <aqua>%race%</aqua>"
  no_race: "<yellow>⚠</yellow> <gray>ʟɪɴʜᴀɢᴇᴍ: <white>ɴᴇɴʜᴜᴍᴀ</white>"
  level_info: "<green>↑</green> <gray>ɴɪᴠᴇʟ: <light_purple>%level%</light_purple>"
  xp_info: "<aqua>ℹ</aqua> <gray>xᴘ: <light_purple>%current%</light_purple><gray>/</gray><light_purple>%required%</light_purple>"
  usage_set: "<yellow>⚠</yellow> <gray>ᴜsᴏ: <white>/rpg race set <player> <race_id></white>"
  race_not_found: "<red>✖</red> <gray>ʟɪɴʜᴀɢᴇᴍ ɴᴀᴏ ᴇɴᴄᴏɴᴛʀᴀᴅᴀ: <white>%race%</white>"
  set_success: "<green>✔</green> <gray>ʟɪɴʜᴀɢᴇᴍ ᴅᴇ <white>%player%</white> <gray>ᴀʟᴛᴇʀᴀᴅᴀ ᴘᴀʀᴀ <aqua>%race%</aqua><gray>.</gray>"
  reload_success: "<green>✔</green> <gray>ᴄᴏɴꜰɪɢᴜʀᴀᴄᴏᴇs ʀᴇᴄᴀʀʀᴇɢᴀᴅᴀs!</gray>"
  already_has_race: "<red>✖</red> <gray>ᴠᴏᴄᴇ ᴊᴀ ᴘᴏssᴜɪ ᴜᴍᴀ ʟɪɴʜᴀɢᴇᴍ!</gray>"
  missing_parent_race: "<red>✖</red> <gray>ᴠᴏᴄᴇ ᴘʀᴇᴄɪsᴀ ᴛᴇʀ ᴀ ʟɪɴʜᴀɢᴇᴍ ᴘᴀɪ ᴘᴀʀᴀ ᴇᴠᴏʟᴜɪʀ ᴘᴀʀᴀ <white>%race%</white><gray>.</gray>"
  race_description: "Gerencia raças dos jogadores"
  race_usage: "/rpg race [select|info|set|exp|reload]"
  admin_hint_set: "<gray>Use: <white>/race set <jogador> <raça>"
  admin_hint_reset: "<gray>Use: <white>/race reset <jogador>"
  usage_exp: "<yellow>⚠</yellow> <gray>ᴜsᴏ: <white>/rpg race exp <player> <amount></white>"
  exp_success: "<green>✔</green> <gray>ᴀᴅɪᴄɪᴏɴᴀᴅᴏ <light_purple>%amount% xᴘ</light_purple> <gray>ᴘᴀʀᴀ <white>%player%</white><gray>.</gray>"
  invalid_amount: "<red>✖</red> <gray>ԡᴜᴀɴᴛɪᴅᴀᴅᴇ ɪɴᴠᴀʟɪᴅᴀ.</gray>"
  reset_success: "<green>✔</green> <gray>ʟɪɴʜᴀɢᴇᴍ ᴅᴇ <white>%player%</white> <gray>ʀᴇsᴇᴛᴀᴅᴀ.</gray>"
  usage_reset: "<yellow>⚠</yellow> <gray>ᴜsᴏ: <white>/rpg race reset <player></white>"

