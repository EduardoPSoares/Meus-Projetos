# ─────────────────────────────────────────
# EVENTOS
# ─────────────────────────────────────────
event:
  race_change: "<green>✔</green> <gray>ɴᴏᴠᴀ ʟɪɴʜᴀɢᴇᴍ: <aqua>%race%</aqua>"
  race_reset: "<yellow>⚠</yellow> <gray>sᴜᴀ ʟɪɴʜᴀɢᴇᴍ ꜰᴏɪ ʀᴇsᴇᴛᴀᴅᴀ.</gray>"
  mutation_unlocked: "<light_purple>✦</light_purple> <gray>ᴍᴜᴛᴀᴄᴀᴏ ᴅᴇsʙʟᴏǫᴜᴇᴀᴅᴀ: <white>%mutation%</white>"
  level_up:
    - ""
    - "  <gradient:#a855f7:#ec4899><bold>ʀᴀᴄᴇ ʟᴇᴠᴇʟ ᴜᴘ!</bold></gradient>"
    - "  <gray>ɴɪᴠᴇʟ <white>%new%</white> <gray>ᴀʟᴄᴀɴᴄᴀᴅᴏ!</gray>"
    - ""

# ─────────────────────────────────────────
# EVOLUÇÃO (Mensagens de sistema)
# ─────────────────────────────────────────
evolution:
  requirements_not_met: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴀᴛᴇɴᴅᴇ ᴏs ʀᴇǫᴜɪsɪᴛᴏs ᴘᴀʀᴀ <white>%race%</white>."
  branch_locked: "<red>✖</red> <gray>ᴏ ᴄᴀᴍɪɴʜᴏ <white>%race%</white> <gray>ᴇsᴛᴀ ꜰᴇᴄʜᴀᴅᴏ. ᴠᴏᴄᴇ ᴊᴀ ᴇsᴄᴏʟʜᴇᴜ ᴏᴜᴛʀᴏ ʙʀᴀɴᴄʜ ᴇᴍ <white>%branch%</white>."
  devolution_disabled: "<red>✖</red> <gray>ᴅᴇ-ᴇᴠᴏʟᴜᴄᴀᴏ ᴇsᴛᴀ ᴅᴇsᴀᴛɪᴠᴀᴅᴀ."
  devolution_blocked: "<red>✖</red> <gray>ɴᴀᴏ ᴇ ᴘᴏssɪᴠᴇʟ ʀᴇɢʀᴇᴅɪʀ ɴᴀ ʀᴀᴄᴀ <white>%race%</white>."
  no_previous_race: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴛᴇᴍ ᴜᴍᴀ ʀᴀᴄᴀ ᴀɴᴛᴇʀɪᴏʀ ɴᴏ ʜɪsᴛᴏʀɪᴄᴏ."
  previous_race_invalid: "<red>✖</red> <gray>ᴀ ʀᴀᴄᴀ ᴀɴᴛᴇʀɪᴏʀ ɴᴀᴏ ᴇxɪsᴛᴇ ᴍᴀɪs."
  devolution_no_money: "<red>✖</red> <gray>ᴠᴏᴄᴇ ᴘʀᴇᴄɪsᴀ ᴅᴇ <gold>%cost%</gold> <gray>ᴘᴀʀᴀ ᴅᴇ-ᴇᴠᴏʟᴜɪʀ."
  devolved: "<yellow>⚠</yellow> <gray>ᴠᴏᴄᴇ ʀᴇɢʀᴇᴅɪᴜ ᴘᴀʀᴀ <aqua>%race%</aqua>."

# ─────────────────────────────────────────
# AJUDA
# ─────────────────────────────────────────
help:
  header: "<gradient:#a855f7:#ec4899><bold>ᴄᴏᴍᴀɴᴅᴏs ᴅᴇ ʟɪɴʜᴀɢᴇᴍ</bold></gradient>"
  select: "<gray>• <white>/rpg race select</white> <gray>- ᴇsᴄᴏʟʜᴇʀ ʟɪɴʜᴀɢᴇᴍ</gray>"
  info: "<gray>• <white>/rpg race info</white> <gray>- ᴠᴇʀ sᴇᴜ ᴘᴇʀꜰɪʟ</gray>"
  set: "<gray>• <white>/rpg race set <jogador> <id></white> <gray>- ᴅᴇꜰɪɴɪʀ (ᴀᴅᴍɪɴ)</gray>"
  reset: "<gray>• <white>/rpg race reset <jogador></white> <gray>- ʀᴇsᴇᴛᴀʀ (ᴀᴅᴍɪɴ)</gray>"
  exp: "<gray>• <white>/rpg race exp <jogador> <qtd></white> <gray>- ᴅᴀʀ xᴘ (ᴀᴅᴍɪɴ)</gray>"
  reload: "<gray>• <white>/rpg race reload</white> <gray>- ʀᴇᴄᴀʀʀᴇɢᴀʀ ᴄᴏɴꜰɪɢs</gray>"
  admin: "<gray>• <white>/rpg race admin</white> <gray>- ᴘᴀɪɴᴇʟ ᴀᴅᴍɪɴ</gray>"

# ═══════════════════════════════════════════════════════════════════
# GUI - INTERFACE DO USUÁRIO
# ═══════════════════════════════════════════════════════════════════

gui:
  # ─────────────────────────────────────────
  # ELEMENTOS GERAIS
  # ─────────────────────────────────────────
  general:
    back: "<gray>« ᴠᴏʟᴛᴀʀ"
    close: "<gray>✕ ꜰᴇᴄʜᴀʀ"
    filler_name: " "
    page_indicator: "<dark_gray>ᴘᴀɢɪɴᴀ <white>%current%"
    previous_page: "<gray>« ᴀɴᴛᴇʀɪᴏʀ"
    next_page: "<gray>ᴘʀᴏxɪᴍᴀ »"

  errors:
    insufficient_level: "<red>✖</red> <gray>ɴɪᴠᴇʟ ɪɴsᴜꜰɪᴄɪᴇɴᴛᴇ ᴘᴀʀᴀ ᴇsᴛᴀ ᴇᴠᴏʟᴜᴄᴀᴏ.</gray>"
    diet_restriction: "<red>✖</red> <gray>sᴜᴀ ʟɪɴʜᴀɢᴇᴍ ʀᴇᴊᴇɪᴛᴀ ᴇsᴛᴇ ᴀʟɪᴍᴇɴᴛᴏ.</gray>"
    ability_cooldown: "<red>⏱</red> <gray>ʀᴇᴄᴀʀɢᴀ: <white>%remaining%s</white>"

  # ─────────────────────────────────────────
  # MENU PRINCIPAL (3 linhas - compacto)
  # ─────────────────────────────────────────
  main_menu:
    title: "<white>ʟɪɴʜᴀɢᴇᴍ"

    # Perfil do jogador (item central superior)
    profile:
      name: "<white>%player%"
      lore_with_race: "\n<gray>ʟɪɴʜᴀɢᴇᴍ: <aqua>%race%\n<gray>ɴɪᴠᴇʟ ᴅᴇ ʟɪɴʜᴀɢᴇᴍ: <light_purple>%level%\n<gray>xᴘ: <white>%xp%<dark_gray>/<white>%required%\n<gray>ᴘʀᴏɢʀᴇssᴏ: <green>%percent%%\n\n<dark_gray>• <gray>ʜᴀʙɪʟɪᴅᴀᴅᴇs ɴᴏ ᴍᴇɴᴜ ᴀᴏ ʟᴀᴅᴏ\n<dark_gray>• <gray>ᴇᴠᴏʟᴜᴄᴏᴇs ᴅᴇsᴛʀᴀᴠᴀᴍ ᴘᴏʀ ɴɪᴠᴇʟ"
      lore_no_race: "\n<dark_gray>sᴇᴍ ʟɪɴʜᴀɢᴇᴍ\n<gray>ᴠᴏᴄᴇ ᴀɪɴᴅᴀ ɴᴀᴏ ᴇsᴄᴏʟʜᴇᴜ sᴜᴀ ᴏʀɪɢᴇᴍ.\n\n<yellow>▶ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ɪɴɪᴄɪᴀʀ"

    # Botões informativos
    info_what_is:
      name: "<aqua>ᴏ ǫᴜᴇ sᴀᴏ ʟɪɴʜᴀɢᴇɴs?</aqua>"
      lore: "\n<gray>ʟɪɴʜᴀɢᴇɴs ᴅᴇꜰɪɴᴇᴍ sᴜᴀ ᴇssᴇɴᴄɪᴀ\n<gray>ᴀɴᴄᴇsᴛʀᴀʟ ᴇ ᴘᴏᴅᴇʀ ᴇxᴄʟᴜsɪᴠᴏ.\n\n<dark_gray>• <gray>ᴀᴛʀɪʙᴜᴛᴏs ʙᴀsᴇ ᴇ ᴘᴏʀ ɴɪᴠᴇʟ\n<dark_gray>• <gray>ʜᴀʙɪʟɪᴅᴀᴅᴇs ᴘᴀssɪᴠᴀs ᴇ ᴀᴛɪᴠᴀs\n<dark_gray>• <gray>ᴇᴠᴏʟᴜᴄᴏᴇs ᴄᴏᴍ ʀᴇǫᴜɪsɪᴛᴏs"
    info_benefits:
      name: "<green>ʙᴇɴᴇꜰɪᴄɪᴏs</green>"
      lore: "\n<green>✔ <gray>ʙᴏɴᴜs ᴅᴇ ᴀᴛʀɪʙᴜᴛᴏs ᴜɴɪᴄᴏs\n<green>✔ <gray>ʜᴀʙɪʟɪᴅᴀᴅᴇs ᴇxᴄʟᴜsɪᴠᴀs\n<green>✔ <gray>ʟɪɴʜᴀs ᴅᴇ ᴇᴠᴏʟᴜᴄᴀᴏ\n\n<yellow>⚠ <gray>ᴇsᴄᴏʟʜᴀ ᴇ ᴘᴇʀᴍᴀɴᴇɴᴛᴇ"

    # Botão de info da raça atual
    race_info:
      name: "<aqua>%race%</aqua>"
      lore: "\n<gray>sᴜᴀ ʟɪɴʜᴀɢᴇᴍ ᴀᴛᴜᴀʟ.\n<dark_gray>ᴠᴇᴊᴀ ᴀᴛʀɪʙᴜᴛᴏs, ʙᴏɴᴜs ᴇ ᴇᴠᴏʟᴜᴄᴀᴏ.\n\n<yellow>▶ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴅᴇᴛᴀʟʜᴇs"

    # Botões de navegação
    abilities:
      name: "<light_purple>ʜᴀʙɪʟɪᴅᴀᴅᴇs</light_purple>"
      lore: "\n<gray>ʜᴀʙɪʟɪᴅᴀᴅᴇs ʀᴀᴄɪᴀɪs ᴇ ᴛʀᴀᴄᴏs\n<gray>ǫᴜᴇ ᴇᴠᴏʟᴜᴇᴍ ᴄᴏᴍ sᴇᴜ ɴɪᴠᴇʟ.\n\n<yellow>▶ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴠᴇʀ"

    progression:
      name: "<gold>ᴘʀᴏɢʀᴇssᴀᴏ</gold>"
      lore: "\n<gray>ɴɪᴠᴇʟ <light_purple>%level%\n<gray>xᴘ <white>%xp%<dark_gray>/<white>%required%\n<gray>ᴘʀᴏɢʀᴇssᴏ ᴅᴀ ʟɪɴʜᴀɢᴇᴍ\n\n<yellow>▶ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴅᴇᴛᴀʟʜᴇs"

    evolution:
      name: "<red>ᴇᴠᴏʟᴜᴄᴀᴏ</red>"
      lore_available: "\n<gray>ᴇᴠᴏʟᴜᴄᴏᴇs ᴅɪsᴘᴏɴɪᴠᴇɪs\n<gray>ᴘᴀʀᴀ sᴜᴀ ʟɪɴʜᴀɢᴇᴍ.\n<dark_gray>ʀᴇǫᴜɪsɪᴛᴏs ᴘᴏʀ ɴɪᴠᴇʟ.\n\n<yellow>▶ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴠᴇʀ"
      lore_none: "\n<dark_gray>sᴜᴀ ʟɪɴʜᴀɢᴇᴍ ᴀʟᴄᴀɴᴄᴏᴜ\n<dark_gray>ᴏ ᴀᴘɪᴄᴇ ᴅᴀ ᴇᴠᴏʟᴜᴄᴀᴏ."

    select_race:
      name: "<gradient:#10b981:#059669>✦ ᴇsᴄᴏʟʜᴇʀ ʟɪɴʜᴀɢᴇᴍ</gradient>"
      lore: "\n<gray>ᴇsᴄᴏʟʜᴀ sᴜᴀ ᴏʀɪɢᴇᴍ ᴀɴᴄᴇsᴛʀᴀʟ\n<gray>ᴇ ɪɴɪᴄɪᴇ sᴜᴀ ᴊᴏʀɴᴀᴅᴀ ᴇᴍ ᴍɪᴅɢᴀʀᴅ.\n\n<green>▶ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴇsᴄᴏʟʜᴇʀ"

