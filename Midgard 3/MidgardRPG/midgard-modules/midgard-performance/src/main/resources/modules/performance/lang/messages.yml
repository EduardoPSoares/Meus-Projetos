        title: "TPS Baixo"
        suggestion: "Verifique entidades, redstone, hoppers e plugins pesados"
      mspt-high:
        title: "MSPT Alto"
        suggestion: "Ticks estão demorando demais - identifique operações síncronas pesadas"
      memory-high:
        title: "Memória Alta"
        suggestion: "Considere aumentar heap ou verificar memory leaks"
      cpu-high:
        title: "CPU Alta"
        suggestion: "Identifique processos intensivos ou loops infinitos"
      gc-frequent:
        title: "GC Frequente"
        suggestion: "Muitas alocações de objetos - otimize uso de memória"
      slow-module:
        title: "Módulo Lento: "
        init-time: "Tempo de inicialização: %dms"
        suggestion: "Otimize onEnable() ou mova operações para async"
      moderate-module:
        title: "Módulo Moderado: "
        suggestion: "Considere lazy loading ou async init"
      slow-operation:
        title: "Operação Lenta: "
        description: "Tempo máximo: %dms (%d execuções)"
        suggestion: "Otimize ou mova para thread async"
      slow-listener:
        title: "Listener Lento: "
        description: "%s - %dms máximo"
        suggestion: "Mova lógica pesada para async ou otimize"
      slow-command:
        title: "Comando Lento: /"
        description: "Tempo máximo: %dms"
        suggestion: "Comandos devem executar rapidamente - use async para operações pesadas"
    recommendation:
      tps-optimization:
        title: "Otimização de TPS"
        step1: "Execute /spark profiler para identificar gargalos"
        step2: "Verifique entidades excessivas em chunks"
        step3: "Reduza hoppers e redstone complexa"
        step4: "Use Paper's async chunk loading"
      memory-optimization:
        title: "Otimização de Memória"
        step1: "Execute /spark heapsummary para análise de heap"
        step2: "Verifique cache de dados não liberados"
        step3: "Use object pooling para objetos frequentes"
        step4: "Considere aumentar -Xmx se necessário"
      module-optimization:
        title: "Otimização de Módulos"
        step1: "Mova I/O para CompletableFuture"
        step2: "Implemente lazy loading para recursos pesados"
        step3: "Cache resultados de operações frequentes"
        step4: "Use BukkitScheduler para tarefas não-críticas"
      many-listeners:
        title: "Muitos Event Listeners"
        step1: "Considere combinar listeners relacionados"
        step2: "Use event priorities corretamente"
        step3: "Evite listeners em eventos de alta frequência"
      many-operations:
        title: "Muitas Operações Rastreadas"
        step1: "Limite uso do profiler em produção"
        step2: "Use sampling ao invés de tracing completo"
      install-spark:
        title: "Instale o Spark Profiler"
        step1: "Spark fornece métricas precisas de TPS/MSPT/CPU"
        step2: "Permite profiling detalhado de threads"
        step3: "Análise de heap e GC em tempo real"
        step4: "Download: https://spark.lucko.me/"
    category:
      memory: "Memória"
      module: "Módulo"
      event: "Evento"
      command: "Comando"
      operation: "Operação"
    priority:
      high: "Alta"
      medium: "Média"
      low: "Baixa"

