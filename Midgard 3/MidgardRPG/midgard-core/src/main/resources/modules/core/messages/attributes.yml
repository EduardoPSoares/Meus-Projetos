# ==============================================================================
#                           ATRIBUTOS VITAIS
# ==============================================================================
# Atributos que controlam a sobrevivência básica do jogador
# ==============================================================================
max_health:
  name: "<red>❤ ᴠɪᴅᴀ ᴍᴀxɪᴍᴀ"
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ᴄᴏɴᴛʀᴏʟᴀ ǫᴜᴀɴᴛᴀ ᴠɪᴅᴀ ᴠᴏᴄᴇ ᴘᴏᴅᴇ ᴛᴇʀ.</gray>"
    - "<gray>ᴠᴀʟᴏʀᴇs ᴀʟᴛᴏs ᴘᴇʀᴍɪᴛᴇᴍ sᴜᴘᴏʀᴛᴀʀ ᴍᴀɪs ᴅᴀɴᴏ.</gray>"
    - "<yellow>✨ ᴇssᴇɴᴄɪᴀʟ ᴘᴀʀᴀ sᴏʙʀᴇᴠɪᴠᴇɴᴄɪᴀ ᴇᴍ ᴄᴏᴍʙᴀᴛᴇ!</yellow>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"

health_regen:
  name: "<red>❤ ʀᴇɢᴇɴᴇʀᴀᴄᴀᴏ ᴅᴇ ᴠɪᴅᴀ"
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ʀᴇᴄᴜᴘᴇʀᴀ sᴜᴀ ᴠɪᴅᴀ ᴀᴜᴛᴏᴍᴀᴛɪᴄᴀᴍᴇɴᴛᴇ ᴀᴏ ʟᴏɴɢᴏ ᴅᴏ ᴛᴇᴍᴘᴏ.</gray>"
    - "<yellow>⚡ ᴠᴀʟᴏʀ ᴇ ᴄᴀʟᴄᴜʟᴀᴅᴏ ᴘᴏʀ sᴇɢᴜɴᴅᴏ.</yellow>"
    - "<aqua>✚ ɪᴅᴇᴀʟ ᴘᴀʀᴀ ʙᴀᴛᴀʟʜᴀs ʟᴏɴɢᴀs!</aqua>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"

max_mana:
  name: "<blue>💧 ᴍᴀɴᴀ ᴍᴀxɪᴍᴀ"
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ᴀᴜᴍᴇɴᴛᴀ sᴜᴀ ʀᴇsᴇʀᴠᴀ ᴅᴇ ᴇɴᴇʀɢɪᴀ ᴍᴀɢɪᴄᴀ.</gray>"
    - "<gray>ᴘᴇʀᴍɪᴛᴇ ᴜsᴀʀ ᴍᴀɪs ꜰᴇɪᴛɪᴄᴏs ᴀɴᴛᴇs ᴅᴇ ᴇsɢᴏᴛᴀʀ.</gray>"
    - "<yellow>✨ ꜰᴜɴᴅᴀᴍᴇɴᴛᴀʟ ᴘᴀʀᴀ ᴄʟᴀssᴇs ᴍᴀɢɪᴄᴀs!</yellow>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"

mana_regen:
  name: "<blue>💧 ʀᴇɢᴇɴᴇʀᴀᴄᴀᴏ ᴅᴇ ᴍᴀɴᴀ"
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ʀᴇᴄᴜᴘᴇʀᴀ sᴜᴀ ᴍᴀɴᴀ ᴀᴜᴛᴏᴍᴀᴛɪᴄᴀᴍᴇɴᴛᴇ ᴀᴏ ʟᴏɴɢᴏ ᴅᴏ ᴛᴇᴍᴘᴏ.</gray>"
    - "<yellow>💡 ᴠᴀʟᴏʀ ᴇ ᴄᴀʟᴄᴜʟᴀᴅᴏ ᴘᴏʀ sᴇɢᴜɴᴅᴏ.</yellow>"
    - "<aqua>🔮 ᴘᴇʀᴍɪᴛᴇ ᴜsᴀʀ ꜰᴇɪᴛɪᴄᴏs ᴍᴀɪs ꜰʀᴇǫᴜᴇɴᴛᴇᴍᴇɴᴛᴇ!</aqua>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"

max_stamina:
  name: "<yellow>⚡ ᴇsᴛᴀᴍɪɴᴀ ᴍᴀxɪᴍᴀ"
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ᴀᴜᴍᴇɴᴛᴀ sᴜᴀ ᴇɴᴇʀɢɪᴀ ꜰɪsɪᴄᴀ ᴅɪsᴘᴏɴɪᴠᴇʟ.</gray>"
    - "<gray>ɴᴇᴄᴇssᴀʀɪᴀ ᴘᴀʀᴀ ᴄᴏʀʀᴇʀ ᴇ ᴜsᴀʀ ʜᴀʙɪʟɪᴅᴀᴅᴇs ꜰɪsɪᴄᴀs.</gray>"
    - "<yellow>⚔ ɪᴍᴘᴏʀᴛᴀɴᴛᴇ ᴘᴀʀᴀ ᴄʟᴀssᴇs ᴄᴏʀᴘᴏ-ᴀ-ᴄᴏʀᴘᴏ!</yellow>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"

stamina_regen:
  name: "<yellow>⚡ ʀᴇɢᴇɴᴇʀᴀᴄᴀᴏ ᴅᴇ ᴇsᴛᴀᴍɪɴᴀ"
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ʀᴇᴄᴜᴘᴇʀᴀ sᴜᴀ ᴇsᴛᴀᴍɪɴᴀ ᴀᴜᴛᴏᴍᴀᴛɪᴄᴀᴍᴇɴᴛᴇ.</gray>"
    - "<yellow>💡 ᴠᴀʟᴏʀ ᴇ ᴄᴀʟᴄᴜʟᴀᴅᴏ ᴘᴏʀ sᴇɢᴜɴᴅᴏ.</yellow>"
    - "<aqua>🏃 ᴘᴇʀᴍɪᴛᴇ ᴀᴄᴏᴇs ꜰɪsɪᴄᴀs ᴍᴀɪs ꜰʀᴇǫᴜᴇɴᴛᴇs!</aqua>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"

# ==============================================================================
#                           ATRIBUTOS PRIMÁRIOS
# ==============================================================================
# Atributos principais que afetam múltiplos aspectos do personagem
# ==============================================================================
strength:
  name: "<dark_red>⚔ ꜰᴏʀᴄᴀ"
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ᴀᴜᴍᴇɴᴛᴀ ᴏ ᴅᴀɴᴏ ᴄᴀᴜsᴀᴅᴏ ᴘᴏʀ ᴀᴛᴀǫᴜᴇs ꜰɪsɪᴄᴏs.</gray>"
    - "<gray>ɪɴꜰʟᴜᴇɴᴄɪᴀ ᴀ ᴄᴀᴘᴀᴄɪᴅᴀᴅᴇ ᴅᴇ ᴄᴀʀɢᴀ ᴅᴇ ɪᴛᴇɴs.</gray>"
    - "<yellow>💪 ᴘʀɪɴᴄɪᴘᴀʟ ᴀᴛʀɪʙᴜᴛᴏ ᴘᴀʀᴀ ɢᴜᴇʀʀᴇɪʀᴏs!</yellow>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"

intelligence:
  name: "<aqua>🧠 ɪɴᴛᴇʟɪɢᴇɴᴄɪᴀ"
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ᴀᴜᴍᴇɴᴛᴀ ᴏ ᴅᴀɴᴏ ᴍᴀɢɪᴄᴏ ᴅᴇ ꜰᴇɪᴛɪᴄᴏs ᴇ ʜᴀʙɪʟɪᴅᴀᴅᴇs.</gray>"
    - "<gray>ᴛᴀᴍʙᴇᴍ ᴀᴜᴍᴇɴᴛᴀ sᴜᴀ ᴍᴀɴᴀ ᴍᴀxɪᴍᴀ.</gray>"
    - "<yellow>✨ ᴘʀɪɴᴄɪᴘᴀʟ ᴀᴛʀɪʙᴜᴛᴏ ᴘᴀʀᴀ ᴍᴀɢᴏs!</yellow>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"

dexterity:
  name: "<green>🏹 ᴅᴇsᴛʀᴇᴢᴀ"
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ᴀᴜᴍᴇɴᴛᴀ ᴀ ᴄʜᴀɴᴄᴇ ᴅᴇ ᴀᴄᴇʀᴛᴀʀ ᴄʀɪᴛɪᴄᴏs.</gray>"
    - "<gray>ᴍᴇʟʜᴏʀᴀ ᴀ ᴘʀᴇᴄɪsᴀᴏ ᴅᴇ ᴀᴛᴀǫᴜᴇs.</gray>"
    - "<yellow>🎯 ᴘʀɪɴᴄɪᴘᴀʟ ᴀᴛʀɪʙᴜᴛᴏ ᴘᴀʀᴀ ᴀʀǫᴜᴇɪʀᴏs!</yellow>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"

defense:
  name: "<dark_gray>🛡 ᴅᴇꜰᴇsᴀ"
  lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ʀᴇᴅᴜᴢ ᴏ ᴅᴀɴᴏ ꜰɪsɪᴄᴏ ʀᴇᴄᴇʙɪᴅᴏ ᴅᴏs ɪɴɪᴍɪɢᴏs.</gray>"
    - "<yellow>🛡 ꜰᴜɴᴅᴀᴍᴇɴᴛᴀʟ ᴘᴀʀᴀ ᴛᴀɴǫᴜᴇs!</yellow>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━"

# Atributos Ofensivos
