# Configuração de Atributos do MidgardRPG
# Aqui você define todos os atributos customizados do servidor.
#
# ==============================================================================
#                        ESTRUTURA DOS ATRIBUTOS
# ==============================================================================
# id_do_atributo:           -> ID interno usado pelo plugin (não use espaços)
#   name: "Nome Exibido"    -> Nome que aparece em menus e mensagens (Suporta MiniMessage)
#   icon: "Ícone"           -> Emoji ou caractere unicode para representar o atributo
#   format: "0.0"           -> Formato numérico (Java DecimalFormat). Ex: 0, 0.0, 0%
#   base: 100.0             -> Valor inicial padrão para todos os jogadores
#   min: 0.0                -> Valor mínimo que o atributo pode atingir
#   max: 10000.0            -> Valor máximo (cap) do atributo
#
# ==============================================================================
#                        LISTA DE ATRIBUTOS
# ==============================================================================

