# MAX_HEALTH
# KNOCKBACK_RESISTANCE
# MOVEMENT_SPEED
# ATTACK_DAMAGE
# ATTACK_SPEED
# ARMOR
# ARMOR_TOUGHNESS
# LUCK

# If you are using version 1.21 or higher, additional default player attributes are available.
# You can find the full list of attributes in the Spigot Javadocs.

# Classes are similar to races in how they are created, with many shared options for consistency
# and ease of use. Both classes and races share several features.

# The primary distinction between the two is that class attributes act as modifiers. These attributes
# add to or subtract from the base attributes of a race. For example:
# - If a race provides 10.0 health and the class adds 2.0 health, the total player health will be 12.0.
# Classes effectively increase or decrease attributes based on their configuration.

# Classes also support the 'executeCommand' feature, which works identically to races.
# Commands are defined in the regular `config.yml` and use the `====` ending for execution.

# IMPORTANT NOTES:
# 1. Classes can be used within the MrPremiumAddons configuration for additional customization.
# 2. A class and a race must have unique names. If they share the same name, the plugin will break.

# Adding Attributes to Races:
# - Use the `passiveAttributes` list to add attributes to a race.
# - Specify the attribute name followed by a value to add to the base race attribute.
# Example:
#   MAX_HEALTH 10.0  # Adds 10 extra health to the race's base health.

# SKILLS LIST:
# - The `skills` list is a placeholder for future updates and should not be modified.
# - Future updates will introduce hardcoded skill types. Until then, abilities can be added
#   to classes or races, allowing for extensive customization.

other:

  # Cooldown timer, is in MINUTES, NEVER PUT THIS NUMBER INTO NEGATIVES
  cooldown: 1440

  # default Class upon joining
  # If you want a random default Class replace this with '{randomClass}'
  # dont forget the single quotation marks aka these things -> '
  # or else the random thing wont work
  defaultClass: 'None'

  # Gui display name
  guiName: 'Choosing Class'

  # Gui head player display name
  guiPlayerDisplay: 'You'

  # Gui slot number for player head
  guiPlayerDisplayNumber: 4

  # Amount of slots the GUI has, max is 54
  guiSlots: 36

  # Amount of slots the GUI has, max is 54
  treeGuiSlots: 54

  # Disable the display names in the GUI for the classes, in both the gui and tree
  # This will disable the display names for the classes in the GUI
  disableGuiDisplayNames: false

  # Item for forwardClick
  forwardClickItem: 'PAPER'

  # When this slot is clicked, open up next GUI list
  forwardClick: 35

  # Next page
  forwardClickDisplay: 'Next page'

  # Paper item
  backwardClickItem: 'PAPER'

  # Previous page
  backwardClick: 18

  backwardClickDisplay: 'Previous page'

  # Lore hovering over the player head, yes this supports PAPI
  guiPlayerLore:
    - 'Class: {class}'

  treeNonSlots: 'BLACK_STAINED_GLASS_PANE'

  treeName: 'Your Class tree'


