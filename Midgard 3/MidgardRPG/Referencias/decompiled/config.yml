leveling: # this is only for the type 'RUNNING'
   
   # this is the distance number
   distance: 10
   
   # every X amount of ticks, 20 ticks = 1 second, calculate distance
   time: 600

# Messages
# To change the cooldown time manually for a player, the time is in the data.yml file
cooldownMessage: '&4You still have a cooldown! {time} minutes remaining until you may choose another race!'
currentBiome: '&aStanding in biome &2{biome}'
noPerm: '&4No Permission | Missing permission: &c{perm}'
invalidRace: '&4Invalid Race/Class'
listRaces: '&aKnown races are &2{races}'
chosenRace: '&aYou have chosen the race &2{race}'
reload: '&aReloaded mythical races | It is not recommended to use this command, restarting or /reload confirm is preffered'
switchUserRace: '&aSpecified players race is now {race}'
invalidPlayer: '&aInvalid player'
invalidArgs: '&4Invalid arguments, type /races help'
levelup: '&aYou leveled up! Your new race level is {level}'
notRequiredLevel: '&4Your level is not high enough to select this race!'
setPlayersLevel: '&aSet players race level to {lvl}'
notInt: '&aMust be an integer'
update: '&aThere is an update for the Mythical Races Package! Remember to read the changelog before updating!'
addXP: '&aAdded {xp} to specified players XP' # note that when doing this command, you can use negative values for "decreasing" the amount
displaySubs: '&aThe sub-evolutions of the race or class is: {races/classes}'
disabledWorld: '&4Cannot use race commands in this world'
resetPlayersCooldown: '&aReset players race and class cooldown'
profile:
  - "&a&l - - - &2&l{name}&r&a&l's User Profile &a&l- - -"
  - '&aRace: &2{race}'
  - '&aLevel: &2{level}'
  - '&aXP: &2{xp}&a/&2{xp-max}'
  - '&aClass: &2{class}'
  - '&aClass Level: &2{class-level}'
  - '&aClass XP: &2{xp-class}&a/&2{xp-max-class}'
help:
   - '&a - - - &2Mythical Races Help Menu&a - - -'
   - '&a/races choose [race/class] - choose specific race or class'
   - '&a/races list - display base races'
   - '&a/races info [race/class] - display info about race'
   - '&a/races gui - display list of races'
   - '&a/races tree - display race evolution tree'
   - '&a/races classgui - display list of classes'
   - '&a/races classtree - display list of races'
   - '&a/races sub [race/class] - display sub-evolutions of the race/class'
   - '&a/races profile - display your race profile'
   - '&a/races profile [player] view someone elses races profile'
   - '&a/races profilegui - open the player profile GUI'
   - '&a/races lvlset [player] [integer]'
   - '&a/races lvlsetclass [player] [integer]'
   - '&a/races set [race] [player] - forcibly set a players race'
   - '&a/races addxp [player] [xp] - add xp to players race, (positive/negative) values work'
   - '&a/races addxpclass [player] [xp] - add xp to players class, (positive/negative) values work'
   - '&a/races biome - for config purposes'
   - '&a/races rcooldown - reset cooldown of a players class/race'
   - '&a/races leaderboard'
   - '&a/races questslist'
   - '&a/races questprogress [quest name] - view quest progress'
   - '&a/races questsview [quest name] - view quest lore/description'
   - '&a/races reset [player] - reset race, class, force gui, cooldown, xp and level of a player'
   - '&a/races toggle - toggle potion effects and abilities'
   - '&a/races toggleplayer [player] - toggle potion effects and abilities for a player'
   - '&a/races attribute-reset [player] - forcefully remove attribute modifiers from a player'


   
leaderboard:
   - '&a - - - - &2Top 20 Highest level players - - - - - '

leaderboardMid: '&a {position}. {username} > {lvl} > {race}'

resetPlayer: "&aReset {player}'s race, quests, class, force race modifier, level and xp, and cooldown"

toggleAbility: "&2Potion effects and abilities have been toggled to &4&l{toggle}&2!"

toggleAbilityOther: "&2Potion effects and abilities have been toggled to &4&l{toggle}&2! for {player}"