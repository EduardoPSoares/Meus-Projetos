# *********************************************************** #
#                                                            #
# Mythical Races Configuration File - Version 2.7.4-SE-V1     #
#                                                            #
# *********************************************************** #

# &l-----&l-----&l----- Basic Attributes &l-----&l-----&l-----
# List: MAX_HEALTH, KNOCKBACK_RESISTANCE, MOVEMENT_SPEED,
#       ATTACK_DAMAGE, ATTACK_SPEED, ARMOR,
#       ARMOR_TOUGHNESS, LUCK
# (if you are using 1.21 or higher there are more default player attributes, you can find them in the spigot javadocs)

# Potion effects: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/potion/PotionEffectType.html

# &l-----&l-----&l----- Race Configuration &l-----&l-----&l-----
# To add a new race, use the following structure.
# Replace 'raceName' and other placeholders with your desired values.

# raceName:
#   displayName: 'DisplayNameOfRace'
#   material: 'MaterialForGUI'
#   guiPage: 1 # GUI page to display race
#   isSubRace: false # Is this a subrace?
#   subRaceType: '' # Parent race (only if 'isSubRace' is true)
#   treeSlot: 4 # Slot in /races tree
#   levelRequire: 0 # Required level to choose race
#   slot: 11 # Slot for material in GUI
#   lvlType: 'RUNNING' # Leveling method for race
#   maxLevel: 100 # Maximum attainable level for race
#   gainXP: 2 # XP gained per event occurrence for 'lvlType'
#   xpPerLevel: 24 # XP required for next level (multiplier for current level)
#   # Add lore (flavor text) for the race here.
#   lore:
#     - '&4&l----- &c&lRace Name Race &4&l-----'
#     - '&cDescription and stuff'
#     - ' '
#     - '&5&l----- Day Time Passive Effects &l-----'
#     - 'Day time effects and stuff'
#     - '&5&l----- Night Time Passive Effects &l-----'
#     - 'Night time effects and stuff'
#    # Specify potion effects, attributes and conditions for day and night below.
#    # Add 'null' if an area isn't used.
#    # Add 'MOVEMENT_SPEED' to 'dayPassiveGenericAttributes' or 'nightPassiveGenericAttributes'.
#    # Adjust base attribute values as needed. Use 'ALL Y > -1000 -1 ALL ALL ALL ALL' for a standard setting.
#    dayPassivePotionEffects:
#      - null
#    dayPassivePotionEffectsBase:
#      - null
#    dayRaceDataPotion:
#      - null
#    dayPassiveGenericAttributes:
#      - 'MOVEMENT_SPEED'
#    dayPassiveGenericAttributesBase:
#      - 0.1
#    dayRacePassiveAttributesLevel:
#      - 0.0
#    dayRaceDataAttribute:
#      - 'ALL Y > -1000 -1 ALL ALL ALL ALL'
#    nightPassivePotionEffects:
#      - null
#    nightPassivePotionEffectsBase:
#      - null
#    nightRaceDataPotion:
#      - null
#    nightPassiveGenericAttributes:
#      - 'MOVEMENT_SPEED'
#    nightPassiveGenericAttributesBase:
#      - 0.1
#    nightRacePassiveAttributesLevel:
#      - 0.0
#    nightRaceDataAttribute:
#      - 'ALL Y > -1000 -1 ALL ALL ALL ALL'

#   # Execute a console command when switching races, using {player} for player's name.
#   # Add '====' at the end to execute the command when leaving the race.
#   executeCommandUponSwitching:
#     - null

# &l-----&l-----&l----- Data Structure &l-----&l-----&l-----
# First arg: BIOMES ('ALL' for all biomes, or specify biome names)
# Second arg: 'Y' (Player's Y coordinate)
# Third arg: Comparison operator for Y
# Fourth arg: Y value for comparison
# Fifth arg: Amplifier adjustment for out-of-area effect (-1 to remove potion effects)
# Sixth arg: Position of blocks for effect application ('ALL', 'ABOVE', 'MID', 'BELOW', 'AROUND')
# Seventh arg: Type of blocks required for effect application
# Eighth arg: Weather condition for effect application ('TRUE', 'FALSE', 'ALL')
# Ninth arg: World name for effect application ('ALL', or specify world names)

# Example: 'SAVANNA,ANOTHERBIOME Y > -100 -1 ALL STONE,ANOTHERBLOCK ALL world,ANOTHERWORLD'

# &l-----&l-----&l----- Leveling Types &l-----&l-----&l-----
# HUNTING, RUNNING, HARVESTING, BUILDER, FISHING, EXCAVATION, MINER, WOODCUTTER, TANKER,
# SWIMMING, FLYING, DIGGER, ARCHER

# &l-----&l-----&l----- Material Setup &l-----&l-----&l-----
# Material can be a regular Minecraft material, a material with custom ID, or a URL from https://textures.minecraft.net/
# Examples: 'MATERIAL', 'MATERIAL:ID', 'https://textures.minecraft.net/texture/5193c89d1df679854f33c2215247b676a159d5395392d0c61b8476f813d9# For example '&7This is a message with hex colour codes and normal colour codes #00FF00/ This is some green text &6This is some gold text'
# You can see in the example that the hex colour code is '#00FF00/' and the normal colour code is '&6'
# You also see that the single quotation marks are around the whole message
# Now if you don't want the single quotation marks around the whole message, then you need to put double quotation marks around the hex colour code
# For example '&7This is a message with hex colour codes and normal colour codes "#00FF00/" This is some green text &6This is some gold text'
# You can see in the example that the hex colour code is '"#00FF00/"' and the normal colour code is '&6'
# You also see that the double quotation marks are around the hex colour code

# Remember to save and reload the server or restart the server after making changes to the config to make the changes take effect
# Also, always make a backup of your config before making changes in case something goes wrong

# If you need help with the plugin, don't hesitate to join the support discord server and ask for help
# We have a friendly community who are always willing to help each other out
# Just remember to be polite and respectful when asking for help


# Special Data Types:
# These examples explain how to specify conditions for effects. The syntax is 'ALL Y > -1000 -1 CONDITION_PARAMETER CONDITION_TYPE ALL ALL'
#   1. 'VAMPIRE VAMPIRE' - Effect is applied if all blocks above the player to the sky limit isn't a solid block.
#   2. 'CUSTOM[num] [INSERT BLOCKS HERE]' - Effect is applied if certain blocks are within radius '[num]' of the player. Replace '[num]' with the radius. Be cautious about high numbers as it may impact server performance.
#   3. 'LIGHTA[num] LIGHT' - Effect is applied if the light level is greater than '[num]'. Light levels range from 0 to 14.
#   4. 'LIGHTB[num] LIGHT' - Effect is applied if the light level is lower than '[num]'. Light levels range from 0 to 14.
#   5. 'TEMPA[num] TEMP' - Effect is applied if the temperature level is higher than '[num]'.
#   6. 'TEMPB[num] TEMP' - Effect is applied if the temperature level is lower than '[num]'.

# Default Race:
# To assign a default race for new players, use the 'defaultRace' parameter. Use '{randomRace}' for a random race and ensure it is within single quotes.

# WorldGuard Support:
# This plugin supports two new flags in WorldGuard: 'mrbase-potionandattributes' and 'allow-mrabilities'.
# 'mrbase-potionandattributes' - Disables the potion and attribute effects from the plugin.
# 'allow-mrabilities' - Disables the abilities from MRPremiumAddons.

# HEX Colour Codes:
# HEX color codes should be used with a '#' before the color code and '/' after the hex code. For example, '#FF0000/'.
# There should not be any spaces between the '#' and the hex code, and between the hex code and the '/'.
# HEX color codes should not be surrounded by single quotes. The entire message should be surrounded by single quotes instead.
# The '&' symbol can be used for normal colour codes.

# Wiki site: www.korbsti.com
# There are two pages for you to check out, Mythical Races and MRPremiumAddons

# And finally, remember to have fun with the plugin! It's a great way to add some extra depth and complexity to your Minecraft server
# We hope you enjoy using it as much as we enjoyed creating it!
# Thank you for choosing Mythical Races for your server!

other:

   # Store data by UUID, if false store data by player names
   dataByUUID: true


   # Cool down timer, is in MINUTES, NEVER PUT THIS NUMBER INTO NEGATIVES
   cooldown: 1440
   
   # default race upon joining
   # If you want a random default race replace this with '{randomRace}'
   # Do not forget the single quotation marks aka these things -> '
   # or else the random thing wont work
   defaultRace: 'Human'
   
   # Force the player to choose a race inside the GUI when the first join the server
   forceRace: false

   # Define what world the forceRace will apply
   # If you want it to apply to all worlds, then just put 'ALL'
   # If you want it to apply to a specific world, then put the world name
   forceRaceWorld: 'ALL'
   
   # When night cycle starts in ticks
   nightStart: 12610
   
   # When night cycle ends
   nightEnd: 23041
   
   # If you are looking for "day" its just the numbers thats not inbetween night and nightTwo
   
   # Every X amount of ticks, loop through the server and see if the player has any potion effects that they should have
   # if they do not have it then add potion effects of race to the player
   timerCheckingPotionEffects: 100
   
   # Gui display name
   guiName: 'Choosing Race'
   
   # Gui head player display name
   guiPlayerDisplay: 'You'
   
   # Gui slot number for player head
   guiPlayerDisplayNumber: 4
   
   # Amount of slots the GUI has, max is 54
   guiSlots: 54

   # Amount of slots a tree GUI has (for tree races - when typing in /races tree)
   treeGuiSlots: 54

   # Disable the display names in the GUI for both /races gui and /races tree
   # This will not put the display name of the race on the item in the GUIs
   disableGuiDisplayNames: false

   # Item for forwardClick
   forwardClickItem: 'PAPER'
   
   # When this slot is clicked, open up next GUI list
   forwardClick: 53
   
   # Next page 
   forwardClickDisplay: 'Next page'
   
   # Paper item
   backwardClickItem: 'PAPER'

   # Previous page
   backwardClick: 45
   
   backwardClickDisplay: 'Previous page'

   # Disable the forward and backward items/click inside the race GUI
   enableForwardAndBackwardClick: true

  # Lore hovering over the player head, yes this supports PAPI
   guiPlayerLore:
      - '&7&l» &e&lRace: &f%mythicalraces_display_race_name% &7&l«'
      - '&7&l» &e&lLevel: &f%mythicalraces_get_xp/max_xp_class% &7&l«'

   treeNonSlots: 'BLACK_STAINED_GLASS_PANE'
   
   treeName: 'Your race tree'
   
   # Show X amount of leaderboard players 
   leaderboardNum: 20
   
   # Check if there is an update for the plugin
   checkUpdates: true

   # Worlds where MRPremiumAddons Abilities and Races/Classes Mythical Races do not apply their abilities in that world
   blacklisted-worlds:
     - 'null'

   # Generalize custom biome names to vanilla biome names
   # This affects /races biome, and the "data" for all races/abilities
   enableGeneralization: true

   # Reset attributes when player leaves and when server reloads
   # This is to prevent long-term effects if the plugin is ever uninstalled
   rAttributesLeaveReset: true

   # Reset attributes when switching races
   # This is so attributes don't carry over into another race
   rAttributesRacesReset: true

   # Reset attributes when switching classes
   # This is so attributes don't carry over into another class
   rAttributesClassesReset: true

   # Blacklisted worlds reset attributes
   # When a player is switching over to a blacklisted world, reset the attributes
   rAttributesBlacklistedWorldsReset: true

   # Reset attributes when crossing regions (for worldguard flag)
   rAttributesWhenCrossingRegionsReset: true

