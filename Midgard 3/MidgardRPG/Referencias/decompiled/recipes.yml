# ==============================================================================
# MRPremiumAddons Custom Recipe Configuration Guide
# ==============================================================================

# This entire section is a guide to help you understand and customize
# your own recipes. Read through each part and then scroll down to the
# “customRecipes:” section to actually enable and define your recipes.

# 1) Enabling custom recipes
#    --------------------------------------------------
#    customRecipes:
#      enabled: true|false
#        • true  = plugin will load and register these recipes
#        • false = plugin will ignore everything under “recipes:”
#
# 2) Recipe definitions
#    --------------------------------------------------
#    recipes:
#      <recipeKey>:
#        type: shapeless|shaped
#          • shapeless = ingredients can be in any order
#          • shaped   = ingredients must match a pattern (not covered in this guide)
#
#        result:
#          material: <MATERIAL_NAME>
#            – any vanilla Minecraft material (e.g. DIAMOND_SWORD, PAPER)
#          amount: <number>
#            – how many items you get when crafting
#          customModelData: <ID>
#            – your resource pack’s custom model override
#          name: "<colour code + display name>"
#            – e.g. "&cExplosive Snowball"
#          lore:
#            – list of description lines shown in the tooltip
#            – start each line with “-” and wrap in quotes if using colour codes
#
#        ingredients:
#          – list of materials required
#          – for shapeless, order doesn’t matter
#          – must be valid vanilla material names
#
#        abilities:
#          – You should read the MRPremiumAddons documentation for details on abilities.
# 3) Colour codes
#    --------------------------------------------------
#    &0 = black        &8 = dark gray
#    &1 = dark blue    &9 = blue
#    &2 = dark green   &a = green
#    &3 = dark aqua    &b = aqua
#    &4 = dark red     &c = red
#    &5 = dark purple  &d = light purple
#    &6 = gold         &e = yellow
#    &7 = gray         &f = white
#
# 4) Finding valid material names
#    --------------------------------------------------
#    • Use SpigotMC’s Material enum documentation:
#
# 5) Example abilities breakdown
#    --------------------------------------------------
#    "PROJECTILEEVENT====SNOWBALL====summon minecraft:tnt {x} {y} {z} {Fuse:0}====100====1000"
#    – on snowball impact, summon instant TNT at that location
#
#    "CUSTOMABILITY====GLISTERING_MELON_SLICE====effect give {name} minecraft:instant_health 1 1 false====100====1000====SELF====ALL====RIGHTCLICKAIRCONSUME"
#    – when right-clicking melon, give instant health I to the user
#
# ------------------------------------------------------------------------------
# After reading the above, scroll down to “customRecipes:” and tweak as you like.
# ==============================================================================

customRecipes:
  enabled: false

  recipes:

    explosiveSnowball:
      type: shapeless
      result:
        material: SNOWBALL
        amount: 1
        customModelData: 101
        name: "&cExplosive Snowball"
        lore:
          - "&7Throws an explosive snowball at an entity."
          - "&7Upon impact with an entity, it explodes with a bang!"
      ingredients:
        - SNOWBALL
        - GUNPOWDER
      abilities:
        - "PROJECTILEEVENT====SNOWBALL====summon minecraft:tnt {x} {y} {z} {Fuse:0}====100====1000"

    slimeLauncher:
