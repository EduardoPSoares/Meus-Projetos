# MythicalRaces Kits Configuration
# --------------------------------
# This configuration file defines the kits available in the MythicalRaces plugin.
# Kits are predefined sets of commands that can be minecraft:given to players based on various criteria.
#
# Permissions:
# - Each kit requires a specific permission to be used by a player.
#   Format: mythicalraces.kit.<KitName>
#   Example: mythicalraces.kit.Basic
#
# Configuration Options:
# - enabled: (true/false) Determines if the kit is active.
# - minimumRequiredType: The type of level requirement for using the kit.
#   Options: 'RACE', 'CLASS', 'RACE/CLASS', 'NONE'
# - minimumLevelRequired: The minimum level required to use the kit.
# - maximumRequiredType: The type of level limit for using the kit.
#   Options: 'RACE', 'CLASS', 'RACE/CLASS', 'NONE'
# - maximumLevelRequired: The maximum level allowed to use the kit.
# - cooldown: The cooldown time (in seconds) before the kit can be used again.
# - commands: A list of console commands executed when the kit is used.
#   Placeholders:
#     {name} - Player's name
#     {world} - Player's current world
#     {x}, {y}, {z} - Player's coordinates
#   PAPI placeholders can also be used.

other:

  # Gui display name
  guiName: 'Select A Kit'

  # Amount of slots the GUI has, max is 54
  guiSlots: 36

  # Disable the display names in the GUI for the classes, in both the gui and tree
  # This will disable the display names for the classes in the GUI
  disableGuiDisplayNames: false

  # Item for forwardClick
  forwardClickItem: 'PAPER'

  # When this slot is clicked, open up next GUI list
  forwardClick: 35

  # Next page
  forwardClickDisplay: 'Next page'

  # Paper item
  backwardClickItem: 'PAPER'

  # Previous page
  backwardClick: 28

  backwardClickDisplay: 'Previous page'

  treeNonSlots: 'BLACK_STAINED_GLASS_PANE'


