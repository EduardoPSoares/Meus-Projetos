# ══════════════════════════════════════════════════════════════════
#  MIDGARD GUARDIÃO (GUARDIAN/TANK) SKILLS — MythicMobs Skill Definitions
#  Classe defensiva focada em proteção, escudos e suporte de equipe.
#  Todas as skills usam variáveis injetadas pelo SpellManager.
#  Variáveis disponíveis:  <skill.var.NOME>
#  Minecraft 1.21.1 / Folia / MythicMobs
#  Color Theme: Gold (#ffcc00), White (#ffffff), Blue (#4488ff), Silver (#c0c0c0)
# ══════════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────
#  1. ESCUDO DIVINO (PASSIVA) — Aumento passivo de chance de bloqueio
#     Variables: block_chance
#     Milestones: lvl3=divine_glow, lvl5=divine_aura
# ─────────────────────────────────────────────

EscudoDivino:
  Skills:
  - skill{s=EscudoDivino_Cast} @self

EscudoDivino_Cast:
  Skills:
  - potion{type=RESISTANCE;duration=999999;level=0;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=20;hS=0.4;vS=0.8;y=1.0;size=1.2;speed=0} @self
  - particles{p=end_rod;amount=10;hS=0.3;vS=0.6;y=1.0;speed=0.02} @self
  - sound{s=block.amethyst_block.chime;v=0.6;p=1.2} @self

EscudoDivino_Particles:
  Skills:
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=8;hS=0.3;vS=0.5;y=1.0;size=1.0;speed=0} @self
  - particles{p=end_rod;amount=4;hS=0.2;vS=0.4;y=1.0;speed=0.01} @self

# === ESCUDO DIVINO MK2 (Milestone lvl 3 — divine_glow) ===
EscudoDivinoMk2:
  Skills:
  - skill{s=EscudoDivinoMk2_Cast} @self

EscudoDivinoMk2_Cast:
  Skills:
  - potion{type=RESISTANCE;duration=999999;level=0;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=30;hS=0.5;vS=1.0;y=1.0;size=1.5;speed=0} @self
  - particles{p=end_rod;amount=15;hS=0.4;vS=0.8;y=1.0;speed=0.03} @self
  - particles{p=enchant;amount=12;hS=0.4;vS=0.6;y=0.5;speed=0.08} @self
  # Divine glow orbital
  - orbital{auraName=divine_glow;bulletType=ITEM;bulletItem=GOLD_NUGGET;radius=1.2;points=3;interval=1;duration=999999;oy=1.0} @self
  - particlering{p=dust_color_transition;color1=#ffcc00;color2=#4488ff;radius=1.0;points=20;amount=2;hS=0.1;vS=0.1;y=0.1;size=1.2;speed=0} @self
  - sound{s=block.amethyst_block.chime;v=0.7;p=1.4} @self

# === ESCUDO DIVINO MK3 (Milestone lvl 5 — divine_aura) ===
EscudoDivinoMk3:
  Skills:
  - skill{s=EscudoDivinoMk3_Cast} @self

EscudoDivinoMk3_Cast:
  Skills:
  - potion{type=RESISTANCE;duration=999999;level=1;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=45;hS=0.6;vS=1.2;y=1.0;size=1.8;speed=0} @self
  - particles{p=end_rod;amount=25;hS=0.5;vS=1.0;y=1.0;speed=0.04} @self
  - particles{p=enchant;amount=18;hS=0.5;vS=0.8;y=0.5;speed=0.1} @self
  # Divine aura — double orbital
  - orbital{auraName=divine_aura_inner;bulletType=ITEM;bulletItem=GOLD_NUGGET;radius=1.2;points=4;interval=1;duration=999999;oy=1.0} @self
  - orbital{auraName=divine_aura_outer;bulletType=ITEM;bulletItem=GLOWSTONE_DUST;radius=1.8;points=6;interval=1;duration=999999;oy=0.5} @self
  - particlering{p=dust_color_transition;color1=#ffcc00;color2=#4488ff;radius=1.5;points=28;amount=3;hS=0.1;vS=0.1;y=0.1;size=1.5;speed=0} @self
  - particlering{p=dust_color_transition;color1=#ffffff;color2=#ffcc00;radius=2.0;points=32;amount=2;hS=0.1;vS=0.1;y=0.3;size=1.0;speed=0} @self
  - sound{s=block.beacon.ambient;v=0.8;p=1.2} @self
  - sound{s=block.amethyst_block.chime;v=0.6;p=1.6} @self


# ─────────────────────────────────────────────
#  2. FORTALEZA INTERIOR (PASSIVA) — Fortaleza interior, defesa passiva
#     Variables: damage_reduction
#     Milestones: lvl3=fortress_glow, lvl5=fortress_aura
# ─────────────────────────────────────────────

FortalezaInterior:
  Skills:
  - skill{s=FortalezaInterior_Cast} @self

FortalezaInterior_Cast:
  Skills:
  - potion{type=RESISTANCE;duration=999999;level=<skill.var.damage_reduction>;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#c0c0c0;color2=#8c8c8c;amount=15;hS=0.5;vS=0.8;y=0.5;size=1.0;speed=0} @self
  - particles{p=block_crack;m=IRON_BLOCK;amount=8;hS=0.4;vS=0.5;y=0.3;speed=0.03} @self
  - sound{s=item.armor.equip_iron;v=0.6;p=1.0} @self

FortalezaInterior_Particles:
