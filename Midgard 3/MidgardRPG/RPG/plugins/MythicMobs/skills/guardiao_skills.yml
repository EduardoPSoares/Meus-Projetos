  - particles{p=block_crack;m=IRON_BLOCK;amount=3;hS=0.2;vS=0.3;y=0.3;speed=0.01} @self

# === FORTALEZA INTERIOR MK2 (Milestone lvl 3 — fortress_glow) ===
FortalezaInteriorMk2:
  Skills:
  - skill{s=FortalezaInteriorMk2_Cast} @self

FortalezaInteriorMk2_Cast:
  Skills:
  - potion{type=RESISTANCE;duration=999999;level=<skill.var.damage_reduction>;hasParticles=false} @self
  - potion{type=ABSORPTION;duration=999999;level=0;hasParticles=false} @self
  - particles{p=dust_color_transition;color1=#c0c0c0;color2=#ffcc00;amount=25;hS=0.6;vS=1.0;y=0.5;size=1.3;speed=0} @self
  - particles{p=block_crack;m=IRON_BLOCK;amount=12;hS=0.5;vS=0.6;y=0.3;speed=0.05} @self
