  - orbital{auraName=fortress_glow;bulletType=ITEM;bulletItem=IRON_NUGGET;radius=1.3;points=4;interval=1;duration=999999;oy=0.8} @self
  - particlering{p=dust_color_transition;color1=#c0c0c0;color2=#ffcc00;radius=1.2;points=22;amount=2;hS=0.1;vS=0.1;y=0.1;size=1.0;speed=0} @self
  - sound{s=item.armor.equip_iron;v=0.8;p=0.8} @self
  - sound{s=block.anvil.land;v=0.4;p=1.5} @self

# === FORTALEZA INTERIOR MK3 (Milestone lvl 5 — fortress_aura) ===
FortalezaInteriorMk3:
  Skills:
  - skill{s=FortalezaInteriorMk3_Cast} @self

FortalezaInteriorMk3_Cast:
  Skills:
  - potion{type=RESISTANCE;duration=999999;level=<skill.var.damage_reduction>;hasParticles=false} @self
  - potion{type=ABSORPTION;duration=999999;level=1;hasParticles=false} @self
  - potion{type=FIRE_RESISTANCE;duration=999999;level=0;hasParticles=false} @self
