# ─────────────────────────────────────────────
#  4. PROTEGER ALIADO (COMUM) — Protege aliado, redireciona dano
#     Variables: absorption, duration
#     Milestones: lvl3=protect_glow, lvl5=protect_barrier
# ─────────────────────────────────────────────

ProtegerAliado:
  Skills:
  - skill{s=ProtegerAliado_Cast} @self

ProtegerAliado_Cast:
  Skills:
  # Cast sound
  - sound{s=block.beacon.activate;v=1.0;p=1.5} @self
  - sound{s=item.armor.equip_gold;v=0.8;p=1.2} @self
  # Shield on target ally
  - midgardShield{a=<skill.var.absorption>;d=<skill.var.duration>} @target
  # Golden beam to ally
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=15;hS=0.2;vS=0.2;y=1.0;size=1.2;speed=0.1;repeat=5;repeati=2} @target
  - particles{p=end_rod;amount=6;hS=0.15;vS=0.15;y=1.0;speed=0.08;repeat=5;repeati=2} @target
  # Caster visual
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#4488ff;amount=20;hS=0.4;vS=0.8;y=1.0;size=1.3;speed=0} @self
  - particles{p=enchant;amount=10;hS=0.3;vS=0.5;y=0.5;speed=0.08} @self
  # Target visual — golden shield
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=25;hS=0.5;vS=1.0;y=0.8;size=1.5;speed=0} @target
  - particles{p=end_rod;amount=8;hS=0.4;vS=0.8;y=0.8;speed=0.03} @target
  - particlering{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;radius=0.8;points=16;amount=2;hS=0.1;vS=0.1;y=0.1;size=1.0;speed=0} @target

ProtegerAliado_Link:
  Skills:
  # Persistent link visual between caster and target
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#4488ff;amount=5;hS=0.1;vS=0.1;y=1.0;size=0.8;speed=0} @target
  - particles{p=end_rod;amount=2;hS=0.1;vS=0.1;y=1.0;speed=0.01} @target

# === PROTEGER ALIADO MK2 (Milestone lvl 3 — protect_glow) ===
