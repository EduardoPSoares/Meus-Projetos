  - particles{p=block_crack;m=IRON_BLOCK;amount=18;hS=0.6;vS=0.8;y=0.3;speed=0.06} @self
  - particles{p=block_crack;m=DIAMOND_BLOCK;amount=8;hS=0.4;vS=0.6;y=0.3;speed=0.04} @self
  - particles{p=end_rod;amount=12;hS=0.5;vS=0.8;y=0.5;speed=0.03} @self
  # Fortress aura — double orbital
  - orbital{auraName=fortress_aura_inner;bulletType=ITEM;bulletItem=IRON_NUGGET;radius=1.2;points=4;interval=1;duration=999999;oy=0.8} @self
  - orbital{auraName=fortress_aura_outer;bulletType=ITEM;bulletItem=DIAMOND;radius=1.8;points=6;interval=1;duration=999999;oy=0.5} @self
  - particlering{p=dust_color_transition;color1=#c0c0c0;color2=#ffcc00;radius=1.5;points=28;amount=3;hS=0.1;vS=0.1;y=0.1;size=1.3;speed=0} @self
  - particlering{p=dust_color_transition;color1=#4488ff;color2=#ffffff;radius=2.0;points=32;amount=2;hS=0.1;vS=0.1;y=0.3;size=1.0;speed=0} @self
  - sound{s=item.armor.equip_netherite;v=0.8;p=0.8} @self
  - sound{s=block.anvil.land;v=0.5;p=1.2} @self


# ─────────────────────────────────────────────
#  3. BLOQUEAR (COMUM) — Bloqueio ativo com escudo de absorção
#     Variables: damage_blocked
#     Milestones: lvl3=shield_glow, lvl5=shield_radiance
# ─────────────────────────────────────────────

Bloquear:
  Skills:
  - skill{s=Bloquear_Cast} @self

Bloquear_Cast:
  Skills:
  # Shield raise
  - sound{s=item.shield.block;v=1.2;p=0.8} @self
  - sound{s=item.armor.equip_iron;v=0.8;p=1.2} @self
  - midgardShield{a=<skill.var.damage_blocked>;d=60} @self
  # Shield raise visual
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=25;hS=0.6;vS=1.0;y=0.8;size=1.5;speed=0} @self
  - particles{p=block_crack;m=IRON_BLOCK;amount=12;hS=0.4;vS=0.5;y=0.5;speed=0.05} @self
  - particles{p=enchant;amount=10;hS=0.3;vS=0.5;y=0.5;speed=0.08} @self
  # Shield wall effect in front
  - particles{p=dust_color_transition;color1=#c0c0c0;color2=#ffcc00;amount=20;hS=0.8;vS=1.2;y=0.8;size=1.8;speed=0} @forward{f=1;lockpitch=true}
  - particles{p=end_rod;amount=6;hS=0.5;vS=0.8;y=0.8;speed=0.02} @forward{f=1;lockpitch=true}

Bloquear_Block:
  Skills:
  # On-block feedback particles
  - sound{s=item.shield.block;v=1.5;p=1.0} @self
  - particles{p=dust_color_transition;color1=#ffffff;color2=#ffcc00;amount=15;hS=0.5;vS=0.5;y=0.8;size=1.2;speed=0.05} @forward{f=0.8;lockpitch=true}
  - particles{p=block_crack;m=IRON_BLOCK;amount=8;hS=0.3;vS=0.3;y=0.5;speed=0.08} @forward{f=0.8;lockpitch=true}
  - particles{p=electric_spark;amount=6;hS=0.3;vS=0.3;y=0.8;speed=0.05} @forward{f=0.8;lockpitch=true}

# === BLOQUEAR MK2 (Milestone lvl 3 — shield_glow) ===
BloquearMk2:
  Skills:
  - skill{s=BloquearMk2_Cast} @self

BloquearMk2_Cast:
  Skills:
  - sound{s=item.shield.block;v=1.4;p=0.7} @self
  - sound{s=item.armor.equip_iron;v=1.0;p=1.0} @self
  - sound{s=block.amethyst_block.chime;v=0.6;p=1.5} @self
  - midgardShield{a=<skill.var.damage_blocked>;d=80} @self
  - potion{type=RESISTANCE;duration=80;level=0;hasParticles=false} @self
  # Enhanced shield visual
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=35;hS=0.7;vS=1.2;y=0.8;size=1.8;speed=0} @self
  - particles{p=block_crack;m=IRON_BLOCK;amount=18;hS=0.5;vS=0.6;y=0.5;speed=0.06} @self
  - particles{p=enchant;amount=15;hS=0.4;vS=0.6;y=0.5;speed=0.1} @self
  - particles{p=end_rod;amount=10;hS=0.6;vS=1.0;y=0.8;speed=0.03} @self
  # Glowing shield wall
  - particles{p=dust_color_transition;color1=#c0c0c0;color2=#ffcc00;amount=30;hS=1.0;vS=1.5;y=0.8;size=2.0;speed=0} @forward{f=1;lockpitch=true}
  - particles{p=dust_color_transition;color1=#4488ff;color2=#ffffff;amount=12;hS=0.6;vS=1.0;y=0.8;size=1.2;speed=0} @forward{f=1;lockpitch=true}
  - particlering{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;radius=0.8;points=16;amount=2;hS=0.1;vS=0.1;y=0.8;size=1.0;speed=0} @forward{f=1;lockpitch=true}

BloquearMk2_Block:
  Skills:
  - sound{s=item.shield.block;v=1.8;p=0.9} @self
  - sound{s=block.amethyst_block.chime;v=0.5;p=1.8} @self
  - particles{p=dust_color_transition;color1=#ffffff;color2=#ffcc00;amount=25;hS=0.6;vS=0.6;y=0.8;size=1.5;speed=0.06} @forward{f=0.8;lockpitch=true}
  - particles{p=block_crack;m=IRON_BLOCK;amount=12;hS=0.4;vS=0.4;y=0.5;speed=0.1} @forward{f=0.8;lockpitch=true}
  - particles{p=electric_spark;amount=10;hS=0.4;vS=0.4;y=0.8;speed=0.08} @forward{f=0.8;lockpitch=true}
  - particles{p=end_rod;amount=5;hS=0.3;vS=0.5;y=0.8;speed=0.03} @forward{f=0.8;lockpitch=true}

# === BLOQUEAR MK3 (Milestone lvl 5 — shield_radiance) ===
BloquearMk3:
