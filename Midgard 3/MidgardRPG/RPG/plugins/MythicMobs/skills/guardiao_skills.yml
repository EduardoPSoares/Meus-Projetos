  - midgardShield{a=<skill.var.damage_blocked>;d=100} @self
  - potion{type=RESISTANCE;duration=100;level=1;hasParticles=false} @self
  # Radiant shield burst
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=50;hS=0.8;vS=1.5;y=0.8;size=2.2;speed=0} @self
  - particles{p=block_crack;m=DIAMOND_BLOCK;amount=15;hS=0.5;vS=0.7;y=0.5;speed=0.06} @self
  - particles{p=block_crack;m=IRON_BLOCK;amount=20;hS=0.6;vS=0.8;y=0.5;speed=0.08} @self
  - particles{p=end_rod;amount=20;hS=0.7;vS=1.2;y=0.8;speed=0.05} @self
  - particles{p=enchant;amount=20;hS=0.5;vS=0.8;y=0.5;speed=0.12} @self
  # Radiant shield dome
  - particles{p=dust_color_transition;color1=#c0c0c0;color2=#ffcc00;amount=40;hS=1.2;vS=1.8;y=0.8;size=2.5;speed=0} @forward{f=1;lockpitch=true}
  - particles{p=dust_color_transition;color1=#4488ff;color2=#ffffff;amount=20;hS=0.8;vS=1.2;y=0.8;size=1.5;speed=0} @forward{f=1;lockpitch=true}
  - particlering{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;radius=1.0;points=20;amount=3;hS=0.1;vS=0.1;y=0.3;size=1.2;speed=0} @self
  - particlering{p=dust_color_transition;color1=#ffffff;color2=#4488ff;radius=1.5;points=24;amount=2;hS=0.1;vS=0.1;y=0.8;size=1.0;speed=0} @self
  # Shield radiance AoE knockback
  - throw{velocity=0.5;velocityY=0.2} @EntitiesNearOrigin{r=3}
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=15;hS=0.4;vS=0.3;y=0.8;size=1.0;speed=0} @EntitiesNearOrigin{r=3}

