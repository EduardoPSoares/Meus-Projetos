  - particles{p=end_rod;amount=10;hS=0.2;vS=0.2;y=1.0;speed=0.1;repeat=5;repeati=2} @target
  # Caster glow
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#4488ff;amount=30;hS=0.5;vS=1.0;y=1.0;size=1.5;speed=0} @self
  - particles{p=enchant;amount=15;hS=0.4;vS=0.6;y=0.5;speed=0.1} @self
  - particles{p=end_rod;amount=8;hS=0.4;vS=0.8;y=1.0;speed=0.03} @self
  # Target — glowing golden shield
  - particles{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;amount=35;hS=0.6;vS=1.2;y=0.8;size=1.8;speed=0} @target
  - particles{p=end_rod;amount=12;hS=0.5;vS=1.0;y=0.8;speed=0.04} @target
  - particlering{p=dust_color_transition;color1=#ffcc00;color2=#ffffff;radius=1.0;points=20;amount=3;hS=0.1;vS=0.1;y=0.1;size=1.2;speed=0} @target
  - particlering{p=dust_color_transition;color1=#4488ff;color2=#ffffff;radius=1.0;points=16;amount=2;hS=0.1;vS=0.1;y=1.5;size=0.8;speed=0} @target

