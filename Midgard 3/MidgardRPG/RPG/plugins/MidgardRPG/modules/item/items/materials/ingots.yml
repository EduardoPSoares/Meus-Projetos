lingote_ferro:
  base:
    material: IRON_INGOT
    name: "<white>ʟɪɴɢᴏᴛᴇ ᴅᴇ ꜰᴇʀʀᴏ</white>"
    tier: COMMON
    type: MATERIAL
    description:
    - "<gray>ʟɪɴɢᴏᴛᴇ ᴅᴇ ꜰᴇʀʀᴏ ᴄᴏᴍᴜᴍ. ᴜsᴀᴅᴏ ᴇᴍ ꜰᴀʙʀɪᴄᴀᴄᴏᴇs ʙᴀsɪᴄᴀs.</gray>"
    - "<gray>ᴜsᴀᴅᴏ ɴᴀ ꜰᴀʙʀɪᴄᴀᴄᴀᴏ ᴅᴇ ᴀʀᴍᴀs ᴇ ᴀʀᴍᴀᴅᴜʀᴀs.</gray>"
    revision-id: 1

