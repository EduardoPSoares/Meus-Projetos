# ============================================================================
# MAGO (MAGE) CLASS SKILLS - MidgardRPG
# ============================================================================
# Color Theme:
#   Blue (#0088ff) | Purple (#8800ff) | Cyan (#00ccff)
#   Arcane Violet (#6600cc) | Fire Orange (#ff6600)
#   Ice Blue (#00ccff) | Lightning Yellow (#ffff00)
#
# All dynamic values use <skill.var.VARIABLE_NAME> syntax
# Custom mechanics: midgardDamage, midgardShield
# Minecraft 1.21.1 + Folia compatible
# ============================================================================


# ============================================================================
#  1. SABEDORIA ARCANA (PASSIVE) — Arcane Wisdom, Intelligence Bonus
#     Variables: intelligence_bonus (base: 3.0 / scaling: 1.0)
#     Milestones: lvl3=arcane_wisdom_aura, lvl5=arcane_wisdom_glow
# ============================================================================

SabedoriaArcana:
  Skills:
  - skill{s=SabedoriaArcana_Cast} @self

SabedoriaArcana_Cast:
  Skills:
  - sound{s=entity.experience_orb.pickup;v=0.8;p=1.4} @self
  - particles{p=enchant;amount=20;hS=0.5;vS=1.0;y=0.5;speed=0.3} @self
  - particles{p=reddust;color=#8800ff;size=1.2;amount=15;hS=0.4;vS=0.8;y=0.5;speed=0.05} @self
  - particles{p=end_rod;amount=8;hS=0.3;vS=0.6;y=0.5;speed=0.02} @self

