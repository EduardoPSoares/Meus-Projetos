PunhaladaMk3_Impact:
  Skills:
  - sound{s=entity.player.attack.strong;v=1.6;p=1.1} @self
  - sound{s=entity.phantom.ambient;v=0.3;p=1.2} @self
  - midgardDamage{a=<skill.var.damage>;type=PHYSICAL} @EntitiesInCone{angle=45;range=4;rotation=0;length=4}
  # Triple slash — deep penetration
  - particles{p=sweep_attack;amount=8;hS=0.5;vS=0.4;y=1.0;speed=0} @forward{f=2;lockpitch=true}
  - particles{p=sweep_attack;amount=5;hS=0.4;vS=0.3;y=0.7;speed=0} @forward{f=2.5;lockpitch=true}
  - particles{p=sweep_attack;amount=4;hS=0.3;vS=0.2;y=1.3;speed=0} @forward{f=3;lockpitch=true}
  - particles{p=crit;amount=16;hS=0.5;vS=0.5;y=1.0;speed=0.1} @forward{f=2;lockpitch=true}
  - particles{p=dust_color_transition;color1=#cc0000;color2=#6600cc;amount=22;hS=0.8;vS=0.5;y=0.8;size=1.8;speed=0} @forward{f=2;lockpitch=true}
  - particles{p=enchanted_hit;amount=10;hS=0.4;vS=0.4;y=1.0;speed=0.08} @forward{f=2;lockpitch=true}
  - particles{p=reverse_portal;amount=6;hS=0.3;vS=0.3;y=1.0;speed=0.03} @forward{f=2;lockpitch=true}
  - particles{p=large_smoke;amount=8;hS=0.5;vS=0.4;y=0.3;speed=0.06} @forward{f=2;lockpitch=true}


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  4. EVASÃO — Evasion (COMMON)                                             ║
# ║  A swift dodge backward, vanishing momentarily in a puff of shadow.        ║
# ║  Variables: duration (2.0 base / 0.3 per level)                           ║
# ║  Milestones: lvl3=evasao_dash, lvl5=evasao_phantom                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# --- Base ---
Evasao:
  Skills:
  - skill{s=Evasao_Cast} @self

Evasao_Cast:
  Skills:
  - sound{s=entity.enderman.teleport;v=0.8;p=1.5} @self
  - sound{s=entity.illusioner.mirror_move;v=0.6;p=1.2} @self
  # Smoke burst at origin
  - particles{p=large_smoke;amount=20;hS=0.6;vS=0.8;y=0.5;speed=0.08} @self
  - particles{p=dust_color_transition;color1=#0d0d0d;color2=#330066;amount=12;hS=0.5;vS=0.6;y=0.5;size=1.5;speed=0} @self
  # Lunge backward
  - lunge{velocity=-2.0;velocityY=0.2} @self
  # Brief invisibility
  - potion{type=INVISIBILITY;duration=<skill.var.duration>;level=0;hasParticles=false} @self
  # Shadow trail
  - particles{p=smoke;amount=6;hS=0.3;vS=0.2;y=0.5;speed=0.05;repeat=4;repeati=2} @self
  - particles{p=large_smoke;amount=4;hS=0.2;vS=0.3;y=0.3;speed=0.03;repeat=4;repeati=2} @self

# --- Mk2 (Milestone: evasao_dash) ---
EvasaoMk2:
  Skills:
  - skill{s=EvasaoMk2_Cast} @self

EvasaoMk2_Cast:
  Skills:
  - sound{s=entity.enderman.teleport;v=0.9;p=1.4} @self
  - sound{s=entity.illusioner.mirror_move;v=0.7;p=1.1} @self
  # Enhanced smoke burst
  - particles{p=large_smoke;amount=28;hS=0.7;vS=1.0;y=0.5;speed=0.1} @self
  - particles{p=dust_color_transition;color1=#0d0d0d;color2=#6600cc;amount=18;hS=0.6;vS=0.8;y=0.5;size=1.8;speed=0} @self
  - particles{p=soul;amount=6;hS=0.4;vS=0.5;y=0.8;speed=0.03} @self
  # Faster backward dash
  - lunge{velocity=-2.8;velocityY=0.2} @self
  # Longer invisibility + speed boost
  - potion{type=INVISIBILITY;duration=<skill.var.duration>;level=0;hasParticles=false} @self
  - potion{type=SPEED;duration=<skill.var.duration>;level=1;hasParticles=false} @self
  # Enhanced shadow trail
  - particles{p=smoke;amount=10;hS=0.4;vS=0.3;y=0.5;speed=0.06;repeat=6;repeati=2} @self
  - particles{p=dust_color_transition;color1=#1a0033;color2=#330066;amount=6;hS=0.3;vS=0.4;y=0.5;size=1.2;speed=0;repeat=6;repeati=2} @self
  - particles{p=large_smoke;amount=6;hS=0.3;vS=0.4;y=0.3;speed=0.04;repeat=6;repeati=2} @self

# --- Mk3 (Milestone: evasao_phantom) ---
EvasaoMk3:
  Skills:
  - skill{s=EvasaoMk3_Cast} @self

EvasaoMk3_Cast:
  Skills:
  - sound{s=entity.enderman.teleport;v=1.0;p=1.3} @self
  - sound{s=entity.illusioner.mirror_move;v=0.8;p=1.0} @self
  - sound{s=entity.phantom.ambient;v=0.4;p=1.0} @self
  # Phantom smoke explosion
  - particles{p=large_smoke;amount=36;hS=0.8;vS=1.2;y=0.5;speed=0.12} @self
  - particles{p=dust_color_transition;color1=#0d0d0d;color2=#6600cc;amount=24;hS=0.8;vS=1.0;y=0.5;size=2.0;speed=0} @self
  - particles{p=soul;amount=10;hS=0.5;vS=0.6;y=0.8;speed=0.04} @self
  - particles{p=reverse_portal;amount=8;hS=0.4;vS=0.8;y=1.0;speed=0.03} @self
  # Phantom dash backward
  - lunge{velocity=-3.5;velocityY=0.25} @self
  # Extended invisibility + speed + midgardShield
