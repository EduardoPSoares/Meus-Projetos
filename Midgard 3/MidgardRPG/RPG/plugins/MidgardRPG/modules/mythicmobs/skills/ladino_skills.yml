# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  1. SOMBRAS FURTIVAS — Stealth Shadows (PASSIVE)                          ║
# ║  The rogue cloaks in living shadows, gaining a passive stealth bonus.      ║
# ║  Variables: stealth_damage (5.0 base / 2.5 per level)                     ║
# ║  Milestones: lvl3=sombras_furtivas_mist, lvl5=sombras_furtivas_shadow     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# --- Base ---
SombrasFurtivas:
  Skills:
  - skill{s=SombrasFurtivas_Cast} @self

SombrasFurtivas_Cast:
  Skills:
  - sound{s=entity.phantom.ambient;v=0.4;p=0.5} @self
  - particles{p=large_smoke;amount=8;hS=0.4;vS=0.2;y=0.2;speed=0.02} @self
  - particles{p=dust_color_transition;color1=#1a0033;color2=#330066;amount=10;hS=0.5;vS=0.4;y=0.5;size=1.0;speed=0} @self
  - particles{p=smoke;amount=6;hS=0.3;vS=0.1;y=0.1;speed=0.01} @self
  - midgardDamage{type=SHADOW;bonus=<skill.var.stealth_damage>} @self

# --- Mk2 (Milestone: sombras_furtivas_mist) ---
SombrasFurtivasMk2:
  Skills:
  - skill{s=SombrasFurtivasMk2_Cast} @self

SombrasFurtivasMk2_Cast:
  Skills:
  - sound{s=entity.phantom.ambient;v=0.5;p=0.4} @self
  - particles{p=large_smoke;amount=14;hS=0.5;vS=0.3;y=0.2;speed=0.03} @self
  - particles{p=dust_color_transition;color1=#1a0033;color2=#6600cc;amount=16;hS=0.6;vS=0.5;y=0.5;size=1.3;speed=0} @self
  - particles{p=smoke;amount=10;hS=0.4;vS=0.2;y=0.1;speed=0.02} @self
  - particles{p=soul;amount=4;hS=0.3;vS=0.3;y=0.3;speed=0.01} @self
  # Shadow mist orbital around feet
  - orbital{auraName=sombras_mist;bulletType=ITEM;bulletItem=BLACK_DYE;radius=0.8;points=3;interval=1;duration=999999;oy=0.3} @self
  - midgardDamage{type=SHADOW;bonus=<skill.var.stealth_damage>} @self

# --- Mk3 (Milestone: sombras_furtivas_shadow) ---
SombrasFurtivasMk3:
  Skills:
  - skill{s=SombrasFurtivasMk3_Cast} @self

SombrasFurtivasMk3_Cast:
  Skills:
  - sound{s=entity.phantom.ambient;v=0.6;p=0.3} @self
  - sound{s=entity.enderman.teleport;v=0.3;p=1.8} @self
  - particles{p=large_smoke;amount=20;hS=0.6;vS=0.4;y=0.2;speed=0.04} @self
  - particles{p=dust_color_transition;color1=#0d0d0d;color2=#6600cc;amount=22;hS=0.7;vS=0.6;y=0.5;size=1.6;speed=0} @self
  - particles{p=smoke;amount=14;hS=0.5;vS=0.3;y=0.1;speed=0.03} @self
  - particles{p=soul;amount=8;hS=0.4;vS=0.4;y=0.3;speed=0.02} @self
  - particles{p=reverse_portal;amount=6;hS=0.3;vS=0.5;y=0.8;speed=0.01} @self
  # Living shadow orbital
  - orbital{auraName=sombras_shadow_inner;bulletType=ITEM;bulletItem=BLACK_DYE;radius=0.8;points=3;interval=1;duration=999999;oy=0.3} @self
  - orbital{auraName=sombras_shadow_outer;bulletType=ITEM;bulletItem=PURPLE_DYE;radius=1.3;points=4;interval=1;duration=999999;oy=0.5} @self
  - midgardDamage{type=SHADOW;bonus=<skill.var.stealth_damage>} @self


