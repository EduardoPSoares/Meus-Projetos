# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  3. PUNHALADA — Dagger Stab (COMMON)                                      ║
# ║  A lightning-fast dagger stab that pierces the target's defenses.          ║
# ║  Variables: damage (14.0 base / 4.0 per level)                            ║
# ║  Milestones: lvl3=punhalada_slash, lvl5=punhalada_deep                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# --- Base ---
Punhalada:
  Skills:
  - skill{s=Punhalada_Cast} @self

Punhalada_Cast:
  Skills:
  - sound{s=entity.player.attack.sweep;v=1.0;p=1.5} @self
  - particles{p=sweep_attack;amount=3;hS=0.2;vS=0.1;y=1.0;speed=0} @forward{f=1.5;lockpitch=true}
  - particles{p=dust_color_transition;color1=#cc0000;color2=#0d0d0d;amount=8;hS=0.3;vS=0.2;y=1.0;size=1.0;speed=0} @forward{f=1.5;lockpitch=true}
  - delay 1
  - skill{s=Punhalada_Impact} @self

Punhalada_Impact:
  Skills:
  - sound{s=entity.player.attack.strong;v=1.2;p=1.3} @self
  - midgardDamage{a=<skill.var.damage>;type=PHYSICAL} @EntitiesInCone{angle=35;range=3;rotation=0;length=3}
  - particles{p=sweep_attack;amount=4;hS=0.3;vS=0.2;y=1.0;speed=0} @forward{f=2;lockpitch=true}
  - particles{p=crit;amount=6;hS=0.3;vS=0.3;y=1.0;speed=0.05} @forward{f=2;lockpitch=true}
  - particles{p=dust_color_transition;color1=#cc0000;color2=#330066;amount=10;hS=0.5;vS=0.3;y=0.8;size=1.2;speed=0} @forward{f=2;lockpitch=true}
  - particles{p=smoke;amount=5;hS=0.3;vS=0.2;y=0.5;speed=0.03} @forward{f=2;lockpitch=true}

# --- Mk2 (Milestone: punhalada_slash) ---
PunhaladaMk2:
  Skills:
  - skill{s=PunhaladaMk2_Cast} @self

PunhaladaMk2_Cast:
  Skills:
  - sound{s=entity.player.attack.sweep;v=1.2;p=1.4} @self
  - particles{p=sweep_attack;amount=5;hS=0.3;vS=0.2;y=1.0;speed=0} @forward{f=1.5;lockpitch=true}
  - particles{p=dust_color_transition;color1=#cc0000;color2=#0d0d0d;amount=12;hS=0.4;vS=0.3;y=1.0;size=1.3;speed=0} @forward{f=1.5;lockpitch=true}
  - delay 1
  - skill{s=PunhaladaMk2_Impact} @self

PunhaladaMk2_Impact:
  Skills:
  - sound{s=entity.player.attack.strong;v=1.4;p=1.2} @self
  - midgardDamage{a=<skill.var.damage>;type=PHYSICAL} @EntitiesInCone{angle=40;range=3.5;rotation=0;length=3.5}
  # Double slash visual
  - particles{p=sweep_attack;amount=6;hS=0.4;vS=0.3;y=1.0;speed=0} @forward{f=2;lockpitch=true}
  - particles{p=sweep_attack;amount=4;hS=0.3;vS=0.2;y=0.7;speed=0} @forward{f=2.5;lockpitch=true}
  - particles{p=crit;amount=10;hS=0.4;vS=0.4;y=1.0;speed=0.08} @forward{f=2;lockpitch=true}
  - particles{p=dust_color_transition;color1=#cc0000;color2=#6600cc;amount=15;hS=0.6;vS=0.4;y=0.8;size=1.5;speed=0} @forward{f=2;lockpitch=true}
  - particles{p=enchanted_hit;amount=6;hS=0.3;vS=0.3;y=1.0;speed=0.05} @forward{f=2;lockpitch=true}
  - particles{p=smoke;amount=8;hS=0.4;vS=0.3;y=0.5;speed=0.05} @forward{f=2;lockpitch=true}

# --- Mk3 (Milestone: punhalada_deep) ---
PunhaladaMk3:
  Skills:
  - skill{s=PunhaladaMk3_Cast} @self

PunhaladaMk3_Cast:
  Skills:
  - sound{s=entity.player.attack.sweep;v=1.4;p=1.3} @self
  - sound{s=entity.illusioner.mirror_move;v=0.5;p=1.5} @self
  - particles{p=sweep_attack;amount=6;hS=0.4;vS=0.3;y=1.0;speed=0} @forward{f=1.5;lockpitch=true}
  - particles{p=dust_color_transition;color1=#cc0000;color2=#330066;amount=16;hS=0.5;vS=0.4;y=1.0;size=1.5;speed=0} @forward{f=1.5;lockpitch=true}
  - particles{p=soul;amount=4;hS=0.2;vS=0.3;y=1.2;speed=0.02} @self
  - delay 1
