  - sound{s=entity.phantom.ambient;v=0.3;p=1.5} @self
  - particles{p=crit;amount=20;hS=0.5;vS=0.8;y=1.0;speed=0.1} @self
  - particles{p=dust_color_transition;color1=#cc0000;color2=#6600cc;amount=14;hS=0.6;vS=0.5;y=0.8;size=1.6;speed=0} @self
  - particles{p=sweep_attack;amount=6;hS=0.4;vS=0.3;y=1.0;speed=0} @self
  - particles{p=enchanted_hit;amount=10;hS=0.4;vS=0.5;y=1.0;speed=0.08} @self
