  - potion{type=SPEED;duration=<skill.var.duration>;level=2;hasParticles=false} @self
  - midgardShield{a=5;d=<skill.var.duration>} @self
  # Phantom shadow trail
  - particles{p=smoke;amount=14;hS=0.5;vS=0.4;y=0.5;speed=0.08;repeat=8;repeati=2} @self
  - particles{p=dust_color_transition;color1=#1a0033;color2=#6600cc;amount=10;hS=0.4;vS=0.5;y=0.5;size=1.5;speed=0;repeat=8;repeati=2} @self
  - particles{p=reverse_portal;amount=4;hS=0.3;vS=0.4;y=0.8;speed=0.02;repeat=8;repeati=2} @self
  - particles{p=large_smoke;amount=8;hS=0.4;vS=0.5;y=0.3;speed=0.05;repeat=8;repeati=2} @self


