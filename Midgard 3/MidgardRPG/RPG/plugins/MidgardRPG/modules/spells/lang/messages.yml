# ══════════════════════════════════════════════
#  MIDGARD SPELLS — MENSAGENS
# ══════════════════════════════════════════════

# ──────────────────────────────────────────────
#  MENU PRINCIPAL DE MAGIAS
# ──────────────────────────────────────────────
main_gui:
  title: "<white>ʜᴀʙɪʟɪᴅᴀᴅᴇs ᴍᴀɢɪᴄᴀs</white>"

  # ── Visão Geral ──
  overview:
    tag_passive:   "<aqua>◆ ᴘᴀssɪᴠᴀ</aqua>"
    tag_common:    "<green>◆ ʜᴀʙɪʟɪᴅᴀᴅᴇ</green>"
    tag_ultimate:  "<gold>★ ᴜʟᴛɪᴍᴀᴛᴇ</gold>"
    always_active: "<dark_aqua>✦ sᴇᴍᴘʀᴇ ᴀᴛɪᴠᴀ ᴀᴜᴛᴏᴍᴀᴛɪᴄᴀᴍᴇɴᴛᴇ</dark_aqua>"

    # Stats com preview de level up (Fase 1)
    stat_cooldown:       "<gray>⏱ ʀᴇᴄᴀʀɢᴀ: <white>%value%s</white></gray>"
    stat_cooldown_lvlup: "<gray>⏱ ʀᴇᴄᴀʀɢᴀ: <white>%value%s</white> <dark_gray>→</dark_gray> <green>%next%s</green></gray>"
    stat_mana:           "<blue>✦ ᴍᴀɴᴀ: <white>%value%</white></blue>"
    stat_mana_lvlup:     "<blue>✦ ᴍᴀɴᴀ: <white>%value%</white> <dark_gray>→</dark_gray> <green>%next%</green></blue>"
    stat_stamina:        "<yellow>✦ sᴛᴀᴍɪɴᴀ: <white>%value%</white></yellow>"
    stat_stamina_lvlup:  "<yellow>✦ sᴛᴀᴍɪɴᴀ: <white>%value%</white> <dark_gray>→</dark_gray> <green>%next%</green></yellow>"

    # Spells bloqueadas
    locked_passive:
      name: "<dark_gray>✖ ᴘᴀssɪᴠᴀ ʙʟᴏǫᴜᴇᴀᴅᴀ</dark_gray>"
      lore:
        - "<dark_gray>ᴅᴇsʙʟᴏǫᴜᴇɪᴇ ᴘʀᴏɢʀᴇᴅɪɴᴅᴏ</dark_gray>"
        - "<dark_gray>ᴄᴏᴍ sᴜᴀ ᴄʟᴀssᴇ.</dark_gray>"
    locked_common:
      name: "<dark_gray>✖ ʜᴀʙɪʟɪᴅᴀᴅᴇ ʙʟᴏǫᴜᴇᴀᴅᴀ</dark_gray>"
      lore:
        - "<dark_gray>ᴅᴇsʙʟᴏǫᴜᴇɪᴇ ᴘʀᴏɢʀᴇᴅɪɴᴅᴏ</dark_gray>"
        - "<dark_gray>ᴄᴏᴍ sᴜᴀ ᴄʟᴀssᴇ.</dark_gray>"
    locked_ultimate:
      name: "<dark_gray>✖ ᴜʟᴛɪᴍᴀᴛᴇ ʙʟᴏǫᴜᴇᴀᴅᴀ</dark_gray>"
      lore:
        - "<dark_gray>ᴅᴇsʙʟᴏǫᴜᴇɪᴇ ᴇᴍ ɴɪᴠᴇʟ ᴀʟᴛᴏ</dark_gray>"
        - "<dark_gray>ᴄᴏᴍ sᴜᴀ ᴄʟᴀssᴇ.</dark_gray>"

  # ── Slots de Equip ──
  slots:
    empty:
      name: "<gray>sʟᴏᴛ %slot% · ᴠᴀzɪᴏ</gray>"
      lore:
        - "<dark_gray>ɴᴇɴʜᴜᴍᴀ ʜᴀʙɪʟɪᴅᴀᴅᴇ ᴇǫᴜɪᴘᴀᴅᴀ.</dark_gray>"
        - ""
        - "<yellow>▸ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴇǫᴜɪᴘᴀʀ</yellow>"
    empty_combo:
      lore:
        - "<dark_gray>ɴᴇɴʜᴜᴍᴀ ʜᴀʙɪʟɪᴅᴀᴅᴇ ᴇǫᴜɪᴘᴀᴅᴀ.</dark_gray>"
        - "<gray>ᴄᴏᴍʙᴏ: <gold>%sequence%</gold></gray>"
        - ""
        - "<yellow>▸ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴇǫᴜɪᴘᴀʀ</yellow>"
    skillbar_filled:
      lore:
        - "<gray>sʟᴏᴛ <white>%slot%</white> · ʙᴀʀʀᴀ ᴅᴇ ᴀᴛᴀʟʜᴏs</gray>"
        - ""
        - "<yellow>▸ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴛʀᴏᴄᴀʀ</yellow>"
    combo_filled:
      lore:
        - "<gray>ᴄᴏᴍʙᴏ: <gold>%sequence%</gold></gray>"
        - ""
        - "<yellow>▸ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴛʀᴏᴄᴀʀ</yellow>"
    invalid:
      name: "<red>sʟᴏᴛ %slot% · ɪɴᴠᴀʟɪᴅᴏ</red>"
      lore:
        - "<dark_gray>ʜᴀʙɪʟɪᴅᴀᴅᴇ ɴᴀᴏ ᴇɴᴄᴏɴᴛʀᴀᴅᴀ.</dark_gray>"
        - ""
        - "<yellow>▸ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ʀᴇᴄᴏɴꜰɪɢᴜʀᴀʀ</yellow>"
    passive_empty:
      name: "<dark_gray>ᴘᴀssɪᴠᴀ · ᴠᴀzɪᴏ</dark_gray>"
      lore:
        - "<dark_gray>ɴᴇɴʜᴜᴍᴀ ᴘᴀssɪᴠᴀ ᴅɪsᴘᴏɴɪᴠᴇʟ.</dark_gray>"
    on_cooldown: "<red>⏱ ᴇᴍ ʀᴇᴄᴀʀɢᴀ: <white>%time%s</white></red>"
    selected: "<aqua>▸ sᴇʟᴇᴄɪᴏɴᴀᴅᴏ — ᴄʟɪǫᴜᴇ ᴇᴍ ᴏᴜᴛʀᴏ sʟᴏᴛ ᴘᴀʀᴀ ᴛʀᴏᴄᴀʀ</aqua>"

  # ── Tags de Tipo (usadas em múltiplas GUIs) ──
  type_tags:
    passive:  "<aqua>ᴘᴀssɪᴠᴀ</aqua>"
    common:   "<green>ᴄᴏᴍᴜᴍ</green>"
    ultimate: "<gold>ᴜʟᴛɪᴍᴀᴛᴇ</gold>"

  # ── Itens do Menu Principal ──
  items:
    ultimate:
      lore_tag:        "<gold>ᴜʟᴛɪᴍᴀᴛᴇ</gold>"
      click_to_swap:   "<yellow>ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴛʀᴏᴄᴀʀ</yellow>"
      empty_name:      "<gold>ᴜʟᴛɪᴍᴀᴛᴇ</gold>"
      empty_lore:      "<dark_gray>ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴇǫᴜɪᴘᴀʀ</dark_gray>"
    passive:
      lore_tag:        "<aqua>ᴘᴀssɪᴠᴀ</aqua>"
      always_active:   "<gray>sᴇᴍᴘʀᴇ ᴀᴛɪᴠᴀ</gray>"
    locked:
      name_ultimate:   "<dark_gray>ᴜʟᴛɪᴍᴀᴛᴇ</dark_gray>"
      name_passive:    "<dark_gray>ᴘᴀssɪᴠᴀ</dark_gray>"
      lore:            "<gray>ɴᴀᴏ ᴅᴇsʙʟᴏǫᴜᴇᴀᴅᴀ</gray>"
    common:
      skillbar_tag:    "<green>ᴄᴏᴍᴜᴍ</green> <dark_gray>•</dark_gray> <white>sʟᴏᴛ %slot%</white>"
      combo_tag:       "<green>ᴄᴏᴍᴜᴍ</green> <dark_gray>•</dark_gray> <white>%combo%</white>"
      click_to_swap:   "<yellow>ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴛʀᴏᴄᴀʀ</yellow>"
    empty_slot:
      name:            "<gray>sʟᴏᴛ %slot%</gray>"
      lore:            "<dark_gray>ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴇǫᴜɪᴘᴀʀ</dark_gray>"
    controls:
      style_skillbar:  "<white>sᴋɪʟʟʙᴀʀ</white>"
      style_combo:     "<white>ᴄᴏᴍʙᴏ</white>"
      style_click:     "<yellow>ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴛʀᴏᴄᴀʀ</yellow>"
      upgrade_name:    "<white>ᴜᴘɢʀᴀᴅᴇs</white>"
      upgrade_lore:    "<yellow>ᴠᴇʀ ᴛᴏᴅᴀs ᴀs sᴘᴇʟʟs</yellow>"

  # ── Formato de Stats (Compartilhado) ──
  stats_format:        "<gray>⏱ %cd%s <blue>✦ %mana%</blue>"
  stats_format_stamina: "  <gold>⚡ %stamina%</gold>"

  # ── Botões ──
  buttons:
    reset:
      name: "<red>✖ ʀᴇsᴇᴛᴀʀ sʟᴏᴛs</red>"
      lore:
        - "<gray>ʀᴇᴍᴏᴠᴇ ᴛᴏᴅᴀs ᴀs ʜᴀʙɪʟɪᴅᴀᴅᴇs</gray>"
        - "<gray>ᴅᴏs sʟᴏᴛs ᴅᴇ ᴀᴛᴀʟʜᴏ.</gray>"
        - ""
        - "<yellow>▸ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ʀᴇsᴇᴛᴀʀ</yellow>"
    reset_confirm:
      name: "<red><bold>✖ ᴄᴏɴꜰɪʀᴍᴀʀ ʀᴇsᴇᴛ?</bold></red>"
      lore:
        - "<red>ᴄʟɪǫᴜᴇ ɴᴏᴠᴀᴍᴇɴᴛᴇ ᴘᴀʀᴀ ᴄᴏɴꜰɪʀᴍᴀʀ!</red>"
        - ""
        - "<gray>ᴛᴏᴅᴏs ᴏs sʟᴏᴛs sᴇʀᴀᴏ ʟɪᴍᴘᴏs.</gray>"
    style_skillbar:
      name: "<yellow>⚔ ᴍᴏᴅᴏ: <white>ʙᴀʀʀᴀ ᴅᴇ ᴀᴛᴀʟʜᴏs</white></yellow>"
      lore:
        - "<gray>ᴜsᴇ ᴏs ᴀᴛᴀʟʜᴏs ɴᴜᴍᴇʀɪᴄᴏs</gray>"
        - "<gray>ᴘᴀʀᴀ ᴄᴏɴᴊᴜʀᴀʀ ʜᴀʙɪʟɪᴅᴀᴅᴇs.</gray>"
        - ""
        - "<yellow>▸ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴀʟᴛᴇʀɴᴀʀ</yellow>"
    style_combo:
      name: "<yellow>⚔ ᴍᴏᴅᴏ: <light_purple>ᴄᴏᴍʙᴏ</light_purple></yellow>"
      lore:
        - "<gray>ᴜsᴇ <yellow>ʟ</yellow> ᴇ <light_purple>ʀ</light_purple> ᴘᴀʀᴀ ᴄᴏᴍʙᴏs.</gray>"
        - ""
        - "<yellow>▸ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴀʟᴛᴇʀɴᴀʀ</yellow>"
    upgrade:
      name: "<green>✦ ᴘʀᴏɢʀᴇssᴀᴏ ᴅᴇ ᴍᴀɢɪᴀs</green>"
      lore:
        - "<gray>ᴠᴇᴊᴀ ᴏ ᴘʀᴏɢʀᴇssᴏ ᴅᴀs sᴜᴀs</gray>"
        - "<gray>ʜᴀʙɪʟɪᴅᴀᴅᴇs, ɴɪᴠᴇɪs ᴇ ᴍᴀʀᴄᴏs.</gray>"
        - ""
        - "<yellow>▸ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴀʙʀɪʀ</yellow>"

  # ── Cores de Nome por Tipo ──
  spell_color:
    passive:  "<aqua>"
    common:   "<white>"
    ultimate: "<gold>"

  # ── Menu de Ajuda (GUI interativa) ──
  help:
    title: "<white>ᴀᴊᴜᴅᴀ: ᴍᴀɢɪᴀs</white>"
    topics:
      overview:
        name: "<white>ᴠɪsᴀᴏ ɢᴇʀᴀʟ</white>"
        lore:
          - "<gray>ᴀᴘʀᴇɴᴅᴀ sᴏʙʀᴇ ᴏ sɪsᴛᴇᴍᴀ</gray>"
          - "<gray>ᴅᴇ ᴍᴀɢɪᴀs ᴇ ʜᴀʙɪʟɪᴅᴀᴅᴇs.</gray>"
      modes:
        name: "<white>ᴍᴏᴅᴏs ᴅᴇ ᴄᴏɴᴊᴜʀᴀᴄᴀᴏ</white>"
        lore:
          - "<gray>ᴇxɪsᴛᴇᴍ ᴅᴏɪs ᴍᴏᴅᴏs:</gray>"
          - "<gray>sᴋɪʟʟʙᴀʀ ᴇ ᴄᴏᴍʙᴏ.</gray>"
      skillbar:
        name: "<white>ʙᴀʀʀᴀ ᴅᴇ ᴀᴛᴀʟʜᴏs</white>"
        lore:
          - "<gray>ᴜsᴇ ᴀs ᴛᴇᴄʟᴀs ɴᴜᴍᴇʀɪᴄᴀs</gray>"
          - "<gray>ᴘᴀʀᴀ ᴄᴏɴᴊᴜʀᴀʀ ʜᴀʙɪʟɪᴅᴀᴅᴇs.</gray>"
      combo:
        name: "<white>sɪsᴛᴇᴍᴀ ᴅᴇ ᴄᴏᴍʙᴏs</white>"
        lore:
          - "<gray>ᴄᴏᴍʙɪɴᴇ ᴄʟɪǫᴜᴇs ᴇsǫᴜᴇʀᴅᴏ</gray>"
          - "<gray>ᴇ ᴅɪʀᴇɪᴛᴏ ᴘᴀʀᴀ ᴄᴏɴᴊᴜʀᴀʀ.</gray>"
      reset:
        name: "<white>ʀᴇsᴇᴛᴀʀ sʟᴏᴛs</white>"
        lore:
          - "<gray>ʀᴇᴍᴏᴠᴇ ᴛᴏᴅᴀs ᴀs ᴍᴀɢɪᴀs</gray>"
          - "<gray>ᴅᴏs sʟᴏᴛs ᴅᴇ ᴀᴛᴀʟʜᴏ.</gray>"
      tips:
        name: "<white>ᴅɪᴄᴀs</white>"
        lore:
          - "<gray>ᴄᴏɴsᴜʟᴛᴇ ᴅɪᴄᴀs ᴜᴛᴇɪs</gray>"
          - "<gray>ᴘᴀʀᴀ ᴍᴇʟʜᴏʀᴀʀ sᴇᴜ ᴊᴏɢᴏ.</gray>"

  # ── Mensagens de Chat ──
  messages:
    mode_changed_skillbar: "<green>✦</green> <gray>ᴍᴏᴅᴏ ᴀʟᴛᴇʀᴀᴅᴏ ᴘᴀʀᴀ <white>ʙᴀʀʀᴀ ᴅᴇ ᴀᴛᴀʟʜᴏs</white>.</gray>"
    mode_changed_combo:    "<green>✦</green> <gray>ᴍᴏᴅᴏ ᴀʟᴛᴇʀᴀᴅᴏ ᴘᴀʀᴀ <light_purple>ᴄᴏᴍʙᴏ</light_purple>.</gray>"
    reset_success:         "<green>✦</green> <gray>ᴛᴏᴅᴏs ᴏs sʟᴏᴛs ꜰᴏʀᴀᴍ ʟɪᴍᴘᴏs.</gray>"
    reset_cancelled:       "<gray>ʀᴇsᴇᴛ ᴄᴀɴᴄᴇʟᴀᴅᴏ.</gray>"
    passive_toggled_on:    "<green>✦</green> <white>%spell%</white> <gray>ᴀᴛɪᴠᴀᴅᴀ.</gray>"
    passive_toggled_off:   "<yellow>⚠</yellow> <white>%spell%</white> <gray>ᴅᴇsᴀᴛɪᴠᴀᴅᴀ.</gray>"
    passive_no_mana:       "<red>✖</red> <white>%spell%</white> <gray>ᴅᴇsᴀᴛɪᴠᴀᴅᴀ — ᴍᴀɴᴀ ɪɴsᴜꜰɪᴄɪᴇɴᴛᴇ.</gray>"

  # ── Menu de Ajuda ──
  help_chat:
    title:    "<gray>══ <white>✦ ᴀᴊᴜᴅᴀ: ᴍᴀɢɪᴀs</white> <gray>══</gray>"
    passive:  "<aqua>◆ ᴘᴀssɪᴠᴀ</aqua> <dark_gray>—</dark_gray> <gray>sᴇᴍᴘʀᴇ ᴀᴛɪᴠᴀ ᴀᴜᴛᴏᴍᴀᴛɪᴄᴀᴍᴇɴᴛᴇ.</gray>"
    common:   "<green>◆ ʜᴀʙɪʟɪᴅᴀᴅᴇs</green> <dark_gray>—</dark_gray> <gray>4 ʜᴀʙɪʟɪᴅᴀᴅᴇs ᴄᴏᴍᴜɴs ᴄᴏᴍ ᴄᴜsᴛᴏ ᴇ ʀᴇᴄᴀʀɢᴀ.</gray>"
    ultimate: "<gold>★ ᴜʟᴛɪᴍᴀᴛᴇ</gold> <dark_gray>—</dark_gray> <gray>ᴘᴏᴅᴇʀ ᴍᴀxɪᴍᴏ, ᴅɪsᴘᴏɴɪᴠᴇʟ ᴇᴍ ɴɪᴠᴇʟ ᴀʟᴛᴏ.</gray>"

  # ── Novo Info Button ──
  info:
    name: "<aqua>ɪɴꜰᴏʀᴍᴀᴄᴏᴇs</aqua>"
    total_spells: "<gray>ᴛᴏᴛᴀʟ ᴅᴇ ʜᴀʙɪʟɪᴅᴀᴅᴇs: <white>%total%</white></gray>"
    common_count: "<white>ᴄᴏᴍᴜɴs: <white>%count%</white></white>"
    ultimate_count: "<gold>ᴜʟᴛɪᴍᴀᴛᴇs: <white>%count%</white></gold>"
    passive_count: "<aqua>ᴘᴀssɪᴠᴀs: <white>%count%</white></aqua>"
    casting_style: "<yellow>ᴇsᴛɪʟᴏ: %style%</yellow>"
    style_skillbar: "<white>ʙᴀʀʀᴀ ᴅᴇ ᴀᴛᴀʟʜᴏs</white>"
    style_combo: "<light_purple>ᴄᴏᴍʙᴏ</light_purple>"

  # ── Settings Button ──
  settings:
    name: "<yellow>ᴄᴏɴꜰɪɢᴜʀᴀᴄᴏᴇs</yellow>"
    current_style: "<gray>ᴇsᴛɪʟᴏ ᴀᴛᴜᴀʟ: %style%</gray>"
    style_skillbar: "<white>ʙᴀʀʀᴀ ᴅᴇ ᴀᴛᴀʟʜᴏs</white>"
    style_combo: "<light_purple>ᴄᴏᴍʙᴏ</light_purple>"
    click_to_toggle: "<yellow>ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴀʟᴛᴇʀɴᴀʀ</yellow>"

  # ── Upgrade Button ──
  upgrade:
    name: "<green>ᴘʀᴏɢʀᴇssᴀᴏ</green>"
    lore: "<gray>ᴠᴇʀ ᴘʀᴏɢʀᴇssᴏ ᴅᴀs sᴘᴇʟʟs</gray>"

# ──────────────────────────────────────────────
#  MENU DE SELEÇÃO DE SPELLS
# ──────────────────────────────────────────────
spell_selection:
  title: "<white>sᴇʟᴇᴄɪᴏɴᴀʀ ʜᴀʙɪʟɪᴅᴀᴅᴇ</white>"

  header:
    name: "<white>sʟᴏᴛ %slot%</white>"
    lore: "<gray>ᴇsᴄᴏʟʜᴀ ᴜᴍᴀ ʜᴀʙɪʟɪᴅᴀᴅᴇ</gray>"

  item:
    level: "<gray>ɴɪᴠᴇʟ <white>%level%</white><dark_gray>/<gray>%max%</gray></dark_gray></gray>"
    stats: "<gray>⏱ %cd%s<dark_gray>|</dark_gray> <blue>✦ %mana%</blue>"
