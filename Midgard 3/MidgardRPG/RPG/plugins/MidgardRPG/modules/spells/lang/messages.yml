  achieved: "<light_purple>★</light_purple> <gray>ᴠᴏᴄᴇ <gold>ᴅᴏᴍɪɴᴏᴜ</gold> <white>%spell%</white><gray>! ʙᴏɴᴜs ᴘᴇʀᴍᴀɴᴇɴᴛᴇs ᴀᴘʟɪᴄᴀᴅᴏs.</gray>"

# ──────────────────────────────────────────────
#  CHANNELING (BossBar)
# ──────────────────────────────────────────────
channeling:
  bossbar_title: "<yellow>ᴄᴏɴᴊᴜʀᴀɴᴅᴏ <white>%spell%</white> <gray>— %time%</gray></yellow>"

# ──────────────────────────────────────────────
#  SCROLLS (Pergaminhos)
# ──────────────────────────────────────────────
scrolls:
  names:
    unlearning: "<red>ᴘᴇʀɢᴀᴍɪɴʜᴏ ᴅᴇ ᴅᴇsᴀᴘʀᴇɴᴅɪzᴀᴅᴏ</red>"
    learning:   "<green>ᴘᴇʀɢᴀᴍɪɴʜᴏ ᴅᴇ ᴀᴘʀᴇɴᴅɪzᴀᴅᴏ — %spell%</green>"
    respec:     "<light_purple>ᴘᴇʀɢᴀᴍɪɴʜᴏ ᴅᴇ ʀᴇsᴘᴇᴄ</light_purple>"
  lore:
    unlearning:
      - "<gray>ᴜsᴇ ᴘᴀʀᴀ ᴅᴇsᴀᴘʀᴇɴᴅᴇʀ ᴜᴍᴀ ᴍᴀɢɪᴀ.</gray>"
      - "<gray>ᴏ ɴɪᴠᴇʟ sᴇʀᴀ ᴘᴀʀᴄɪᴀʟᴍᴇɴᴛᴇ sᴀʟᴠᴏ</gray>"
      - "<gray>ɴᴀ ᴍᴇᴍᴏʀɪᴀ ᴅᴏ ᴘᴇʀsᴏɴᴀɢᴇᴍ.</gray>"
    learning:
      - "<gray>ᴜsᴇ ᴘᴀʀᴀ ᴀᴘʀᴇɴᴅᴇʀ <white>%spell%</white>.</gray>"
      - "<gray>sᴇ ᴊᴀ ᴄᴏɴʜᴇᴄᴇᴜ ᴀɴᴛᴇs, ᴘᴀʀᴛᴇ</gray>"
      - "<gray>ᴅᴏ ɴɪᴠᴇʟ sᴇʀᴀ ʀᴇsᴛᴀᴜʀᴀᴅᴀ.</gray>"
    respec:
      - "<gray>ᴜsᴇ ᴘᴀʀᴀ ᴅᴇsᴀᴘʀᴇɴᴅᴇʀ ᴛᴏᴅᴀs</gray>"
      - "<gray>ᴀs sᴜᴀs ᴍᴀɢɪᴀs ᴅᴇ ᴜᴍᴀ ᴠᴇz.</gray>"
      - "<gray>ᴏs ɴɪᴠᴇɪs sᴇʀᴀᴏ ᴘᴀʀᴄɪᴀʟᴍᴇɴᴛᴇ</gray>"
      - "<gray>sᴀʟᴠᴏs ɴᴀ ᴍᴇᴍᴏʀɪᴀ.</gray>"
  messages:
    unlearn_no_target:    "<yellow>⚠</yellow> <gray>ᴇsᴛᴇ ᴘᴇʀɢᴀᴍɪɴʜᴏ ɴᴀᴏ ᴛᴇᴍ ᴀʟᴠᴏ. ᴜsᴇ <yellow>/rpg spell unlearn</yellow> ᴏᴜ ᴀ ɢᴜɪ.</gray>"
    learn_no_target:      "<yellow>⚠</yellow> <gray>ᴇsᴛᴇ ᴘᴇʀɢᴀᴍɪɴʜᴏ ɴᴀᴏ ᴛᴇᴍ ᴜᴍᴀ ᴍᴀɢɪᴀ ᴀssᴏᴄɪᴀᴅᴀ.</gray>"
    not_learned:          "<yellow>⚠</yellow> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴄᴏɴʜᴇᴄᴇ <white>%spell%</white>.</gray>"
    already_learned:      "<yellow>⚠</yellow> <gray>ᴠᴏᴄᴇ ᴊᴀ ᴄᴏɴʜᴇᴄᴇ <white>%spell%</white>.</gray>"
    unlearn_success:      "<green>✦</green> <gray>ᴠᴏᴄᴇ ᴅᴇsᴀᴘʀᴇɴᴅᴇᴜ <white>%spell%</white>. ᴏ ɴɪᴠᴇʟ ꜰᴏɪ sᴀʟᴠᴏ ɴᴀ ᴍᴇᴍᴏʀɪᴀ.</gray>"
    learn_success:        "<green>✦</green> <gray>ᴠᴏᴄᴇ ᴀᴘʀᴇɴᴅᴇᴜ <white>%spell%</white>!</gray>"
    memory_restored:      "<aqua>✦</aqua> <gray>ᴍᴇᴍᴏʀɪᴀ ʀᴇsᴛᴀᴜʀᴀᴅᴀ! <white>%spell%</white> ᴄᴏᴍᴇᴄᴀ ɴᴏ ɴɪᴠᴇʟ <yellow>%level%</yellow>.</gray>"
    respec_success:       "<light_purple>✦</light_purple> <gray>ʀᴇsᴘᴇᴄ ᴄᴏᴍᴘʟᴇᴛᴏ! <white>%count%</white> ᴍᴀɢɪᴀs ᴅᴇsᴀᴘʀᴇɴᴅɪᴅᴀs.</gray>"
    no_spells_to_respec:  "<yellow>⚠</yellow> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴘᴏssᴜɪ ᴍᴀɢɪᴀs ᴘᴀʀᴀ ʀᴇsᴘᴇᴄ.</gray>"

# ──────────────────────────────────────────────
#  LEADERBOARD
# ──────────────────────────────────────────────
# ──────────────────────────────────────────────
#  MENU DE UPGRADE / PROGRESSÃO
# ──────────────────────────────────────────────
upgrade_gui:
  title: "<white>ᴘʀᴏɢʀᴇssᴀᴏ</white>"
  level_suffix: " <gray>Lv.%level%"

  header:
    name: "<aqua>ᴘʀᴏɢʀᴇssᴀᴏ ᴅᴇ ᴍᴀɢɪᴀs</aqua>"
    lore: "<gray>ᴠɪsᴜᴀʟɪzᴇ sᴜᴀ ᴇᴠᴏʟᴜᴄᴀᴏ</gray>"

  item:
    level: "<gray>ɴɪᴠᴇʟ <white>%level%</white><dark_gray>/<gray>%max%</gray></dark_gray></gray>"
    xp: "<gray>xᴘ: <white>%current%</white><dark_gray>/<gray>%needed%</gray></dark_gray></gray>"
    bar: "<dark_gray>[</dark_gray>%bar%<dark_gray>]</dark_gray> <gray>%percent%%</gray>"
    mastered: "<light_purple>★ ᴅᴏᴍɪɴᴀᴅᴀ</light_purple>"
    max_level: "<gold>✦ ɴɪᴠᴇʟ ᴍᴀxɪᴍᴏ</gold>"
    click_to_view: "<yellow>ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴠᴇʀ ᴅᴇᴛᴀʟʜᴇs</yellow>"

  nav:
    previous: "<gray>← ᴘᴀɢɪɴᴀ ᴀɴᴛᴇʀɪᴏʀ</gray>"
    next: "<gray>ᴘʀᴏxɪᴍᴀ ᴘᴀɢɪɴᴀ →</gray>"
    home: "<gray>⌂ ᴠᴏʟᴛᴀʀ</gray>"

  # ── Detalhes da Spell ──
  detail:
    title: "<white>%spell%</white>"
    back_button: "<gray>← ᴠᴏʟᴛᴀʀ</gray>"
    type_level: "%type% <dark_gray>•</dark_gray> <white>ɴɪᴠᴇʟ %level%/%max%</white>"
    xp_progress: "<yellow>%xp%/%xp_needed% xᴘ</yellow> <dark_gray>(%percent%%)</dark_gray>"
    max_level_badge: "<gold>✦ ɴɪᴠᴇʟ ᴍᴀxɪᴍᴏ</gold>"
    milestones_label: "<gray>ᴍᴀʀᴄᴏs: </gray>"
    milestone_achieved_dot: "<green>●</green>"
    milestone_locked_dot: "<dark_gray>○</dark_gray>"
    mastery_badge: "<gold>✦ ᴍᴀᴇsᴛʀɪᴀ ᴀʟᴄᴀɴᴄᴀᴅᴀ</gold>"
    xp_bar_max: "<gold>✦ ᴍᴀxɪᴍᴏ</gold>"
    xp_bar_percent: "<yellow>%percent%%</yellow>"

    # Info principal
    level_display:
      name: "<green>ɴɪᴠᴇʟ %level%</green>"
      lore:
        - "<gray>ɴɪᴠᴇʟ ᴀᴛᴜᴀʟ: <white>%level%</white><dark_gray>/<gray>%max%</gray></dark_gray></gray>"
        - ""
        - "<gray>ᴜsᴇ ᴀ ᴍᴀɢɪᴀ ᴘᴀʀᴀ ɢᴀɴʜᴀʀ xᴘ</gray>"
        - "<gray>ᴇ sᴜʙɪʀ ᴅᴇ ɴɪᴠᴇʟ.</gray>"

    # XP
    xp_display:
      name: "<aqua>ᴇxᴘᴇʀɪᴇɴᴄɪᴀ</aqua>"
      lore:
        - "<gray>xᴘ ᴀᴛᴜᴀʟ: <white>%xp%</white><dark_gray>/<gray>%xp_needed%</gray></dark_gray></gray>"
        - "%bar%"
        - "<gray>ᴘʀᴏɢʀᴇssᴏ: <white>%percent%%</white></gray>"
      lore_maxed:
        - "<light_purple>★ ɴɪᴠᴇʟ ᴍᴀxɪᴍᴏ ᴀᴛɪɴɢɪᴅᴏ!</light_purple>"
        - ""
        - "<gray>ɴᴀᴏ ᴇ ᴘᴏssɪᴠᴇʟ ᴀᴄᴜᴍᴜʟᴀʀ ᴍᴀɪs xᴘ.</gray>"

    # Next Level Preview
    next_level:
      name: "<yellow>ᴘʀᴏxɪᴍᴏ ɴɪᴠᴇʟ: %next_level%</yellow>"
      lore_header: "<gray>ᴀᴏ ᴀᴛɪɴɢɪʀ ᴏ ɴɪᴠᴇʟ <white>%next_level%</white>:</gray>"
      no_next: "<gold>✦ ɴɪᴠᴇʟ ᴍᴀxɪᴍᴏ ᴀʟᴄᴀɴᴄᴀᴅᴏ!</gold>"

    # Stats comparison
    stats:
      cooldown:       "<gray>⏱ ʀᴇᴄᴀʀɢᴀ: <white>%current%s</white> <dark_gray>→</dark_gray> <green>%next%s</green></gray>"
      cooldown_max:   "<gray>⏱ ʀᴇᴄᴀʀɢᴀ: <white>%current%s</white></gray>"
      mana:           "<blue>✦ ᴍᴀɴᴀ: <white>%current%</white> <dark_gray>→</dark_gray> <green>%next%</green></blue>"
      mana_max:       "<blue>✦ ᴍᴀɴᴀ: <white>%current%</white></blue>"
      stamina:        "<yellow>✦ sᴛᴀᴍɪɴᴀ: <white>%current%</white> <dark_gray>→</dark_gray> <green>%next%</green></yellow>"
      stamina_max:    "<yellow>✦ sᴛᴀᴍɪɴᴀ: <white>%current%</white></yellow>"

    # Milestones
    milestone:
      name_achieved:  "<green>✦ ᴍᴀʀᴄᴏ — ɴɪᴠᴇʟ %level%</green>"
      name_next:      "<yellow>✦ ᴍᴀʀᴄᴏ — ɴɪᴠᴇʟ %level%</yellow>"
      name_locked:    "<dark_gray>✖ ᴍᴀʀᴄᴏ — ɴɪᴠᴇʟ %level%</dark_gray>"
      lore_achieved:
        - "<green>✓ ᴄᴏɴǫᴜɪsᴛᴀᴅᴏ!</green>"
      lore_next:
        - "<yellow>⏳ ᴘʀᴏxɪᴍᴏ ᴍᴀʀᴄᴏ</yellow>"
        - "<gray>ᴀʟᴄᴀɴᴄᴇ ᴏ ɴɪᴠᴇʟ <white>%level%</white></gray>"
      lore_locked:
        - "<dark_gray>ʙʟᴏǫᴜᴇᴀᴅᴏ</dark_gray>"
        - "<dark_gray>ᴀʟᴄᴀɴᴄᴇ ᴏ ɴɪᴠᴇʟ <white>%level%</white></dark_gray>"

    # Mastery display
    mastery:
      name_achieved:  "<light_purple>★ ᴍᴀᴇsᴛʀɪᴀ ᴄᴏɴǫᴜɪsᴛᴀᴅᴀ!</light_purple>"
      lore_achieved:
        - "<gray>ᴠᴏᴄᴇ ᴅᴏᴍɪɴᴏᴜ ᴇsᴛᴀ ᴍᴀɢɪᴀ!</gray>"
        - "<gray>ʙᴏɴᴜs ᴘᴇʀᴍᴀɴᴇɴᴛᴇs ᴀᴛɪᴠᴏs:</gray>"
      bonus_line:     "<gray>  + <white>%attribute%</white>: <green>+%value%</green></gray>"
      name_locked:    "<dark_gray>★ ᴍᴀᴇsᴛʀɪᴀ</dark_gray>"
      lore_locked:
        - "<dark_gray>ᴀʟᴄᴀɴᴄᴇ ᴏ ɴɪᴠᴇʟ ᴍᴀxɪᴍᴏ</dark_gray>"
        - "<dark_gray>ᴘᴀʀᴀ ᴅᴏᴍɪɴᴀʀ ᴇsᴛᴀ ᴍᴀɢɪᴀ.</dark_gray>"

    # Buttons
    buttons:
      back:
        name: "<gray>← ᴠᴏʟᴛᴀʀ</gray>"
        lore:
          - "<dark_gray>ᴠᴏʟᴛᴀ ᴀ ʟɪsᴛᴀ ᴅᴇ ᴍᴀɢɪᴀs.</dark_gray>"

  # Chat messages
  messages:
    opened_list:     "<green>✦</green> <gray>ᴀʙʀɪɴᴅᴏ ᴍᴇɴᴜ ᴅᴇ ᴘʀᴏɢʀᴇssᴀᴏ...</gray>"

