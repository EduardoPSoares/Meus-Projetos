# ──────────────────────────────────────────────
leaderboard:
  header: "<gray>══ <yellow>✦ ᴛᴏᴘ ᴍᴀɢᴏs — %type%</yellow> <gray>══</gray>"
  entry:  "<gray>%rank%. <white>%player%</white> <dark_gray>—</dark_gray> <yellow>%value%</yellow></gray>"
