# ============================================
# MIDGARD PROFESSIONS MODULE - MESSAGES
# ============================================

# ============================================
# PROFESSIONS - SISTEMA BASE
# ============================================
professions:
  # Nomes das profissões (usados em GUIs e mensagens)
  names:
    ferreiro: "Ferreiro"
    agricultor: "Agricultor"
    arcanista: "Arcanista"
    carpinteiro: "Carpinteiro"
    minerador: "Minerador"
    alquimista: "Alquimista"
    pescador: "Pescador"
    cozinheiro: "Cozinheiro"
    medico: "Médico"
    cartografo: "Cartógrafo"

  # Descrições curtas
  descriptions:
    ferreiro: "<gray>Forja armas, armaduras e ferramentas.</gray>"
    agricultor: "<gray>Cultiva e colhe plantas raras.</gray>"
    arcanista: "<gray>Manipula essências mágicas e encantamentos.</gray>"
    carpinteiro: "<gray>Constrói estruturas e móveis.</gray>"
    minerador: "<gray>Extrai minérios e gemas preciosas.</gray>"
    alquimista: "<gray>Prepara poções e elixires.</gray>"
    pescador: "<gray>Pesca criaturas e tesouros aquáticos.</gray>"
    cozinheiro: "<gray>Prepara refeições com buffs especiais.</gray>"
    medico: "<gray>Cura ferimentos e remove debuffs.</gray>"
    cartografo: "<gray>Mapeia territórios e descobre locais secretos.</gray>"

  # Mensagens gerais
  level_up: "<gold><bold>🎉 Nível Up!</bold> <white>%profession% Nível %level%</white></gold>"
  xp_gained: "<gray>+<green>%xp%</green> XP em <white>%profession%</white></gray>"
  xp_bar: "%symbol% <white>%profession%</white> <gray>Nv.%level%</gray> <green>+%xp% XP</green> <gray>%current%/%max%</gray>"
  no_profession: "<red>Você não possui essa profissão.</red>"
  profession_disabled: "<red>Essa profissão está desabilitada.</red>"
  info:
    header: "<gold><bold>═══ %profession% ═══</bold></gold>"
    level: "<gray>Nível: <white>%level%</white></gray>"
    xp: "<gray>XP: <white>%current% / %max%</white> <gray>(%percent%%)</gray></gray>"
    bar: "<gray>[%bar%<gray>] <white>%percent%%</white></gray>"
  list:
    header: "<gold><bold>═══ Suas Profissões ═══</bold></gold>"
    entry: "  %symbol% <white>%name%</white> <gray>— Nível <white>%level%</white></gray>"
    none: "<gray>Você ainda não possui profissões.</gray>"

  # Mensagens do menu de progressão
  menu:
    title: "%symbol% %profession% — Página %page%"
    # Header
    icon:
      name: "%gradient%<bold>%symbol% %profession%</bold></gradient>"
      description_label: "<gray>%description%</gray>"
      progress_label: "<white>Seu Progresso:</white>"
      progress_level: "<gray>  Nível: <white>%level%</white><gray>/%max%</gray>"
      progress_bar: "<gray>  %bar% <white>%percent%%</white>"
      progress_xp: "<gray>  XP: <white>%current%</white><gray>/<white>%max%</white>"
      bonuses_label: "<white>Bônus:</white>"
      abilities_label: "<white>Habilidades:</white>"
    ranking:
      title: "<gradient:#facc15:#f59e0b><bold>📊 Ranking da Profissão</bold></gradient>"
      subtitle: "<gray>Seu Ranking em %profession%:</gray>"
      position: "<white>  Posição: <yellow>#%position%</yellow></white>"
      top_percent: "<white>  Top: <yellow>%percent%%</yellow></white>"
      coming_soon: "<dark_gray>Ranking será implementado em breve.</dark_gray>"
    xp_sources:
      title: "<gradient:#06b6d4:#3b82f6><bold>⚡ Fontes de XP</bold></gradient>"
      header: "<white>Como ganhar XP em %profession%:</white>"
      entry: "  <green>▸</green> %source%"
      unavailable: "<gray>  Informações não disponíveis.</gray>"
      click: "<yellow>Clique para ver detalhes das fontes de XP</yellow>"
    extra_button:
      default_name: "<gold><bold>ℹ Informações</bold></gold>"
      default_lore: "<gray>Informações complementares.</gray>"
    # Níveis
    level:
      name_completed: "%gradient_green%<bold>Nível %level%</bold></gradient>"
      name_in_progress: "%gradient_gold%<bold>⚡ Nível %level%</bold></gradient>"
      name_locked: "%gradient_red%<bold>🔒 Nível %level%</bold></gradient>"
      rewards_label: "<white>Recompensas:</white>"
      rewards_entry: "  <green>▸ %bonus%</green>"
      ability_label: "<yellow><bold>Ability Unlock:</bold></yellow>"
      ability_entry: "  <yellow>%ability%</yellow>"
      ability_desc: "  <gray>%description%</gray>"
      perks_label: "<light_purple>Perks:</light_purple>"
      perks_entry: "  <light_purple>✦ %perk%</light_purple>"
      progress_label: "<white>Progresso:</white>"
      progress_bar: "  %bar% <white>%percent%%</white>"
      progress_xp: "  <gray>XP: <white>%current%</white>/<white>%max%</white></gray>"
      status_completed: "<gradient:#22c55e:#16a34a><bold>✔ COMPLETO</bold></gradient>"
      status_in_progress: "<gradient:#facc15:#f59e0b><bold>⚡ EM PROGRESSO</bold></gradient>"
      status_locked: "<gradient:#ef4444:#dc2626><bold>🔒 BLOQUEADO</bold></gradient>"
    # Navegação
    navigation:
      close_name: "<red><bold>✖ Fechar</bold></red>"
      close_lore: "<gray>Fechar o menu de profissão</gray>"
      prev_page_name: "<yellow><bold>← Página Anterior</bold></yellow>"
      prev_page_lore: "<gray>Ir para página %page%</gray>"
      next_page_name: "<green><bold>Próxima Página →</bold></green>"
      next_page_lore: "<gray>Ir para página %page%</gray>"

  # Mensagens do comando
  command:
    set_success: "<green>Profissão <white>%profession%</white> de <white>%player%</white> definida para nível <yellow>%level%</yellow>.</green>"
    addxp_success: "<green>Adicionado <yellow>%xp%</yellow> XP em <white>%profession%</white> para <white>%player%</white>.%levels%</green>"
    addxp_levels: " <gold>(+%count% nível(is)!)</gold>"
    player_not_found: "<red>Jogador não encontrado: %name%</red>"
    invalid_profession: "<red>Profissão inválida: %name%</red>"
    invalid_number: "<red>Valor numérico inválido: %value%</red>"
    system_disabled: "<red>Sistema de profissões não inicializado.</red>"
    players_only: "<red>Apenas jogadores podem abrir menus.</red>"
    menu_opened: "<green>Menu de <white>%profession%</white> aberto para <white>%player%</white>.</green>"
    choose_success: "<green>Profissão de <white>%player%</white> definida para %symbol% <white>%profession%</white>.</green>"
    # Usage
    usage_set: "<red>Uso: /rpg admin profession set <player> <profissão> <nível></red>"
    usage_addxp: "<red>Uso: /rpg admin profession addxp <player> <profissão> <xp></red>"
    usage_info: "<red>Uso: /rpg admin profession info <player> <profissão></red>"
    usage_menu: "<red>Uso: /rpg admin profession menu <profissão></red>"
    usage_openmenu: "<red>Uso: /rpg admin profession openmenu <player> <profissão></red>"
    usage_choose: "<red>Uso: /rpg admin profession choose <player> <profissão></red>"
    # Info display
    info_header: "<gold><bold>═══ %symbol% %profession% ═══</bold></gold>"
    info_player: "<gray>Jogador: <white>%player%</white></gray>"
    info_level: "<gray>Nível: <white>%level%</white></gray>"
    info_xp: "<gray>XP: <white>%current%</white>/<white>%max%</white></gray>"
    # Help
    help_header: "<gold><bold>═══ Profissões Admin ═══</bold></gold>"
    help_set: "<yellow>/rpg admin profession set <player> <profissão> <nível></yellow>"
    help_addxp: "<yellow>/rpg admin profession addxp <player> <profissão> <xp></yellow>"
    help_info: "<yellow>/rpg admin profession info <player> <profissão></yellow>"
    help_menu: "<yellow>/rpg admin profession menu <profissão></yellow>"
    help_openmenu: "<yellow>/rpg admin profession openmenu <player> <profissão></yellow>"
    help_choose: "<yellow>/rpg admin profession choose <player> <profissão></yellow>"
    help_professions: "<gray>Profissões: %list%</gray>"

  # ============================================
  # PENALIDADES PARA NÃO-PROFISSIONAIS
  # ============================================
  penalties:
    # Bloco — drop perdido
    block_no_drop: "<red>⚠</red> <gray>Sem habilidade de %symbol% <white>%profession%</white> — você perdeu o drop!</gray>"
    # Bloco — efeito de lentidão
    block_slow: "<red>⚠</red> <gray>Sem habilidade de %symbol% <white>%profession%</white> — trabalho pesado!</gray>"
    # Craft — falhou
    craft_failed: "<red>⚠</red> <gray>Sem habilidade de %symbol% <white>%profession%</white> — craft falhou! Materiais perdidos.</gray>"
    # Smelt — comida/lingote queimado
    smelt_failed: "<red>⚠</red> <gray>Sem habilidade de %symbol% <white>%profession%</white> — resultado queimado!</gray>"
    # Pesca — lixo
    fish_junk: "<red>⚠</red> <gray>Sem habilidade de %symbol% <white>%profession%</white> — você pescou lixo.</gray>"
    # Brew — poção falhou
    brew_failed: "<red>⚠</red> <gray>Sem habilidade de %symbol% <white>%profession%</white> — poção explodiu!</gray>"
    # Enchant — falhou (perdeu XP)
    enchant_failed: "<red>⚠</red> <gray>Sem habilidade de %symbol% <white>%profession%</white> — encantamento falhou! XP perdido.</gray>"
    # Enchant — custo extra
    enchant_extra_cost: "<red>⚠</red> <gray>Sem habilidade de %symbol% <white>%profession%</white> — custo extra de XP.</gray>"

# ============================================
# FORGE - COMANDOS DO JOGADOR
# ============================================
forge:
  # Geral
  no_permission_build: "<red>✖</red> <gray>Sem permissão para construir forjas.</gray>"
  usage_get: "<red>✖</red> <gray>Use: /rpg forge get <nome_da_forja></gray>"
  not_found: "<red>✖</red> <gray>Forja não encontrada: <white>%name%</white></gray>"
  level_insufficient: "<red>✖</red> <gray>Nível insuficiente! Necessário: <white>%level%</white></gray>"
  blueprint_received: "<green>✔</green> <gray>Projeto de <white>%name%</white> recebido!</gray>"
  place_instructions: "<gray>Coloque o item no chão para iniciar a construção.</gray>"
  no_templates: "<gray>Nenhuma forja disponível no momento.</gray>"
  templates_header: "<gold>Forjas disponíveis:</gold>"
  template_entry: "  <gray>• <white>%name% <gray>| %tier% <gray>| Nível: <white>%level%</white></gray>"
  no_build_session: "<red>✖</red> <gray>Você não tem uma sessão de construção ativa.</gray>"
  rotated: "<green>✔</green> <gray>Projeto rotacionado!</gray>"
  no_forge_nearby: "<red>✖</red> <gray>Nenhuma forja encontrada por perto! Vá até uma forja para ver receitas.</gray>"
  session_cancelled: "<yellow>⚠</yellow> <gray>Sessão cancelada.</gray>"
  no_session: "<gray>Nenhuma sessão ativa.</gray>"

  # Info do jogador
  info:
    header: "<gold><bold>═══ Profissão de Ferreiro ═══</bold></gold>"
    level: "<gray>Nível: <white>%level%</white></gray>"
    xp: "<gray>XP: <white>%current% / %max%</white></gray>"
    specialization: "<gray>Especialização: <white>%spec%</white></gray>"
    items_forged: "<gray>Itens forjados: <white>%count%</white></gray>"
    forges_count: "<gray>Forjas: <white>%count%</white></gray>"

  # Nível / Progresso
  level_display:
    header: "<gold>⚒ Ferreiro Nível <white>%level%</white></gold>"
    bar: "<gray>[%bar%<gray>] <white>%percent%</white></gray>"

  # Ajuda
  help:
    header: "<gold><bold>═══ Comandos da Forja ═══</bold></gold>"
    get: "<yellow>/rpg forge get <forja> <gray>— Recebe um projeto de forja</gray>"
    rotate: "<yellow>/rpg forge rotate <gray>— Gira o projeto de construção</gray>"
    info: "<yellow>/rpg forge info <gray>— Mostra info da profissão</gray>"
    level: "<yellow>/rpg forge level <gray>— Mostra progresso de nível</gray>"
    recipes: "<yellow>/rpg forge recipes <gray>— Abre o livro de receitas</gray>"
    cancel: "<yellow>/rpg forge cancel <gray>— Cancela a sessão atual</gray>"

  # Sessão de forja
  session:
    already_active: "<red>Você já está em uma sessão de forja!</red>"
    in_use: "<red>Esta forja já está em uso por outro jogador!</red>"
    no_fuel: "<red>A forja precisa de combustível! Clique na forja segurando combustível ou jogue itens na zona de combustível.</red>"
    missing_materials: "<red>Faltam materiais! Você precisa de <white>%amount%x %material%</white></red>"
    start_failed: "<red>Não foi possível iniciar a sessão!</red>"
    started_title: "<gold><bold>⚒ Forja Iniciada!</bold></gold>"
    started_recipe: "<gray>Receita: <white>%name%</white></gray>"
    started_fuel: "<gray>Combustível: <white>%fuel%</white></gray>"

  # Aquecimento
  heating:
    instruction: "<gray>Clique direito na <white>fornalha</white> <gray>quando a temperatura estiver na <green>zona ideal</green><gray>!</gray>"
    bossbar_initial: "<red>🔥 Temperatura: <bold>0°C</bold></red>"
    bossbar_ideal: "<green>🔥 <bold>ZONA IDEAL!</bold> <white>%temp%°C</white> <gray>— Clique na fornalha!</gray></green>"
    bossbar_warming: "<yellow>🔥 Aquecendo... <white>%temp%°C</white></yellow>"
    bossbar_overheating: "<red>🔥 <bold>SUPERAQUECENDO!</bold> <white>%temp%°C</white> <gray>— Retire agora!</gray></red>"
    metal_removed: "<gold>Metal retirado a %temp%°C! Pontuação de aquecimento: <white>%score%</white></gold>"

  # Martelamento
  hammering:
    instruction: "<gold>⚒ <bold>Martelamento!</bold> <gray>Clique direito na bigorna quando a barra estiver na <green>zona verde</green><gray>!</gray></gold>"
    required_strikes: "<gray>Marteladas necessárias: <white>%count%</white></gray>"
    perfect_actionbar: "<green><bold>PERFEITO!</bold> <white>⚒ %done%/%total%</white></green>"
    good_actionbar: "<yellow>Bom! <white>⚒ %done%/%total%</white></yellow>"
    miss_actionbar: "<red>Errou! <white>⚒ %done%/%total%</white></red>"
    completed: "<gold>⚒ Martelamento concluído! <white>Pontuação: %score%</white></gold>"
    summary: "<green>Perfeitas: %perfect%</green> <yellow>Boas: %good%</yellow> <red>Erradas: %miss%</red>"

  # Têmpera
  quenching:
    instruction: "<aqua>💧 <bold>Têmpera!</bold> <gray>Mergulhe o metal na temperatura ideal.</gray></aqua>"

  # Afiação
  sharpening:
    instruction: "<yellow>🔪 <bold>Afiação!</bold> <gray>Clique direito na rebolo repetidamente para manter a pressão na <yellow>zona alvo</yellow><gray>!</gray></yellow>"
    required_passes: "<gray>Passes necessários: <white>%count%</white></gray>"
    pass_actionbar: "🔪 Passe %current%/%total% — Pressão: %pressure%"
    pass_excellent: "<green>Passe %n% excelente! Pontuação: %score%</green>"
    pass_good: "<yellow>Passe %n% bom! Pontuação: %score%</yellow>"
    pass_weak: "<red>Passe %n% fraco. Pontuação: %score%</red>"
    completed: "<yellow>🔪 Afiação concluída! <white>Pontuação: %score%</white></yellow>"

  # Resultado
  result:
    title: "<gold><bold>═══ Resultado da Forja ═══</bold></gold>"
    item: "<gray>Item: <white>%name%</white></gray>"
    quality: "<gray>Qualidade: %tier%</gray>"
    score: "<gray>Pontuação: <white>%score%</white></gray>"
    xp: "<gray>XP ganho: <green>+%xp%</green></gray>"
    level_up: "<gold><bold>🎉 Nível Up!</bold> <white>Ferreiro Nível %level%</white></gold>"
    item_received: "<green>Você recebeu: <white>%name% %stars%</white></green>"
    item_not_found: "<red>Item '%id%' não encontrado no sistema!</red>"

  # Etapas
  stage:
    heating_hint: "<gold>🔥 Aqueça o metal na fornalha! Retire no momento certo.</gold>"
    hammering_hint: "<gold>⚒ Hora de martelar! Acerte nas zonas verdes.</gold>"
    quenching_hint: "<aqua>💧 Têmpera! Mergulhe o metal na temperatura ideal.</aqua>"
    sharpening_hint: "<yellow>🔪 Afiação! Mantenha a pressão na zona alvo.</yellow>"
    finishing_hint: "<light_purple>✨ Finalizando... Calculando qualidade.</light_purple>"
    completed: "<green>✔ Forja concluída!</green>"
    failed: "<red>✘ A forja falhou! O metal foi perdido.</red>"

  # Estatísticas
  stats:
    title: "<gold><bold>═══ Profissão de Ferreiro ═══</bold></gold>"
    level: "<gray>Nível: <white>%level%</white></gray>"
    xp: "<gray>XP: <white>%current% / %max%</white> <gray>(%percent%)</gray></gray>"
    specialization: "<gray>Especialização: <white>%spec%</white></gray>"
    items_forged: "<gray>Itens forjados: <white>%count%</white></gray>"
    legendary_items: "<gray>Itens lendários: <gold>%count%</gold></gray>"
    best_quality: "<gray>Maior qualidade: <white>%value%</white></gray>"
    forges_built: "<gray>Forjas construídas: <white>%count%</white></gray>"

  # Construção
  build:
    level_insufficient: "<red>✖</red> <gray>Nível insuficiente! Necessário: <white>%level%</white></gray>"
    max_forges: "<red>Você já tem o máximo de forjas (%max%)!</red>"
    activated: "<green><bold>✔ Forja ativada!</bold> <gray>Interaja com a mesa de ferreiro para começar.</gray></green>"
    confirm_hint: "<yellow>Shift + Clique Direito</yellow> <gray>para confirmar a posição e iniciar a construção.</gray>"
    already_building: "<red>Você já está construindo uma forja!</red>"
    cannot_destroy_other: "<red>Você não pode destruir a forja de outro jogador!</red>"

  # Combustível
  fuel:
    collected: "<gold>🔥 Combustível coletado!</gold> <gray>Estoque: <white>%time%</white></gray>"
    level_insufficient: "<red>Nível de ferreiro insuficiente para usar <white>%name%</white><red>! Necessário: <white>%level%</white></red>"
    stock_full: "<red>Estoque de combustível cheio!</red> <gray>(<white>%time%</white>)</gray>"
    deposited: "<gold>🔥 <white>%amount%x %name%</white> <gold>depositado!</gold> <gray>Estoque: <white>%current%</white> <dark_gray>/ %max%</dark_gray></gray>"

  # Reparo
  repair:
    insufficient_materials: "<red>✖</red> <gray>Materiais insuficientes para o reparo!</gray>"
    success: "<green>✔</green> <gray>Item reparado com sucesso!</gray>"

  # Pesquisa de receitas
  recipe_search:
    prompt: "<yellow>🔍 Digite o nome da receita no chat para pesquisar:</yellow>"

  # Ghost blocks (construção com blocos fantasma)
  ghost:
    session_expired: "<red>Sessão de construção expirada!</red>"
    no_space: "<red>Espaço insuficiente para construir a forja aqui!</red>"
    preview_title: "<gold><bold>⚒ Projeto de %tier%</bold></gold>"
    preview_hint1: "<gray>Blocos fantasma mostram onde construir.</gray>"
    preview_hint2: "<yellow>Shift + Clique Direito</yellow> <gray>no chão para confirmar posição.</gray>"
    preview_hint3: "<yellow>/forge rotacionar</yellow> <gray>para girar o projeto.</gray>"
    preview_hint4: "<yellow>/forge cancelar</yellow> <gray>para cancelar.</gray>"
    build_started: "<green><bold>✔ Construção iniciada!</bold></green>"
    build_hint: "<gray>Coloque os blocos nas posições indicadas.</gray>"
    next_block: "<gray>Próximo bloco: <white>%name%</white></gray>"
    layer_complete: "<green>✔ Camada <white>%done%/%total%</white> <green>concluída!</green>"
    wrong_block: "<red>✘ Bloco incorreto!</red> <gray>Esperado: <white>%name%</white></gray>"
    rotate_preview_only: "<red>Você só pode rotacionar durante a pré-visualização!</red>"
    rotate_no_space: "<red>Espaço insuficiente nessa orientação!</red>"
    rotated: "<green>Projeto rotacionado!</green>"
    build_complete_title: "<green><bold>⚒ Forja Construída!</bold></green>"
    build_complete_time: "<gray>Tempo: <white>%min%m %sec%s</white></gray>"
    build_complete_blocks: "<gray>Blocos colocados: <white>%count%</white></gray>"
    build_complete_errors: "<gray>Erros: <white>%count%</white></gray>"
    build_complete_order: "<gray>Em ordem: <white>%perfect%/%total%</white></gray>"
    hint_actionbar: "<green>✔</green> <gray>Restam <white>%remaining%</white> <gray>blocos | Próximo: <white>%next%</white></gray>"

  # Admin
  admin:
    enter_template_name: "<yellow>Digite o nome do template no chat:</yellow>"
    pos1_set: "<green>Posição 1 definida: <white>%loc%</white></green>"
    different_worlds: "<red>As duas posições devem estar no mesmo mundo!</red>"
    pos2_set: "<green>Posição 2 definida: <white>%loc%</white></green>"
    area_scanned: "<green>Área escaneada! <white>%count% blocos</white> <green>detectados.</green>"
    missing_blocks_given: "<green>Blocos faltantes entregues!</green> <gray>(%count% tipos)</gray>"
    enter_new_name: "<yellow>Digite o novo nome do template no chat:</yellow>"
    template_toggled_on: "<green>Template ativado!</green>"
    template_toggled_off: "<red>Template desativado!</red>"
    confirm_delete: "<red>Use Shift + Clique para confirmar a exclusão!</red>"
    template_deleted: "<red>Template <white>%name%</white> <red>excluído permanentemente!</red>"
    creation_cancelled: "<red>Criação de template cancelada.</red>"
    no_active_session: "<red>Você não tem uma sessão de criação ativa.</red>"
    missing_required_blocks: "<red>O template não tem todos os blocos obrigatórios!</red>"
    template_created: "<green><bold>✔ Template criado com sucesso!</bold></green>"
    template_name: "<gray>Nome: <white>%name%</white></gray>"
    template_id: "<gray>ID: <white>%id%</white></gray>"
    template_tier: "<gray>Tipo: %tier%</gray>"
    template_level: "<gray>Nível necessário: <white>%level%</white></gray>"
    template_dimensions: "<gray>Dimensões: <white>%w%x%h%x%d%</white></gray>"
    block_entry: "<gray>  • %type%: <white>%count%</white></gray>"
    name_too_long: "<red>Nome muito longo! Máximo 64 caracteres.</red>"
    name_set: "<green>Nome definido: <white>%name%</white></green>"
    template_renamed: "<green>Template renomeado para: <white>%name%</white></green>"

# ============================================
# FORGE ADMIN - COMANDOS ADMINISTRATIVOS
# ============================================
forgeadmin:
  system_unavailable: "<red>✖</red> <gray>Sistema de forjas não está disponível.</gray>"
  player_not_found: "<red>✖</red> <gray>Jogador não encontrado.</gray>"
  creation_unavailable: "<red>✖</red> <gray>Sistema de criação não está disponível.</gray>"

  # List
  list:
    header_player: "<gold>Forjas de %player%:</gold>"
