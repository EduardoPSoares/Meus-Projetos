# ============================================
# MIDGARD PROFESSIONS MODULE - CONFIGURATION
# ============================================

# ============================================
# PROFESSIONS - CONFIGURAÇÃO GERAL
# ============================================
professions:
  # Nível máximo de todas as profissões
  max-level: 100

  # Multiplicador global de XP (1.0 = normal)
  xp-multiplier: 1.0

  # BossBar de XP (aparece ao ganhar XP)
  xp-bar:
    enabled: true
    display-ticks: 60     # Tempo visível (60 = 3 segundos)

  # Sistema de penalidades para não-profissionais
  # Quando habilitado, jogadores sem a profissão ativa sofrem penalidades
  # configuradas em cada YML de profissão (seção 'penalties')
  penalties:
    enabled: true         # Toggle global — desativa TODAS as penalidades
    message-cooldown-ms: 3000  # Cooldown entre mensagens de penalidade (evita spam, em ms)

  # Profissões habilitadas (desabilitar aqui não carrega a profissão)
  enabled:
    ferreiro: true
    agricultor: true
    arcanista: true
    carpinteiro: true
    minerador: true
    alquimista: true
    pescador: true
    cozinheiro: true
    medico: true
    cartografo: true

# ============================================
