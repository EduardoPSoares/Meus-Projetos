# ============================================
# PENALIDADES PARA NÃO-MINERADORES
# ============================================
# Jogadores sem a profissão de Minerador ativa sofrem estas penalidades
# ao interagir com materiais desta profissão.
penalties:
  enabled: true
  show-message: true

  # Materiais afetados (vazio = todos os materiais da xp-config)
  # Se preenchido, apenas esses materiais geram penalidade
  affected-materials:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - NETHER_GOLD_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS
    - AMETHYST_BLOCK
    - AMETHYST_CLUSTER

  # Penalidade ao quebrar blocos
  block:
    drop-chance: 0.5          # 50% de chance de dropar (50% de perder)
    durability-multiplier: 2.0 # Picareta gasta o dobro de durabilidade
    effect:
      type: MINING_FATIGUE      # Aplica Mining Fatigue
      duration: 100             # 5 segundos (em ticks)
      amplifier: 1              # Nível II (lentidão moderada)
