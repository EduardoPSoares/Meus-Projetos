# ============================================
# MINERADOR - Definição e Recompensas
# ============================================

definition:
  menu-icon: DIAMOND_PICKAXE
  gradient: "<gradient:#06b6d4:#3b82f6>"
  description: "Quebre minérios, pedras raras e blocos subterrâneos para ganhar XP."
  bonuses:
    - "<green>▸ Velocidade de mineração</green>"
    - "<green>▸ Rendimento de minério</green>"
    - "<green>▸ Chance de minério raro</green>"
    - "<green>▸ Resistência subterrânea</green>"
  xp-source-icon: DIAMOND_ORE
  extra-button-icon: SPYGLASS
  extra-button-name: "<aqua>Detector de Minérios"
  extra-button-lore:
    - "<gray>Visualize suas habilidades de"
    - "<gray>mineração e detecção de veios."

rewards:
  1:
    name: "Aprendiz Minerador"
    bonuses:
      - "+2% velocidade de mineração"
  5:
    bonuses:
      - "+5% velocidade de mineração"
      - "+3% rendimento de minério"
  10:
    name: "Minerador"
    bonuses:
      - "+10% velocidade de mineração"
    ability: "Vein Miner"
    ability-desc: "Mineração em cadeia — quebra veios conectados."
  25:
    name: "Minerador Experiente"
    bonuses:
      - "+5% chance de minério raro"
    ability: "Ore Sense"
    ability-desc: "Detecta minérios próximos por partículas."
  50:
    name: "Mestre Minerador"
    bonuses:
      - "+30% velocidade de mineração"
    ability: "Impacto Pesado"
    ability-desc: "Chance de quebrar blocos adjacentes."
  75:
    name: "Grão-Mestre Minerador"
    bonuses:
      - "+10% rendimento de minério"
    perks:
      - "Resistência subterrânea +10%"
  100:
    name: "Lenda da Mineração"
    bonuses:
      - "+50% velocidade de mineração"
    ability: "Extração Eficiente"
    ability-desc: "Toda mineração rende o dobro."
    perks:
      - "Título: Lenda da Mineração"

