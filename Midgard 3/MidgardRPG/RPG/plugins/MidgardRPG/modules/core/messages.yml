  category_player: "<yellow><bold>🎮 Comandos de Jogador:</bold></yellow>"
  category_moderator: "<yellow><bold>🛡️ Comandos de Moderador:</bold></yellow>"
  category_admin: "<yellow><bold>⚙️ Comandos Administrativos:</bold></yellow>"
