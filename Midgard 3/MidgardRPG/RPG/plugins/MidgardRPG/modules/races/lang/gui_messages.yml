    no_race: "<dark_gray>ꜱᴇᴍ ʟɪɴʜᴀɢᴇᴍ"
    no_race_lore: "\n<gray>ᴏ ᴊᴏɢᴀᴅᴏʀ ɴᴀᴏ ᴘᴏꜱꜱᴜɪ\n<gray>ᴜᴍᴀ ʟɪɴʜᴀɢᴇᴍ ᴅᴇꜰɪɴɪᴅᴀ."
  
  set_race:
    name: "<gradient:#06b6d4:#3b82f6>ᴅᴇꜰɪɴɪʀ ʟɪɴʜᴀɢᴇᴍ</gradient>"
    lore: "\n<gray>ᴇꜱᴄᴏʟʜᴀ ᴜᴍᴀ ʟɪɴʜᴀɢᴇᴍ\n<gray>ᴘᴀʀᴀ ᴏ ᴊᴏɢᴀᴅᴏʀ.\n\n<yellow>▶ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ᴇꜱᴄᴏʟʜᴇʀ"
  
  reset_race:
    name: "<gradient:#ef4444:#dc2626>ʀᴇꜱᴇᴛᴀʀ ʟɪɴʜᴀɢᴇᴍ</gradient>"
    lore: "\n<gray>ʀᴇᴍᴏᴠᴇ ᴀ ʟɪɴʜᴀɢᴇᴍ ᴅᴏ\n<gray>ᴊᴏɢᴀᴅᴏʀ ᴄᴏᴍᴘʟᴇᴛᴀᴍᴇɴᴛᴇ.\n\n<red>⚠ ᴀᴄᴀᴏ ɪʀʀᴇᴠᴇʀꜱɪᴠᴇʟ!\n\n<red>▶ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ʀᴇꜱᴇᴛᴀʀ"
    lore_disabled: "\n<dark_gray>ᴏ ᴊᴏɢᴀᴅᴏʀ ɴᴀᴏ ᴘᴏꜱꜱᴜɪ\n<dark_gray>ʟɪɴʜᴀɢᴇᴍ ᴘᴀʀᴀ ʀᴇꜱᴇᴛᴀʀ."
  
  level_down:
    name: "<red>◀ ɴɪᴠᴇʟ -</red>"
    lore: "\n<gray>ᴄʟɪǫᴜᴇ: <white>-1 ɴɪᴠᴇʟ\n<gray>ꜱʜɪꜰᴛ: <white>-5 ɴɪᴠᴇɪꜱ"
  
  level_info:
    name: "<gradient:#facc15:#f59e0b>ɴɪᴠᴇʟ %level%<dark_gray>/<gray>%max%</gradient>"
    lore: "\n<gray>ɴɪᴠᴇʟ ᴀᴛᴜᴀʟ: <light_purple>%level%\n<gray>ɴɪᴠᴇʟ ᴍᴀxɪᴍᴏ: <white>%max%\n\n<dark_gray>────────────────\n<gray>ʙᴏᴛᴀᴏ ᴅɪʀᴇɪᴛᴏ: <white>ɴɪᴠᴇʟ → 1\n<gray>ꜱʜɪꜰᴛ+ᴅɪʀᴇɪᴛᴏ: <gold>ɴɪᴠᴇʟ → %max%"
  
  level_up:
    name: "<green>ɴɪᴠᴇʟ + ▶</green>"
    lore: "\n<gray>ᴄʟɪǫᴜᴇ: <white>+1 ɴɪᴠᴇʟ\n<gray>ꜱʜɪꜰᴛ: <white>+5 ɴɪᴠᴇɪꜱ"
  
  xp_down:
    name: "<red>◀ xᴘ -</red>"
    lore: "\n<gray>ᴄʟɪǫᴜᴇ: <white>-100 xᴘ\n<gray>ꜱʜɪꜰᴛ: <white>-1000 xᴘ"
  
  xp_info:
    name: "<gradient:#facc15:#f59e0b>xᴘ %xp%<dark_gray>/<gray>%required%</gradient>"
    lore: "\n<gray>xᴘ ᴀᴛᴜᴀʟ: <white>%xp%\n<gray>ɴᴇᴄᴇꜱꜱᴀʀɪᴏ: <white>%required%\n\n<dark_gray>%bar%\n\n<dark_gray>────────────────\n<gray>ʙᴏᴛᴀᴏ ᴅɪʀᴇɪᴛᴏ: <white>xᴘ → 0\n<gray>ꜱʜɪꜰᴛ+ᴅɪʀᴇɪᴛᴏ: <gold>xᴘ → ᴍᴀx"
  
  xp_up:
    name: "<green>xᴘ + ▶</green>"
    lore: "\n<gray>ᴄʟɪǫᴜᴇ: <white>+100 xᴘ\n<gray>ꜱʜɪꜰᴛ: <white>+1000 xᴘ"

