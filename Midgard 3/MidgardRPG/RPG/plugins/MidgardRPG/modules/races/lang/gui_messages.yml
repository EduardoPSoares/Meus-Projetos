  title_icon:
    name: "<gradient:#ef4444:#dc2626>ᴘᴀɪɴᴇʟ ᴀᴅᴍɪɴɪꜱᴛʀᴀᴛɪᴠᴏ</gradient>"
    lore: "\n<gray>ɢᴇʀᴇɴᴄɪᴇ ᴊᴏɢᴀᴅᴏʀᴇꜱ ᴏɴʟɪɴᴇ.\n<dark_gray>ᴄʟɪǫᴜᴇ ᴇᴍ ᴜᴍ ᴊᴏɢᴀᴅᴏʀ ᴘᴀʀᴀ\n<dark_gray>ɢᴇʀᴇɴᴄɪᴀʀ ꜱᴜᴀ ʟɪɴʜᴀɢᴇᴍ."
  
  player_item:
    name: "<aqua>%player%</aqua>"
    lore: "\n<dark_gray>├ <gray>ʟɪɴʜᴀɢᴇᴍ: <white>%race%\n<dark_gray>├ <gray>ɴɪᴠᴇʟ: <light_purple>%level%\n<dark_gray>└ <gray>xᴘ: <white>%xp%\n\n<yellow>▶ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ɢᴇʀᴇɴᴄɪᴀʀ"
  
  reload:
    name: "<gradient:#22c55e:#16a34a>ʀᴇᴄᴀʀʀᴇɢᴀʀ</gradient>"
    lore: "\n<gray>ʀᴇᴄᴀʀʀᴇɢᴀʀ ᴄᴏɴꜰɪɢᴜʀᴀᴄᴏᴇꜱ\n<gray>ᴇ ᴍᴇɴꜱᴀɢᴇɴꜱ ᴅᴏ ᴍᴏᴅᴜʟᴏ.\n\n<green>▶ ᴄʟɪǫᴜᴇ ᴘᴀʀᴀ ʀᴇᴄᴀʀʀᴇɢᴀʀ"
  
  stats:
    name: "<gradient:#a855f7:#ec4899>ᴇꜱᴛᴀᴛɪꜱᴛɪᴄᴀꜱ</gradient>"
    lore: "\n<dark_gray>├ <gray>ᴛᴏᴛᴀʟ: <white>%total%\n<dark_gray>├ <gray>ʙᴀꜱᴇ: <white>%base%\n<dark_gray>├ <gray>ᴇᴠᴏʟᴜᴄᴏᴇꜱ: <white>%sub%\n<dark_gray>├ <gray>ᴏɴʟɪɴᴇ: <white>%online%\n<dark_gray>└ <gray>ᴄᴏᴍ ʀᴀᴄᴀ: <white>%with_race%"

