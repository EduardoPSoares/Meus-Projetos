# ============================================
# MIDGARD COMBAT MODULE - MESSAGES
# ============================================
# Formato: Small Caps Unicode para estilo visual

# ============================================
# MODO DE COMBATE
# ============================================
combat_mode:
  enabled: "<red>⚔</red> <gray>ᴍᴏᴅᴏ ᴅᴇ ᴄᴏᴍʙᴀᴛᴇ ᴀᴛɪᴠᴀᴅᴏ.</gray>"
  disabled: "<green>✔</green> <gray>ᴍᴏᴅᴏ ᴅᴇ ᴄᴏᴍʙᴀᴛᴇ ᴅᴇsᴀᴛɪᴠᴀᴅᴏ.</gray>"
  
  warning_5s: "<yellow>⚠</yellow> <gray>ᴄᴏᴍʙᴀᴛᴇ ᴛᴇʀᴍɪɴᴀ ᴇᴍ <red>5 sᴇɢᴜɴᴅᴏs</red><gray>...</gray>"
  warning_3s: "<yellow>⚠</yellow> <gray>ᴄᴏᴍʙᴀᴛᴇ ᴛᴇʀᴍɪɴᴀ ᴇᴍ <red>3 sᴇɢᴜɴᴅᴏs</red><gray>...</gray>"
  expired: "<green>✔</green> <gray>ᴠᴏᴄᴇ sᴀɪᴜ ᴅᴇ ᴄᴏᴍʙᴀᴛᴇ.</gray>"
  
  cannot_logout: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴘᴏᴅᴇ ᴅᴇsʟᴏɢᴀʀ ᴇᴍ ᴄᴏᴍʙᴀᴛᴇ.</gray>"
  cannot_teleport: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴘᴏᴅᴇ sᴇ ᴛᴇʟᴇᴘᴏʀᴛᴀʀ ᴇᴍ ᴄᴏᴍʙᴀᴛᴇ.</gray>"
  cannot_use_command: "<red>✖</red> <gray>ᴄᴏᴍᴀɴᴅᴏ ʙʟᴏԡᴜᴇᴀᴅᴏ ᴅᴜʀᴀɴᴛᴇ ᴄᴏᴍʙᴀᴛᴇ.</gray>"
  
  time_remaining: "<gray>ᴛᴇᴍᴘᴏ ʀᴇsᴛᴀɴᴛᴇ: <red>%time%s</red>"
  opponent: "<gray>ᴏᴘᴏɴᴇɴᴛᴇ: <red>%target%</red>"

# ============================================
# COMBATE ELEMENTAL
# ============================================
elemental:
  fire: "<red>🔥 ꜰᴏɢᴏ</red>"
  water: "<blue>💧 ᴀɢᴜᴀ</blue>"
  earth: "<gold>⛰ ᴛᴇʀʀᴀ</gold>"
  air: "<gray>💨 ᴀʀ</gray>"
  ice: "<aqua>❄ ɢᴇʟᴏ</aqua>"
  thunder: "<yellow>⚡ ʀᴀɪᴏ</yellow>"
  light: "<yellow>☀ ʟᴜz</yellow>"
  darkness: "<dark_purple>🌙 ᴛʀᴇᴠᴀs</dark_purple>"
  divine: "<light_purple>✦ ᴅɪᴠɪɴᴏ</light_purple>"
  
  burning: "<red>🔥</red> <gray>ᴠᴏᴄᴇ ᴇsᴛᴀ ԡᴜᴇɪᴍᴀɴᴅᴏ: <red>-%damage% ❤/s</red>"
  frozen: "<aqua>❄</aqua> <gray>ᴠᴏᴄᴇ ᴇsᴛᴀ ᴄᴏɴɢᴇʟᴀᴅᴏ. <dark_gray>(ᴍᴏᴠɪᴍᴇɴᴛᴏ ʀᴇᴅᴜzɪᴅᴏ)</dark_gray>"
  shocked: "<yellow>⚡</yellow> <gray>ᴠᴏᴄᴇ ᴇsᴛᴀ ᴇʟᴇᴛʀɪzᴀᴅᴏ: <yellow>-%damage% ❤/s</yellow>"
  poisoned: "<green>☠</green> <gray>ᴠᴏᴄᴇ ᴇsᴛᴀ ᴇɴᴠᴇɴᴇɴᴀᴅᴏ: <green>-%damage% ❤/s</green>"
  
  resistance_high: "<green>↑</green> <gray>ʀᴇsɪsᴛᴇɴᴄɪᴀ: <green>+%amount%%</green>"
  resistance_low: "<red>↓</red> <gray>ꜰʀᴀԡᴜᴇzᴀ: <red>-%amount%%</red>"
  immunity: "<gold>★</gold> <gray>ɪᴍᴜɴɪᴅᴀᴅᴇ: %element%"

# ============================================
# STATUS E REGENERAÇÃO
# ============================================
status:
  stamina_low: "<yellow>⚠</yellow> <gray>sᴜᴀ sᴛᴀᴍɪɴᴀ ᴇsᴛᴀ ʙᴀɪxᴀ.</gray>"
  stamina_exhausted: "<red>⚠</red> <gray>ᴠᴏᴄᴇ ᴇsᴛᴀ ᴇxᴀᴜsᴛᴏ.</gray>"
  health_regenerated: "<green>+%amount% ❤</green>"
  mana_regenerated: "<blue>+%amount% 💧</blue>"

# ============================================
# PROGRESSÃO DE COMBATE
# ============================================
progression:
  combat_level_up: "<yellow>⚔ ᴄᴏᴍʙᴀᴛ ʟᴇᴠᴇʟ ᴜᴘ!</yellow> <gray>ɴɪᴠᴇʟ <white>%level%</white><gray>!</gray>"
  xp_gained: "<gray>+<yellow>%xp%</yellow> xᴘ ᴅᴇ ᴄᴏᴍʙᴀᴛᴇ</gray>"
  xp_indicator: "<yellow>+%xp% xᴘ</yellow>"

mob:
  unknown_name: "Desconhecido"

# ============================================
# COMANDOS E ADMIN
# ============================================
commands:
  xp:
    help_title: "<aqua>ᴍɪᴅɢᴀʀᴅ ᴄᴏᴍʙᴀᴛ xᴘ</aqua>"
    help_lines:
      - "<white>/rpg admin xp add <player> <amount></white> <gray>- ᴀᴅɪᴄɪᴏɴᴀ xᴘ</gray>"
      - "<white>/rpg admin xp set <player> <amount></white> <gray>- ᴅᴇꜰɪɴᴇ xᴘ</gray>"
      - "<white>/rpg admin xp take <player> <amount></white> <gray>- ʀᴇᴍᴏᴠᴇ xᴘ</gray>"
    usage_add: "<yellow>⚠</yellow> <gray>ᴜsᴏ: <white>/rpg admin xp add <player> <amount></white>"
    usage_set: "<yellow>⚠</yellow> <gray>ᴜsᴏ: <white>/rpg admin xp set <player> <amount></white>"
    usage_take: "<yellow>⚠</yellow> <gray>ᴜsᴏ: <white>/rpg admin xp take <player> <amount></white>"
    success_add: "<green>✔</green> <gray>xᴘ ᴀᴅɪᴄɪᴏɴᴀᴅᴏ ᴘᴀʀᴀ <aqua>%player%</aqua><gray>: <yellow>%amount%</yellow><gray>.</gray>"
    success_set: "<green>✔</green> <gray>xᴘ ᴅᴇ <aqua>%player%</aqua> <gray>ᴅᴇꜰɪɴɪᴅᴏ ᴘᴀʀᴀ <yellow>%xp%</yellow><gray>.</gray>"
    success_take: "<green>✔</green> <gray>xᴘ ʀᴇᴍᴏᴠɪᴅᴏ ᴅᴇ <aqua>%player%</aqua><gray>: <yellow>%amount%</yellow><gray>.</gray>"

errors:
  no_permission: "<red>✖</red> <gray>ᴠᴏᴄᴇ ɴᴀᴏ ᴛᴇᴍ ᴘᴇʀᴍɪssᴀᴏ ᴘᴀʀᴀ ɪssᴏ.</gray>"
  player_not_found: "<red>✖</red> <gray>ᴊᴏɢᴀᴅᴏʀ ɴᴀᴏ ᴇɴᴄᴏɴᴛʀᴀᴅᴏ: <white>%player%</white><gray>.</gray>"
  profile_error: "<red>✖</red> <gray>ᴘᴇʀꜰɪʟ ᴅᴏ ᴊᴏɢᴀᴅᴏʀ ɴᴀᴏ ᴄᴀʀʀᴇɢᴀᴅᴏ.</gray>"
  invalid_number: "<red>✖</red> <gray>ɴᴜᴍᴇʀᴏ ɪɴᴠᴀʟɪᴅᴏ.</gray>"

# ============================================
# ARMAS E EQUIPAMENTOS
# ============================================
weapons:
  equipped: "<green>✔</green> <gray>ᴇǫᴜɪᴘᴀᴅᴏ: <white>%weapon%</white>"
  unequipped: "<yellow>⚠</yellow> <gray>ᴅᴇsᴇǫᴜɪᴘᴀᴅᴏ: <white>%weapon%</white>"
  durability_low: "<yellow>⚠</yellow> <white>%weapon%</white> <gray>ᴇsᴛᴀ ǫᴜᴇʙʀᴀɴᴅᴏ: <red>%durability%</red>"
  durability_broken: "<red>✖</red> <white>%weapon%</white> <gray>ǫᴜᴇʙʀᴏᴜ.</gray>"
  durability_repaired: "<green>✔</green> <white>%weapon%</white> <gray>ʀᴇᴘᴀʀᴀᴅᴏ.</gray>"
  skill_activated: "<gold>★</gold> <gray>ʜᴀʙɪʟɪᴅᴀᴅᴇ ᴀᴛɪᴠᴀᴅᴀ: <yellow>%skill%</yellow>"
  skill_cooldown: "<red>⏱</red> <gray>ʜᴀʙɪʟɪᴅᴀᴅᴇ ᴇᴍ ʀᴇᴄᴀʀɢᴀ: <white>%time%s</white>"
  enchant_triggered: "<light_purple>✦</light_purple> <light_purple>%enchant%</light_purple> <gray>ᴀᴛɪᴠᴀᴅᴏ.</gray>"

# ============================================
# DUMMY (PVP TEST)
# ============================================
dummy:
  usage: "<yellow>⚠</yellow> <gray>ᴜsᴏ: <white>/rpg admin dummy <create|clear> [type]</white>"
  indicator_test: "<green>✔</green> <gray>ɪɴᴅɪᴄᴀᴅᴏʀ ᴅᴇ ᴛᴇsᴛᴇ ᴇɴᴠɪᴀᴅᴏ.</gray>"
  nms_test: "<green>✔</green> <gray>ᴘᴀᴄᴏᴛᴇ ɴᴍs ᴇɴᴠɪᴀᴅᴏ.</gray>"
  nms_null: "<red>✖</red> <gray>ʜᴀɴᴅʟᴇʀ ɴᴍs ɴᴀᴏ ᴇɴᴄᴏɴᴛʀᴀᴅᴏ.</gray>"
  nms_error: "<red>✖</red> <gray>ᴇʀʀᴏ ᴀᴏ ᴇɴᴠɪᴀʀ ᴘᴀᴄᴏᴛᴇ ɴᴍs: <white>%error%</white>"
  removed: "<green>✔</green> <gray>ʀᴇᴍᴏᴠɪᴅᴏs <white>%count%</white> <gray>ᴅᴜᴍᴍɪᴇs.</gray>"
  display_name: "<red><bold>%type% ʙᴏɴᴇᴄᴏ</bold></red> <dark_gray>[</dark_gray><green>||||||||||||||||||||</green><dark_gray>]</dark_gray>"
  spawn:
    warn_unknown: "<yellow>⚠</yellow> <gray>ᴛɪᴘᴏ <white>%type%</white> <gray>ᴅᴇsᴄᴏɴʜᴇᴄɪᴅᴏ. ᴄʀɪᴀɴᴅᴏ ᴘᴀᴅʀᴀᴏ.</gray>"
    success: "<green>✔</green> <gray>ʙᴏɴᴇᴄᴏ <white>%type%</white> <gray>ᴄʀɪᴀᴅᴏ.</gray>"
    error: "<red>✖</red> <gray>ᴇʀʀᴏ ᴀᴏ sᴘᴀᴡɴᴀʀ ᴅᴜᴍᴍʏ: <white>%error%</white>"

